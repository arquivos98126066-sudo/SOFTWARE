<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Entrar</title>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<style>body{font:16px system-ui;background:#faf6ee;color:#14213d;margin:0;padding:24px 16px}h1{font-size:20px}p{line-height:1.5}input{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid #e6dcc6;border-radius:10px;background:#fff}button{font:inherit;padding:12px 18px;border-radius:10px;border:0;background:#2f6b3a;color:#fff;margin-top:8px}.r{background:#fff;border:1px solid #e6dcc6;border-radius:12px;padding:14px;margin-top:12px;word-break:break-word;white-space:pre-wrap}a{color:#b07a1a}</style></head><body>
<h1>Entrar e trazer meus dados</h1>
<p>Digite o e-mail e a senha. A página busca sua cópia no Firebase e grava neste aparelho. Troca o que este aparelho tem.</p>
<input id="e" type="email" autocomplete="username" placeholder="E-mail">
<input id="s" type="password" autocomplete="current-password" placeholder="Senha">
<button id="b">Entrar e trazer</button>
<div class="r" id="r">Aguardando.</div>
<p id="l" style="display:none"><a href="index.html?ts=1">Abrir o menu</a></p>
<script>
var CH='AIzaSyDPJvM-XZWfa8HQ7h8v0Usb1Hf3q8sDqpg',PROJ='https://firestore.googleapis.com/v1/projects/meus-apps-8ca76/databases/(default)/documents/';
var R=document.getElementById('r');function say(t){R.textContent=t}
function lim(pr,ms,n){return Promise.race([pr,new Promise(function(_,rj){setTimeout(function(){rj(new Error(n+' demorou mais de '+ms/1000+'s'))},ms)})])}
async function vai(){
 var b=document.getElementById('b');b.disabled=true;
 try{
  say('1/4 entrando...');
  var rl=await lim(fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('e').value.trim(),password:document.getElementById('s').value,returnSecureToken:true})}),20000,'login');
  var j=await rl.json();
  if(!rl.ok){throw new Error('login recusado: '+((j.error&&j.error.message)||rl.status))}
  try{if(j.refreshToken)localStorage.setItem('nv.rt',j.refreshToken)}catch(e){}
  var tk=j.idToken,H={'Authorization':'Bearer '+tk};
  async function lista(col){var out=[],pg='';for(var n=0;n<8;n++){var r=await lim(fetch(PROJ+col+'?pageSize=300'+pg,{headers:H}),20000,'ler '+col);if(!r.ok)throw new Error('ler '+col+': '+r.status);var d=await r.json();out=out.concat(d.documents||[]);if(!d.nextPageToken)break;pg='&pageToken='+encodeURIComponent(d.nextPageToken)}return out}
  function campo(d,c){return d.fields&&d.fields[c]?d.fields[c].stringValue:null}
  function idDoc(d){try{return decodeURIComponent(d.name.split('/').pop())}catch(e){return ''}}
  say('2/4 lendo a cópia...');
  var bk=await lista('aparelho_backup'),man=null;
  bk.forEach(function(d){if(idDoc(d)==='_chaves'){try{man=JSON.parse(campo(d,'v'))}catch(e){}}});
  if(!man||!man.length)throw new Error('a cópia não tem a lista de chaves; nada foi gravado');
  var ok={};man.forEach(function(c){ok[c]=1});
  var dest={},rico=await lista('aparelho_rico'),pl=await lista('aparelho_plano');
  rico.forEach(function(d){var kk=campo(d,'k'),v=campo(d,'v');if(kk&&v!=null&&kk.indexOf('rico.seed.')!==0&&ok['aparelho_rico/'+idDoc(d)])dest[kk]=v});
  var itens={},ordem=null,seeds=null;
  pl.forEach(function(d){var kk=campo(d,'k'),v=campo(d,'v');if(!kk||v==null||!ok['aparelho_plano/'+idDoc(d)])return;try{if(kk==='doa_htmls_v1/_ordem'){var o=JSON.parse(v);ordem=o.ids||[];seeds=o.seeds}else{var it=JSON.parse(v);if(it&&it.id)itens[it.id]=it}}catch(e){}});
  if(Object.keys(itens).length){var arr=[],us={};(ordem||[]).forEach(function(id){if(itens[id]){arr.push(itens[id]);us[id]=1}});Object.keys(itens).forEach(function(id){if(!us[id])arr.push(itens[id])});dest['doa_htmls_v1']=JSON.stringify(arr);if(seeds!=null)dest['doa_htmls_v1_seeds']=seeds}
  bk.forEach(function(d){var kk=campo(d,'k'),v=campo(d,'v');if(kk==='estudos.meta.v1'&&v!=null&&ok['aparelho_backup/'+idDoc(d)])dest[kk]=v});
  var ks=Object.keys(dest);
  if(!ks.length)throw new Error('a cópia não trouxe nenhum item; nada foi gravado');
  say('3/4 gravando '+ks.length+' itens...');
  ks.forEach(function(k){localStorage.setItem(k,dest[k])});
  localStorage.setItem('backup.ap.rest','sim');
  var conf=ks.filter(function(k){return localStorage.getItem(k)===dest[k]}).length;
  say('4/4 pronto: '+conf+' de '+ks.length+' itens gravados neste aparelho.\nAgora toque em "Abrir o menu". Se o menu pedir senha, entre de novo.');
  document.getElementById('l').style.display='block';
 }catch(e){say('Falhou: '+e.message)}
 b.disabled=false;
}
document.getElementById('b').onclick=vai;
</script></body></html>
