<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Estudo</title>
<script src="https://arquivos98126066-sudo.github.io/SOFTWARE/sync-indicator.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --bg2: #000000;
  --surface: #0a0a0a;
  --surface2: #111111;
  --border: rgba(52,211,153,0.12);
  --border2: rgba(52,211,153,0.22);
  --accent: #34d399;
  --accent2: #6ee7b7;
  --accent3: #10b981;
  --text: #e8f5ee;
  --muted: #4a7a62;
  --muted2: #7aad90;
  --danger: #f87171;
  --green: #34d399;
  --radius: 14px;
  --glass: rgba(52,211,153,0.03);
  --glass2: rgba(52,211,153,0.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;min-height:100vh;}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
body::before{ display:none; }

/* TOAST */
#toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  background: var(--accent); color: #071a0f;
  padding: 10px 22px; border-radius: 99px;
  font-size: 13px; font-weight: 600;
  z-index: 9999; transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* HEADER */
header {
  padding: 20px 20px 0; position:sticky;top:0;z-index:200;
  background:rgba(0,0,0,0.97);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  max-width: 640px; margin: 0 auto;
  padding-bottom:14px;
}
.logo-wrap { display: flex; align-items: center; gap: 8px; }
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 20px; font-weight: 700; letter-spacing: 3px;
  background: linear-gradient(120deg, var(--accent2) 0%, var(--accent) 50%, var(--accent3) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-transform: uppercase; cursor: pointer; transition: opacity 0.2s;
}
.logo:hover { opacity: 0.75; }
.logo-edit-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; display: flex; align-items: center; transition: color 0.15s;
}
.logo-edit-btn:hover { color: var(--accent2); }
.logo-edit-btn svg { width: 13px; height: 13px; }
.logo-input {
  font-family: 'DM Serif Display', serif; font-size: 16px; font-weight: 700;
  letter-spacing: 3px; background: var(--surface2); border: 1px solid var(--accent);
  border-radius: 6px; color: var(--accent); padding: 4px 10px; outline: none;
  text-transform: uppercase; max-width: 180px;
}
.header-btns { display: flex; gap: 8px; align-items: center; }
.trash-btn {
  background: none; border: 1px solid var(--border2);
  color: var(--muted2); border-radius: 10px;
  padding: 7px 12px; font-family: 'Outfit', sans-serif;
  font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: border-color 0.2s, color 0.2s;
}
.trash-btn:hover { border-color: var(--danger); color: var(--danger); }
.trash-btn svg { width: 14px; height: 14px; }
.trash-count {
  background: var(--danger); color: #fff;
  border-radius: 99px; font-size: 10px;
  padding: 1px 6px; font-weight: 700; display: none;
}
.trash-count.show { display: inline; }
/* BOTÃO + NO HEADER — removido, integrado ao header-btns */

/* PROGRESS */
.global-progress { max-width: 640px; margin: 10px auto 10px; padding: 0 20px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted);
  margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase;
}
.progress-label .pct { color: var(--accent); font-weight: 600; }
.progress-bar-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent3), var(--accent2));
  border-radius: 99px; transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* MAIN */
main { max-width: 640px; margin: 0 auto; padding: 6px 20px 140px; position:relative;z-index:1; }

/* ADD PASTA BTN — removido do layout */
.add-folder-btn { display: none; }

/* FOLDER */
.folder {
  background: #000;
  border: 1px solid rgba(52,211,153,0.12);
  border-radius: var(--radius); margin-bottom: 12px;
  overflow: hidden; transition: box-shadow 0.3s, border-color 0.3s;
  box-shadow: 0 0 18px rgba(16,185,129,0.13), 0 2px 8px rgba(16,185,129,0.07);
}
.folder:hover {
  border-color: rgba(52,211,153,0.22);
  box-shadow: 0 0 28px rgba(16,185,129,0.22), 0 4px 16px rgba(16,185,129,0.12);
}
.folder-header {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
}
.folder-icon { font-size: 16px; flex-shrink: 0; }
.folder-name {
  font-size: 14px; font-weight: 500; flex: 1;
  color: var(--text); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.folder-stats { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.folder-stats .done { color: var(--accent); }
.folder-chevron {
  width: 16px; height: 16px; color: var(--muted);
  transition: transform 0.2s; flex-shrink: 0;
}
.folder.open .folder-chevron { transform: rotate(90deg); }
.folder-progress { height: 2px; background: var(--border); margin: 0 16px; }
.folder-progress-fill { height: 100%; background: linear-gradient(90deg,var(--accent3),var(--accent2)); transition: width 0.4s; }
.folder-body { display: none; padding: 8px 12px 12px; }
.folder.open .folder-body { display: block; }

/* MOVE / ICON BTNS */
.move-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 3px; border-radius: 4px;
  display: flex; align-items: center; transition: color 0.15s; flex-shrink: 0;
}
.move-btn:hover { color: var(--accent); }
.move-btn svg { width: 13px; height: 13px; }
.icon-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; border-radius: 4px;
  display: flex; align-items: center; transition: color 0.15s; flex-shrink: 0;
}
.icon-btn.edit:hover { color: var(--accent2); }
.icon-btn.danger:hover { color: var(--danger); }
.icon-btn svg { width: 14px; height: 14px; }

/* INLINE EDIT */
.folder-inline-edit {
  background: var(--surface2); border: 1px solid var(--accent);
  border-radius: 6px; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 13px;
  padding: 4px 8px; outline: none; flex: 1; min-width: 0;
}
.chapter-inline-edit {
  background: var(--bg); border: 1px solid var(--accent2);
  border-radius: 6px; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 12px;
  padding: 3px 8px; outline: none; flex: 1; min-width: 0;
}

/* ADD FILES */
.add-files-area {
  border: 1.5px dashed var(--border2); border-radius: 8px;
  padding: 14px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 10px; position: relative; display: block;
}
.add-files-area:hover { border-color: var(--accent2); background: var(--glass); }
.add-files-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.add-files-area p { font-size: 12px; color: var(--muted); }
.add-files-area p span { color: var(--accent2); }

/* CHAPTER */
.chapter-list { display: flex; flex-direction: column; gap: 6px; }
.chapter-item {
  display: flex; align-items: center; gap: 8px;
  background: #111; border: 1px solid rgba(52,211,153,0.12);
  border-radius: 8px; padding: 10px 12px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  position: relative; overflow: hidden;
}
.chapter-item:hover { border-color: rgba(52,211,153,0.28); background: #151515; }
.chapter-item.copying { border-color: var(--accent); }
.chapter-num { font-size: 10px; color: var(--muted); min-width: 24px; text-align: right; flex-shrink: 0; }
.chapter-name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.chapter-edit-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 3px; display: flex; align-items: center;
  flex-shrink: 0; transition: color 0.15s;
}
.chapter-edit-btn:hover { color: var(--accent2); }
.chapter-edit-btn svg { width: 12px; height: 12px; }
.chapter-copy-icon { color: var(--muted); flex-shrink: 0; display: flex; align-items: center; }
.done-btn {
  background: none; border: 1px solid var(--border2);
  color: var(--muted2); font-family: 'Outfit', sans-serif;
  font-size: 11px; padding: 4px 10px; border-radius: 99px;
  cursor: pointer; white-space: nowrap;
  transition: border-color 0.15s, color 0.15s; flex-shrink: 0;
}
.done-btn:hover { border-color: var(--accent); color: var(--accent); }
.del-chapter-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 3px; display: flex; align-items: center;
  flex-shrink: 0; transition: color 0.15s;
}
.del-chapter-btn:hover { color: var(--danger); }
.del-chapter-btn svg { width: 13px; height: 13px; }

/* EMPTY */
.empty-msg { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }
.all-done { text-align: center; padding: 30px 0; }
.all-done .emoji { font-size: 40px; margin-bottom: 8px; }
.all-done p { font-size: 13px; color: var(--muted); }
.all-done strong { color: var(--accent); }

/* MODAL NOVA PASTA */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: #0d2218; border: 1px solid var(--border2);
  border-radius: 28px 28px 0 0; padding: 24px 20px 36px;
  width: 100%; max-width: 640px;
  transform: translateY(40px);
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.modal input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 12px; padding: 12px 14px; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 14px; outline: none;
  transition: border-color 0.2s; margin-bottom: 12px;
}
.modal input:focus { border-color: var(--accent); }
.modal .hint { font-size: 11px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.modal .hint span { color: var(--accent); }
.modal-actions { display: flex; gap: 8px; }
.btn-primary {
  flex: 1; background: linear-gradient(135deg,var(--accent3),var(--accent2)); color: #071a0f; border: none;
  border-radius: 12px; padding: 12px; font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-cancel {
  background: none; border: 1px solid var(--border2); color: var(--muted2);
  border-radius: 12px; padding: 12px 20px; font-family: 'Outfit', sans-serif;
  font-size: 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
}
.btn-cancel:hover { border-color: var(--danger); color: var(--danger); }

/* LIXEIRA DRAWER */
.trash-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.trash-overlay.show { opacity: 1; pointer-events: all; }
.trash-drawer {
  background: #0d2218; border: 1px solid var(--border2);
  border-radius: 24px 24px 0 0; width: 100%; max-width: 640px;
  max-height: 75vh; display: flex; flex-direction: column;
  transform: translateY(40px); transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
}
.trash-overlay.show .trash-drawer { transform: translateY(0); }
.trash-drawer-header {
  padding: 20px 20px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.trash-drawer-header h3 { font-size: 18px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.trash-drawer-header h3 svg { width: 18px; height: 18px; color: var(--danger); }
.close-trash-btn {
  background: none; border: 1px solid var(--border2); color: var(--muted2);
  font-family: 'Outfit', sans-serif; font-size: 13px;
  cursor: pointer; padding: 6px 12px; border-radius: 8px;
  transition: border-color 0.15s, color 0.15s;
}
.close-trash-btn:hover { border-color: var(--text); color: var(--text); }
.trash-list { overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
.trash-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.trash-item-info { flex: 1; min-width: 0; }
.trash-item-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trash-item-folder { font-size: 11px; color: var(--muted); margin-top: 2px; }
.restore-btn {
  background: none; border: 1px solid var(--border2);
  color: var(--accent2); font-family: 'Outfit', sans-serif;
  font-size: 11px; padding: 5px 12px; border-radius: 99px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: border-color 0.15s, background 0.15s;
}
.restore-btn:hover { border-color: var(--accent2); background: rgba(110,231,183,0.08); }
.perm-del-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; display: flex; align-items: center;
  flex-shrink: 0; transition: color 0.15s;
}
.perm-del-btn:hover { color: var(--danger); }
.perm-del-btn svg { width: 14px; height: 14px; }
.trash-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0; }

/* RIPPLE */
@keyframes ripple { from { transform: scale(0); opacity: 0.4; } to { transform: scale(3); opacity: 0; } }
.ripple-el {
  position: absolute; width: 60px; height: 60px; border-radius: 50%;
  background: var(--accent); pointer-events: none;
  animation: ripple 0.5s ease-out forwards;
}

/* ═══ FLUTUANTE FM ═══ */
.fm-wrap {
  position: fixed; bottom: 1.5rem; right: 1rem;
  z-index: 300; pointer-events: none;
  display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
}
.fm-fab {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent3), var(--accent2));
  border: none; color: #071a0f; font-size: 1.4rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(52,211,153,0.5);
  pointer-events: auto; transition: transform 0.2s;
}
.fm-fab:active { transform: scale(0.9); }

/* ═══ GERENCIADOR OVERLAY ═══ */
.fm-overlay {
  display: none; position: fixed; inset: 0; z-index: 9200;
  background: #000; flex-direction: column; font-family: 'Outfit', sans-serif;
}
.fm-overlay.open { display: flex; }
.fm-header {
  padding: 0.8rem 1rem;
  background: #000;
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.fm-back {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--glass2); border: 1px solid var(--border2);
  color: var(--text); font-size: 0.8rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.fm-path { flex: 1; font-size: 0.72rem; color: var(--muted2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-hbtn {
  background: var(--glass); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--muted2); font-family: 'Outfit', sans-serif;
  font-size: 0.7rem; padding: 0.3rem 0.55rem; cursor: pointer; white-space: nowrap;
  transition: background 0.15s;
}
.fm-hbtn:active { background: var(--glass2); }
.fm-add-btn {
  background: linear-gradient(135deg,var(--accent3),var(--accent2));
  border: none; border-radius: 50px; color: #071a0f;
  font-family: 'Outfit', sans-serif; font-size: 0.7rem; font-weight: 700;
  padding: 0.35rem 0.9rem; cursor: pointer; white-space: nowrap;
}
.fm-list { flex: 1; overflow-y: auto; padding: 0.6rem; }
.fm-item {
  display: flex; align-items: center; gap: 10px;
  padding: 0.65rem 0.8rem; border-radius: 14px;
  border: 1px solid var(--border); background: var(--glass);
  margin-bottom: 6px; cursor: pointer; transition: background 0.15s;
  -webkit-user-select: none; user-select: none;
}
.fm-item:active { background: var(--glass2); }
.fm-item-icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; }
.fm-item-info { flex: 1; overflow: hidden; }
.fm-item-name { font-size: 0.78rem; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-item-meta { font-size: 0.6rem; color: var(--muted); margin-top: 1px; }
.fm-item-del {
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2);
  color: var(--danger); font-size: 0.7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.fm-item-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--glass);
  color: var(--muted2); font-size: 0.75rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.15s;
}
.fm-item-btn:active { transform: scale(0.9); }
.fm-empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.8rem; }

/* SORT BAR */
.fm-sort-bar {
  display: flex; align-items: center; gap: 5px;
  padding: 0.35rem 0.8rem;
  background: #000;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
}
.fm-sort-bar::-webkit-scrollbar { display: none; }
.fm-sort-chip {
  padding: 0.2rem 0.55rem; border-radius: 50px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--muted2); font-family: 'Outfit', sans-serif;
  font-size: 0.62rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.fm-sort-chip.active { background: rgba(52,211,153,0.15); border-color: var(--accent); color: var(--text); }

/* SEARCH BAR */
.fm-search-bar {
  display: none; padding: 0.5rem 0.8rem 0.4rem;
  background: #000;
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0; gap: 6px; flex-direction: column;
}
.fm-search-bar.open { display: flex; }
.fm-search-row { display: flex; gap: 6px; align-items: center; }
.fm-search-inp {
  flex: 1; background: var(--glass2);
  border: 1px solid var(--border2); border-radius: 10px;
  padding: 0.45rem 0.7rem; color: var(--text);
  font-family: 'Outfit', sans-serif; font-size: 0.8rem; outline: none;
}
.fm-search-inp:focus { border-color: var(--accent); }
.fm-search-inp::placeholder { color: var(--muted); }
.fm-search-close { background: transparent; border: none; color: var(--muted2); font-size: 1rem; cursor: pointer; padding: 0.2rem 0.4rem; }

/* CONFIRM DIALOG */
.fm-confirm-overlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  align-items: center; justify-content: center; padding: 1.5rem;
}
.fm-confirm-overlay.open { display: flex; }
.fm-confirm-box {
  background: #0d2218; border: 1px solid var(--border2);
  border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 320px;
  text-align: center; animation: fmSlideUp 0.2s ease; font-family: 'Outfit', sans-serif;
}
@keyframes fmSlideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.fm-confirm-box p { font-size: 0.88rem; line-height: 1.6; margin-bottom: 1.2rem; color: var(--text); }
.fm-confirm-box strong { color: var(--danger); }
.fm-confirm-btns { display: flex; gap: 10px; }
.fm-confirm-cancel { flex: 1; padding: 0.65rem; border: 1px solid var(--border2); border-radius: 12px; background: transparent; color: var(--muted2); font-family: 'Outfit', sans-serif; font-size: 0.85rem; cursor: pointer; }
.fm-confirm-ok { flex: 1; padding: 0.65rem; border: none; border-radius: 12px; background: linear-gradient(135deg,#ef4444,#f97316); color: #fff; font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

<!-- ═════════════════════════════ SCRIPTS ═════════════════════════════ -->
<script type="module">
import { db } from "https://arquivos98126066-sudo.github.io/SOFTWARE/firebase-sync.js";
import {
  collection, addDoc, getDocs, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, writeBatch, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ══════════════════════════════════════════
   PARTE 1 — SISTEMA DE ESTUDO
══════════════════════════════════════════ */
var pastasCache = [];
var lixeiraCache = [];

window.showToast = function(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
};

var paginaTitulo = 'ESTUDO';
window.startEditTitle = function(){
  var logoEl = document.getElementById('logoText');
  var input = document.createElement('input');
  input.className = 'logo-input';
  input.value = paginaTitulo;
  input.maxLength = 30;
  logoEl.replaceWith(input);
  input.focus(); input.select();
  function confirmTitle(){
    var val = input.value.trim().toUpperCase();
    if(val) paginaTitulo = val;
    document.title = paginaTitulo;
    var span = document.createElement('span');
    span.className = 'logo';
    span.id = 'logoText';
    span.onclick = startEditTitle;
    span.textContent = paginaTitulo;
    input.replaceWith(span);
    try { setDoc(doc(db,'estudo_config','data'), { titulo: paginaTitulo }).catch(function(){}); } catch(e) {}
  }
  input.addEventListener('blur', confirmTitle);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape') { input.value = paginaTitulo; input.blur(); }
    e.stopPropagation();
  });
  input.addEventListener('click', function(e){ e.stopPropagation(); });
};

(async function loadTitle(){
  try {
    var snap = await getDoc(doc(db,'estudo_config','data'));
    if(snap.exists() && snap.data().titulo){
      paginaTitulo = snap.data().titulo;
      var el = document.getElementById('logoText');
      if(el) el.textContent = paginaTitulo;
      document.title = paginaTitulo;
    }
  } catch(e) {}
})();

function extractOrder(name) {
  var m = name.match(/^\((\d+)\)/);
  return m ? parseInt(m[1]) : 9999;
}
function sortChapters(chapters) {
  return [...chapters].sort(function(a,b){
    var numA = parseInt((a.name.match(/\d+/) || ['0'])[0]);
    var numB = parseInt((b.name.match(/\d+/) || ['0'])[0]);
    if(numA !== numB) return numA - numB;
    return a.name.localeCompare(b.name);
  });
}
function globalStats() {
  var total=0, done=0;
  pastasCache.forEach(function(f){
    total += (f.chapters||[]).length;
    done  += (f.chapters||[]).filter(function(c){return c.done;}).length;
  });
  return {total, done};
}

window.moveFolderUp = async function(fid){
  var idx = pastasCache.findIndex(function(f){ return f.id == fid; });
  if(idx <= 0) return;
  var tmp = pastasCache[idx-1]; pastasCache[idx-1] = pastasCache[idx]; pastasCache[idx] = tmp;
  await saveFolderOrder(); render();
};
window.moveFolderDown = async function(fid){
  var idx = pastasCache.findIndex(function(f){ return f.id == fid; });
  if(idx < 0 || idx >= pastasCache.length-1) return;
  var tmp = pastasCache[idx+1]; pastasCache[idx+1] = pastasCache[idx]; pastasCache[idx] = tmp;
  await saveFolderOrder(); render();
};
async function saveFolderOrder(){
  if(window.syncShow) window.syncShow.syncing();
  try {
    var batch = writeBatch(db);
    pastasCache.forEach(function(f, i){
      if(!f.id.startsWith('local_')) batch.update(doc(db,'estudo_pastas', f.id), { ordem: i });
    });
    await batch.commit();
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) { if(window.syncShow) window.syncShow.offline(); }
}

window.openModal = function(){
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(function(){ document.getElementById('folderNameInput').focus(); }, 300);
};
window.closeModal = function(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('folderNameInput').value = '';
};
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('folderNameInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') createFolder();
});

window.createFolder = async function(){
  var name = document.getElementById('folderNameInput').value.trim();
  if(!name) return;
  var pasta = { name, open: true, chapters: [], criadoEm: new Date().toISOString(), ordem: pastasCache.length };
  if(window.syncShow) window.syncShow.syncing();
  try {
    var ref = await addDoc(collection(db,'estudo_pastas'), pasta);
    pasta.id = ref.id;
    pastasCache.push(pasta);
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    pasta.id = 'local_' + Date.now();
    pastasCache.push(pasta);
    if(window.syncShow) window.syncShow.local();
    showToast('Salvo localmente (offline)');
  }
  closeModal(); render();
};

window.openTrash = function(){
  renderTrash();
  document.getElementById('trashOverlay').classList.add('show');
};
window.closeTrash = function(){ document.getElementById('trashOverlay').classList.remove('show'); };
document.getElementById('trashOverlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('trashOverlay')) closeTrash();
});

function renderTrash(){
  var list = document.getElementById('trashList');
  if(!lixeiraCache.length){ list.innerHTML = '<div class="trash-empty">🗑️ Lixeira vazia</div>'; return; }
  list.innerHTML = lixeiraCache.map(function(item){
    return '<div class="trash-item">'
      +'<div class="trash-item-info">'
      +'<div class="trash-item-name">'+(item.chapterName||'').replace(/\.[^.]+$/,'')+'</div>'
      +'<div class="trash-item-folder">📁 '+item.folderName+'</div>'
      +'</div>'
      +'<button class="restore-btn" onclick="restoreChapter(\''+item.id+'\')">↩ Recuperar</button>'
      +'<button class="perm-del-btn" onclick="permDelete(\''+item.id+'\')" title="Excluir permanentemente">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      +'</button></div>';
  }).join('');
  updateTrashCount();
}

function updateTrashCount(){
  var cnt = document.getElementById('trashCount');
  cnt.textContent = lixeiraCache.length;
  cnt.classList.toggle('show', lixeiraCache.length > 0);
}

window.restoreChapter = async function(lixId){
  var item = lixeiraCache.find(function(x){ return x.id === lixId; });
  if(!item) return;
  var folder = pastasCache.find(function(f){ return f.id === item.folderId; });
  var chapter = { id: item.chapterId, name: item.chapterName, content: item.content, done: false };
  if(window.syncShow) window.syncShow.syncing();
  try {
    if(folder) {
      if(!folder.chapters) folder.chapters = [];
      folder.chapters.push(chapter);
      folder.chapters = sortChapters(folder.chapters);
      await updateDoc(doc(db,'estudo_pastas', folder.id), { chapters: folder.chapters });
    } else {
      var novaPasta = { name: item.folderName, open: true, chapters: [chapter], criadoEm: new Date().toISOString(), ordem: pastasCache.length };
      var ref = await addDoc(collection(db,'estudo_pastas'), novaPasta);
      novaPasta.id = ref.id; pastasCache.push(novaPasta);
    }
    await deleteDoc(doc(db,'estudo_lixeira', lixId));
    lixeiraCache = lixeiraCache.filter(function(x){ return x.id !== lixId; });
    if(window.syncShow) window.syncShow.synced('Estudo');
    showToast('↩ Recuperado!');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
    showToast('Erro ao recuperar');
  }
  render(); renderTrash();
};

window.permDelete = async function(lixId){
  if(window.syncShow) window.syncShow.syncing();
  try {
    await deleteDoc(doc(db,'estudo_lixeira', lixId));
    lixeiraCache = lixeiraCache.filter(function(x){ return x.id !== lixId; });

window.copyChapter = async function(fid, cid, el){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var chapter = (folder.chapters||[]).find(function(c){ return String(c.id) === String(cid); });
  if(!chapter) return;
  // Copia como rich text se tiver HTML
  var content = chapter.content || '';
  var hasHTML = /<[a-z][\s\S]*>/i.test(content);
  try {
    if(hasHTML){
      var blobH = new Blob([content],{type:'text/html'});
      var div2 = document.createElement('div'); div2.innerHTML = content;
      var plain = div2.innerText || div2.textContent || '';
      var blobT = new Blob([plain],{type:'text/plain'});
      await navigator.clipboard.write([new ClipboardItem({'text/html':blobH,'text/plain':blobT})]);
    } else {
      await navigator.clipboard.writeText(content);
    }
  } catch(e) {
    var ta = document.createElement('textarea');
    ta.value = content; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  showToast('✓ Copiado!');
  var r = document.createElement('div'); r.className = 'ripple-el';
  r.style.left = (el.offsetWidth/2 - 30) + 'px'; r.style.top = (el.offsetHeight/2 - 30) + 'px';

};

window.handleFiles = async function(fid, files){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var arr = Array.from(files); var loaded = 0;
  arr.forEach(function(file){
    var reader = new FileReader();
    reader.onload = async function(e){
      var existing = (folder.chapters||[]).find(function(c){ return c.name === file.name; });
      if(!existing){
        if(!folder.chapters) folder.chapters = [];
        folder.chapters.push({ id: Date.now() + '_' + Math.random(), name: file.name, content: e.target.result, done: false });
      }
      loaded++;
      if(loaded === arr.length){
        folder.chapters = sortChapters(folder.chapters);
        if(window.syncShow) window.syncShow.syncing();
        try {
          await updateDoc(doc(db,'estudo_pastas', fid), { chapters: folder.chapters });

        } catch(err) { if(window.syncShow) window.syncShow.offline(); }

      }
    };
    reader.readAsText(file);
  });

// ── SMART LINK DETECTOR ──────────────────────────────────────────────
function efmDetectLinks(html){
  var knownDomains = {
    'youtube.com':'▶ YouTube','youtu.be':'▶ YouTube',
    'instagram.com':'📷 Instagram','twitter.com':'🐦 Twitter',
    'x.com':'🐦 X','facebook.com':'📘 Facebook','tiktok.com':'🎵 TikTok',
    'github.com':'💻 GitHub','whatsapp.com':'💬 WhatsApp',
    'drive.google.com':'📁 Google Drive','docs.google.com':'📄 Google Docs',
    'claude.ai':'🤖 Claude','chat.openai.com':'🤖 ChatGPT',
    'google.com':'🔍 Google','netflix.com':'🎬 Netflix','spotify.com':'🎧 Spotify',
  };
  return html.replace(/(?<![="])https?:\/\/([^\s<>"]+)/g, function(url){
    try {
      var u = new URL(url);
      var domain = u.hostname.replace('www.','');
      var label = knownDomains[domain] || domain;
      return '<a href="'+url+'" target="_blank" style="color:#2d8cff;text-decoration:underline;font-weight:500;">'+label+'</a>';
    } catch(e){ return url; }
  });
}

// ── MARKDOWN → HTML ──────────────────────────────────────────────────
function efmMdToHtml(text){
  if(!text) return '';
  var lines = text.split('\n'); var result = []; var inUl=false, inOl=false;
  for(var i=0; i<lines.length; i++){
    var line = lines[i];
    if(/^### (.+)$/.test(line)){ closeList(); result.push(line.replace(/^### (.+)$/,'<h3>$1</h3>')); continue; }
    if(/^## (.+)$/.test(line)){  closeList(); result.push(line.replace(/^## (.+)$/,'<h2>$1</h2>')); continue; }
    if(/^# (.+)$/.test(line)){   closeList(); result.push(line.replace(/^# (.+)$/,'<h1>$1</h1>')); continue; }
    if(/^[-*_]{3,}$/.test(line)){ closeList(); result.push('<hr>'); continue; }
    if(/^> (.+)$/.test(line)){ closeList(); result.push(line.replace(/^> (.+)$/,'<blockquote>$1</blockquote>')); continue; }
    if(/^[\-\*\+] (.+)$/.test(line)){
      if(inOl){ result.push('</ol>'); inOl=false; }
      if(!inUl){ result.push('<ul>'); inUl=true; }
      result.push('<li>'+line.replace(/^[\-\*\+] /,'')+'</li>'); continue;
    }
    if(/^\d+\. (.+)$/.test(line)){
      if(inUl){ result.push('</ul>'); inUl=false; }
      if(!inOl){ result.push('<ol>'); inOl=true; }
      result.push('<li>'+line.replace(/^\d+\. /,'')+'</li>'); continue;
    }
    closeList();
    if(line.trim()==='') result.push('<br>');
    else result.push('<p>'+line+'</p>');
  }
  closeList();
  function closeList(){
    if(inUl){ result.push('</ul>'); inUl=false; }
    if(inOl){ result.push('</ol>'); inOl=false; }
  }
  var html = result.join('');
  html = html
    .replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/__(.+?)__/g,'<b>$1</b>')
    .replace(/_(.+?)_/g,'<i>$1</i>')
    .replace(/~~(.+?)~~/g,'<s>$1</s>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank" style="color:#2d8cff;text-decoration:underline;font-weight:500;">$1</a>');
  html = efmDetectLinks(html);
  return html;
}
function efmHasMarkdown(text){
  return /(\*\*|__|#{1,3} |^[-*+] |\d+\. |~~|`|\[.+\]\(|^> )/m.test(text);
}
function efmProcessText(text){
  if(!text) return '';
  if(efmHasMarkdown(text)) return efmMdToHtml(text);
  var withBreaks = text.replace(/\n/g,'<br>');
  return efmDetectLinks(withBreaks);
}

// ── NORMALIZAÇÃO ─────────────────────────────────────────────────────
function efmNormalizeContent(html){
  if(!html) return html;
  html = html.replace(/(<br\s*\/?>(\s|&nbsp;)*){2,}/gi, '<br>');
  html = html.replace(/(<p[^>]*>\s*(<br\s*\/?>)?\s*<\/p>\s*){2,}/gi, '<p><br></p>');
  html = html.replace(/margin-top\s*:\s*(\d+\.?\d*)(px|pt|em|rem)/gi, function(m, n, unit){
    var px = unit==='pt'?parseFloat(n)*1.33:unit==='em'||unit==='rem'?parseFloat(n)*14:parseFloat(n);
    return 'margin-top:'+(px>6?'3px':''+n+unit);
  });
  html = html.replace(/margin-bottom\s*:\s*(\d+\.?\d*)(px|pt|em|rem)/gi, function(m, n, unit){
    var px = unit==='pt'?parseFloat(n)*1.33:unit==='em'||unit==='rem'?parseFloat(n)*14:parseFloat(n);
    return 'margin-bottom:'+(px>6?'3px':''+n+unit);
  });
  html = html.replace(/line-height\s*:\s*(\d+\.?\d*)(;|%|px|em|rem)?/gi, function(m, n, unit){
    var val = parseFloat(n); var isRatio = !unit || unit===';';
    if(isRatio && val > 1.6) return 'line-height:1.4;';
    if(!isRatio && val > 24) return 'line-height:1.4;';
    return m;
  });
  html = html.replace(/font-size\s*:\s*[^;"]+/gi, '');
  return html;
}

// ── BLOCOS COPIÁVEIS ─────────────────────────────────────────────────
function efmWrapCopyBlocks(html){
  var CMD_PATTERN = /^(\$\s|cd |npm |npx |pip |git |python |node |yarn |curl |wget |chmod |sudo |apt |brew |docker |cp |mv |rm |mkdir )/i;
  var PATH_PATTERN = /^(\/[\w\-\.\/]+|[A-Z]:\\[\w\-\\.\/]+|\.\/[\w\-\.\/]+)/;
  html = html.replace(/<(pre|code)([^>]*)>([\s\S]*?)<\/(pre|code)>/gi, function(match, tag, attrs, content){
    var plain = content.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
    var escaped = plain.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<div class="fm-copy-block" contenteditable="false"><button class="fm-copy-block-btn" onclick="efmCopyBlockText(this)">📋 Copiar</button>'+escaped+'</div>';
  });
  var lines = html.split(/(<br\s*\/?>|<\/p>|<\/div>|<\/li>)/gi);
  var result = ''; var i2 = 0;
  while(i2 < lines.length){
    var line = lines[i2];
    var stripped = line.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();
    if(stripped && (CMD_PATTERN.test(stripped) || PATH_PATTERN.test(stripped))){
      var escaped2 = stripped.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      result += '<div class="fm-copy-block" contenteditable="false"><button class="fm-copy-block-btn" onclick="efmCopyBlockText(this)">📋 Copiar</button>'+escaped2+'</div>';
      i2++;
      if(i2 < lines.length && /^(<br\s*\/?>|<\/p>|<\/div>|<\/li>)$/i.test(lines[i2])) i2++;
    } else { result += line; i2++; }
  }
  return result;
}
window.efmCopyBlockText = function(btn){
  var block = btn.closest('.fm-copy-block');
  if(!block) return;
  var clone = block.cloneNode(true);
  clone.querySelectorAll('.fm-copy-block-btn').forEach(function(b){ b.remove(); });
  var text = (clone.innerText || clone.textContent || '').trim();
  navigator.clipboard.writeText(text).then(function(){
    var orig = btn.textContent; btn.textContent = '✓ Copiado!';
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });
};

function efmSortKeys(keys, children){
  if(efmSortMode === 'manual') return [...keys].sort(function(a,b){
    var ta=children[a].type==='folder'?0:1, tb=children[b].type==='folder'?0:1;
    return ta-tb;
  });
  return [...keys].sort(function(a,b){
    var ia=children[a], ib=children[b];
    var ta=ia.type==='folder'?0:1, tb=ib.type==='folder'?0:1;
    if(ta!==tb) return ta-tb;
    if(efmSortMode==='az') return a.localeCompare(b);
    if(efmSortMode==='za') return b.localeCompare(a);
    if(efmSortMode==='newer') return (ib.createdAt||0)-(ia.createdAt||0);
    return 0;
  });
}

// ── RENDER LIST ───────────────────────────────────────────────────────
function efmRenderList(){
  var folder = efmCurrentFolder();
  document.getElementById('efmPath').textContent = efmPathLabel();
  document.getElementById('efmBack').textContent = efmPath.length===0 ? '✕' : '←';
  var list = document.getElementById('efmList'); list.innerHTML = '';
  var keys = Object.keys(folder.children||{});
  if(efmSearchActive && efmSearchQuery){
    keys = keys.filter(function(k){ return k.toLowerCase().includes(efmSearchQuery); });
  }
  if(!keys.length){
    list.innerHTML = '<div class="fm-empty">📂 Vazio<br><small>Toque em "+ Novo" para adicionar</small></div>'; return;
  }
  var sorted = efmSortKeys(keys, folder.children);
  sorted.forEach(function(key){
    var item = folder.children[key];
    var isFolder = item.type === 'folder';
    var el = document.createElement('div'); el.className = 'fm-item';
    var icon = isFolder ? '📁' : item.type==='image' ? '🖼️' : item.type==='html' ? '🌐' : item.type==='md' ? '📝' : item.type==='pdf' ? '📕' : '📄';
    var meta = isFolder ? (Object.keys(item.children||{}).length+' item(s)') : ((item.content||'').length+' chars');
    if(item.modifiedAt) meta = new Date(item.modifiedAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    el.innerHTML = '<div class="fm-item-icon">'+icon+'</div>'
      +'<div class="fm-item-info"><div class="fm-item-name">'+key+'</div><div class="fm-item-meta">'+meta+'</div></div>'
      +'<div style="display:flex;gap:4px;flex-shrink:0;">'
      +(!isFolder ? '<button class="fm-item-btn" title="Copiar" onclick="event.stopPropagation();efmCopyItem(\''+key+'\',this)">📋</button>' : '')
      +'<button class="fm-item-del" onclick="event.stopPropagation();efmDelete(\''+key+'\')">✕</button></div>';
    el.addEventListener('click', function(e){
      if(e.target.closest('.fm-item-btn') || e.target.closest('.fm-item-del')) return;
      if(isFolder){ efmPath.push(key); efmRenderList(); history.pushState({nav:'efmOverlay'}, ''); }
      else if(item.type==='image'){ efmViewImage(key); history.pushState({nav:'efmViewer'}, ''); }
      else { efmOpenEditor(key); history.pushState({nav:'efmEditor'}, ''); }
    });
    list.appendChild(el);
  });
}

// ── COPIAR ITEM ───────────────────────────────────────────────────────
window.efmCopyItem = function(key, btn){
  var folder = efmCurrentFolder(); var item = folder.children[key];
  if(!item) return;
  var content = item.content || '';
  var hasHTML = /<[a-z][\s\S]*>/i.test(content);
  try {
    if(hasHTML){
      var blobH = new Blob([content],{type:'text/html'});
      var div2 = document.createElement('div'); div2.innerHTML = content;
      var plain = div2.innerText || div2.textContent || '';
      var blobT = new Blob([plain],{type:'text/plain'});
      navigator.clipboard.write([new ClipboardItem({'text/html':blobH,'text/plain':blobT})]).then(function(){
        if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; }, 1200); }
      });
    } else {
      navigator.clipboard.writeText(content).then(function(){
        if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; }, 1200); }
      });
    }
  } catch(e) {
    var ta=document.createElement('textarea'); ta.value=content; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; }, 1200); }
  }
};

function efmRenderTrash(){
  var list = document.getElementById('efmTrashList'); list.innerHTML = '';
  if(!efmTrash.length){ list.innerHTML = '<div class="fm-empty">🗑️ Lixeira vazia</div>'; return; }
  efmTrash.forEach(function(entry, idx){
    var el = document.createElement('div'); el.className = 'fm-trash-item';
    var icon = entry.item.type==='folder'?'📁':entry.item.type==='image'?'🖼️':'📄';
    el.innerHTML = '<div class="fm-item-icon">'+icon+'</div>'
      +'<div style="flex:1;overflow:hidden;"><div class="fm-trash-name">'+entry.key+'</div>'
      +'<div class="fm-item-meta">'+(entry.path.length ? entry.path.join(' › ') : 'raiz')+'</div></div>'
      +'<button class="fm-restore-btn">↩ Restaurar</button>'
      +'<button class="fm-trash-del-btn">✕</button>';
    el.querySelector('.fm-restore-btn').addEventListener('click', function(){ efmRestoreItem(idx); });
    el.querySelector('.fm-trash-del-btn').addEventListener('click', function(){
      window.efmConfirm('Excluir <strong>'+entry.key+'</strong> permanentemente?','Excluir', async function(){
        efmTrash.splice(idx,1); await efmSaveTrashFs(); efmRenderTrash();
      });
    });
    list.appendChild(el);
  });
}
async function efmRestoreItem(idx){
  var entry = efmTrash[idx]; if(!entry) return;
  var node = efmFs.root;
  for(var i=0; i<entry.path.length; i++){
    var p = entry.path[i];
    if(!node.children) node.children={};
    if(!node.children[p]) node.children[p]={type:'folder',name:p,children:{}};
    node = node.children[p];
    if(!node.children) node.children={};
  }
  var k = entry.key; var c = 1;
  while(node.children[k]){ k=entry.key.replace(/(\.[^.]+)?$/,'_'+c+'$1'); c++; }
  node.children[k] = entry.item; efmTrash.splice(idx,1);
  await efmSaveFs(); await efmSaveTrashFs();
  efmRenderTrash(); efmRenderList(); efmToast('↩ Restaurado!');
}

  window.efmConfirm('Esvaziar lixeira? '+efmTrash.length+' item(s) serão excluídos definitivamente.','Esvaziar', async function(){

  });
};

window.efmSaveItem = function(){
  var folder = efmCurrentFolder(); var now = Date.now();
  if(efmNewType==='folder'){
    var name = document.getElementById('efmInpFolderName').value.trim();
    if(!name){ alert('Digite um nome'); return; }
    folder.children[efmSafeKey(folder,name)] = {type:'folder',name,children:{},createdAt:now,modifiedAt:now};
    efmSaveFs(); efmRenderList(); efmCloseModal(); return;
  }
  if(efmNewType==='txt'||efmNewType==='md'||efmNewType==='html'){
    var rawName = document.getElementById('efmInpName').value.trim();
    var ext = efmNewType==='md'?'.md':efmNewType==='html'?'.html':'.txt';
    var key = efmSafeKey(folder, (rawName||efmGenName())+ext);
    folder.children[key] = {type:efmNewType, content:document.getElementById('efmInpContent').value, createdAt:now, modifiedAt:now};
    efmSaveFs(); efmRenderList(); efmCloseModal();
    setTimeout(function(){ efmOpenEditor(key); history.pushState({nav:'efmEditor'}, ''); }, 100);
    return;
  }
  if(efmNewType==='upload'){
    if(!efmPendingFiles.length){ alert('Selecione ao menos um arquivo'); return; }
    var done=0, total=efmPendingFiles.length;
    efmPendingFiles.forEach(function(file){
      var type = efmDetectType(file.name);
      var r = new FileReader();
      r.onload = function(e){
        folder.children[efmSafeKey(folder,file.name)] = {type,content:e.target.result,createdAt:now,modifiedAt:now};
        done++;
        if(done===total){ efmSaveFs(); efmRenderList(); efmCloseModal(); efmToast('✓ '+total+' arquivo(s) adicionado(s)'); }
      };
      if(type==='image'||type==='pdf') r.readAsDataURL(file);
      else r.readAsText(file,'UTF-8');
    });
  }
};

// ── EDITOR COMPLETO ───────────────────────────────────────────────────
function efmOpenEditor(key){
  efmEditorKey=key;
  var item=efmCurrentFolder().children[key];
  if(!item) return;
  efmEditorCurrentType = item.type||'txt';
  var editable   = document.getElementById('efmEditable');
  var codeEditor = document.getElementById('efmCodeEditor');
  var toolbar    = document.getElementById('efmToolbar');

  if(efmEditorCurrentType==='html'){
    editable.style.display='none'; codeEditor.style.display='block';
    codeEditor.value = item.content||'';
    toolbar.style.display='none';
    codeEditor.oninput = function(){ efmTriggerAutosave(); };
  } else {
    editable.style.display='block'; codeEditor.style.display='none';
    var raw = item.content||'';
    var hasHTML = /<[a-z][\s\S]*>/i.test(raw);
    editable.innerHTML = efmNormalizeContent(hasHTML ? efmDetectLinks(raw) : efmProcessText(raw));
    toolbar.style.display='flex';
    editable.oninput = function(){ efmTriggerAutosave(); };
  }
  efmHistoryInit(editable.innerHTML);
  efmEditorZoom = 1.0;
  editable.style.fontSize = ''; editable.style.fontFamily = '';
  var fontSel = document.getElementById('efmFontSelect');
  if(fontSel) fontSel.value = '';
  efmActiveTab = 1;
  efmSwitchTab(1);
  efmInitKeyboardResize();

  // PASTE INTELIGENTE
  editable.onpaste = function(e){
    e.preventDefault();
    var clip = e.clipboardData || window.clipboardData;
    var htmlData = clip.getData('text/html');
    var plainData = clip.getData('text/plain');
    var result = '';
    if(htmlData && htmlData.trim()){
      result = efmWrapCopyBlocks(efmNormalizeContent(efmDetectLinks(htmlData)));
    } else if(plainData){
      result = efmWrapCopyBlocks(efmNormalizeContent(efmProcessText(plainData)));
    }
    document.execCommand('insertHTML', false, result);
    efmTriggerAutosave();
  };

  // Captura cola Android
  var efmLastContent = editable.innerHTML;
  editable.addEventListener('input', function(e){
    if(e.inputType === 'insertFromPaste'){
      var current = editable.innerHTML;
      if(current === efmLastContent) return;
      var tempDiv = document.createElement('div'); tempDiv.innerHTML = current;
      var hasRealFormatting = tempDiv.querySelector('b,strong,i,em,ul,ol,h1,h2,h3,a,code,blockquote,table');
      if(!hasRealFormatting){
        var added = editable.innerText || '';
        if(efmHasMarkdown(added) || /https?:\/\//.test(added)){
          editable.innerHTML = efmNormalizeContent(efmProcessText(added));
          var range = document.createRange(); var sel = window.getSelection();
          range.selectNodeContents(editable); range.collapse(false);
          sel.removeAllRanges(); sel.addRange(range);
        }
      }
      efmLastContent = editable.innerHTML;
    } else { efmLastContent = editable.innerHTML; }
  });

  document.getElementById('efmEditor').classList.add('open');
  setTimeout(function(){ efmEditorCurrentType==='html'?codeEditor.focus():editable.focus(); }, 200);
}

function efmInitKeyboardResize(){
  if(!window.visualViewport) return;
  function onVvResize(){
    var editor = document.getElementById('efmEditor');
    if(!editor || !editor.classList.contains('open')) return;
    var vv = window.visualViewport;
    editor.style.position='fixed'; editor.style.top=vv.offsetTop+'px';
    editor.style.left=vv.offsetLeft+'px'; editor.style.width=vv.width+'px'; editor.style.height=vv.height+'px';
  }
  window._efmVvListener = onVvResize;
  window.visualViewport.addEventListener('resize', onVvResize);
  window.visualViewport.addEventListener('scroll', onVvResize);
}

function efmTriggerAutosave(){
  var el = document.getElementById('efmEditable');
  if(el) efmHistoryPush(el.innerHTML);
  clearTimeout(efmAutosaveTimer);
  efmAutosaveTimer = setTimeout(function(){
    efmDoSave();
    var badge = document.getElementById('efmAutosaveBadge');
    badge.classList.add('show');
    setTimeout(function(){ badge.classList.remove('show'); }, 2000);
  }, 1500);
}

  var item = efmCurrentFolder().children[efmEditorKey];
  if(!item) return;
  if(efmEditorCurrentType==='html'){
    item.content = document.getElementById('efmCodeEditor').value;
  } else {
    item.content = document.getElementById('efmEditable').innerHTML;
  }
  item.modifiedAt = Date.now(); efmSaveFs();

// Undo / Redo
function efmHistoryInit(html){ efmHistory=[html]; efmHistoryIdx=0; }
function efmHistoryPush(html){
  if(efmHistoryIdx<efmHistory.length-1) efmHistory=efmHistory.slice(0,efmHistoryIdx+1);
  if(efmHistory.length>0 && efmHistory[efmHistoryIdx]===html) return;
  efmHistory.push(html);
  if(efmHistory.length>100) efmHistory.shift();
  efmHistoryIdx=efmHistory.length-1;
}
window.efmUndo = function(){
  if(efmHistoryIdx<=0) return;
  efmHistoryIdx--;
  var el = document.getElementById('efmEditable');
  el.innerHTML=efmHistory[efmHistoryIdx]; efmDoSave();
};
window.efmRedo = function(){
  if(efmHistoryIdx>=efmHistory.length-1) return;
  efmHistoryIdx++;
  var el = document.getElementById('efmEditable');
  el.innerHTML=efmHistory[efmHistoryIdx]; efmDoSave();
};
document.getElementById('efmEditable').addEventListener('input', function(){
  efmHistoryPush(this.innerHTML);
});

window.efmExitReadModeToEditor = function(){
  document.getElementById('efmReadMode').classList.remove('open');
  if(efmEditorKey){ efmOpenEditor(efmEditorKey); history.pushState({nav:'efmEditor'}, ''); }
};
window.efmReadZoom = function(dir){
  efmReadZoomLevel = Math.max(0.5, Math.min(3.0, efmReadZoomLevel + dir * 0.1));
  document.getElementById('efmReadContent').style.fontSize = (efmReadZoomLevel * 0.9) + 'rem';
};
window.efmReadChangeFont = function(font){
  if(!font) return;
  document.getElementById('efmReadContent').style.fontFamily = font + ', sans-serif';
};

// ── ABAS DA TOOLBAR ───────────────────────────────────────────────────
window.efmSwitchTab = function(tab){
  efmActiveTab = tab;
  document.getElementById('efmPanel1').classList.toggle('open', tab===1);
  document.getElementById('efmPanel2').classList.toggle('open', tab===2);
  var themeRow = document.getElementById('efmThemeRow');
  if(themeRow) themeRow.style.display = tab===1 ? '' : 'none';
};

// ── TEMAS ─────────────────────────────────────────────────────────────
window.efmSetEditorTheme = function(bg, color){
  var editable = document.getElementById('efmEditable');
  editable.style.background = bg; editable.style.color = color; editable.style.caretColor = color;
};
window.efmSetToolbarTheme = function(toolbarBg){
  var toolbar = document.getElementById('efmToolbar');
  var isDark = toolbarBg !== '#f9fafb' && toolbarBg !== '#ffffff';
  toolbar.style.background = toolbarBg;
  toolbar.style.borderColor = isDark ? 'rgba(255,255,255,0.1)' : '#e5e7eb';
  var btnColor = isDark ? '#e5e7eb' : '#374151';
  var btnBorder = isDark ? 'rgba(255,255,255,0.15)' : '#d1d5db';
  var btnBg = isDark ? 'rgba(255,255,255,0.07)' : '#fff';
  document.querySelectorAll('#efmToolbar .fm-tb-btn').forEach(function(b){
    b.style.color = btnColor; b.style.borderColor = btnBorder; b.style.background = btnBg;
  });
};

// ── FONTE E ZOOM ──────────────────────────────────────────────────────
window.efmChangeFontSize = function(dir){
  var el = document.getElementById('efmEditable');
  el.focus();
  var sel = window.getSelection();
  if(!sel || sel.isCollapsed){
    efmEditorZoom = Math.max(0.5, Math.min(3.0, efmEditorZoom + dir * 0.1));
    el.style.fontSize = (efmEditorZoom * 0.9) + 'rem';
  } else {
    var sz = parseFloat(window.getComputedStyle(sel.anchorNode.parentElement || el).fontSize) || 14;
    var newSz = Math.max(8, sz + dir * 2);
    document.execCommand('fontSize', false, '7');
    el.querySelectorAll('font[size="7"]').forEach(function(f){
      f.removeAttribute('size'); f.style.fontSize = newSz + 'px';
    });
  }
  efmTriggerAutosave();
};
window.efmChangeFont = function(font){
  if(!font) return;
  var el = document.getElementById('efmEditable');
  var sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0){
    el.querySelectorAll('*').forEach(function(e){ if(e.style.fontFamily) e.style.fontFamily = ''; });
    el.style.fontFamily = font + ', sans-serif';
  } else {
    el.focus();
    var range = sel.getRangeAt(0).cloneRange();
    var fragment = range.extractContents();
    var span = document.createElement('span');
    span.style.fontFamily = font + ', sans-serif';
    span.appendChild(fragment); range.insertNode(span);
    var newRange = document.createRange(); newRange.selectNodeContents(span);
    sel.removeAllRanges(); sel.addRange(newRange);
  }
  efmTriggerAutosave();
};

// ── INSERIR LINK / CÓDIGO / IMAGEM ───────────────────────────────────
window.efmInsertLink = function(){
  var url = prompt('Cole o link:'); if(!url) return;
  var label = prompt('Nome do link (deixe vazio para usar a URL):') || url;
  var editable = document.getElementById('efmEditable'); editable.focus();
  var sel = window.getSelection();
  if(sel && !sel.isCollapsed){ document.execCommand('createLink', false, url); }
  else { document.execCommand('insertHTML', false, '<a href="'+url+'" target="_blank" style="color:#2d8cff;text-decoration:underline;font-weight:500;">'+label+'</a>&#8203;'); }
};
window.efmInsertCode = function(){
  var editable = document.getElementById('efmEditable'); editable.focus();
  var sel = window.getSelection();
  if(sel && !sel.isCollapsed){ document.execCommand('insertHTML', false, '<code>'+sel.toString()+'</code>'); }
  else { document.execCommand('insertHTML', false, '<code>código</code>'); }
};
window.efmInsertImage = function(){ document.getElementById('efmImgInsertInput').click(); };
window.efmHandleImageInsert = function(event){
  var file = event.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var editable = document.getElementById('efmEditable'); editable.focus();
    document.execCommand('insertHTML', false, '<img src="'+e.target.result+'" style="max-width:100%;border-radius:6px;" alt="imagem">');
    efmTriggerAutosave();
  };
  reader.readAsDataURL(file); event.target.value='';
};
window.efmRemoveFormat = function(){
  var el = document.getElementById('efmEditable'); el.focus();
  var sel = window.getSelection();
  if(sel && !sel.isCollapsed){
    document.execCommand('removeFormat');
    var range = sel.getRangeAt(0);
    var frag = range.cloneContents(); var tmp = document.createElement('div'); tmp.appendChild(frag);
    tmp.querySelectorAll('[style]').forEach(function(n){ n.removeAttribute('style'); });
    tmp.querySelectorAll('font').forEach(function(n){ var span=document.createElement('span'); span.innerHTML=n.innerHTML; n.replaceWith(span); });
    range.deleteContents(); range.insertNode(tmp.firstChild || document.createTextNode(''));
  } else {
    el.querySelectorAll('[style]').forEach(function(n){ n.removeAttribute('style'); });
    el.querySelectorAll('font').forEach(function(n){ var span=document.createElement('span'); span.innerHTML=n.innerHTML; n.replaceWith(span); });
    var range2 = document.createRange(); range2.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(range2);
    document.execCommand('removeFormat'); sel.removeAllRanges();
    efmTriggerAutosave();
  }
};

// ── CHECKLIST NO EDITOR ───────────────────────────────────────────────
function efmMakeCheckItem(content){
  var wrapper = document.createElement('div');
  wrapper.className = 'fm-check-item'; wrapper.contentEditable = 'false';
  var box = document.createElement('span'); box.className = 'fm-check-box'; box.textContent = '';
  box.addEventListener('click', function(e){
    e.stopPropagation();
    var item = box.closest('.fm-check-item');
    item.classList.toggle('checked');
    box.textContent = item.classList.contains('checked') ? '✓' : '';
    efmTriggerAutosave();
  });
  var label = document.createElement('span'); label.className = 'fm-check-label'; label.contentEditable = 'true';
  if(typeof content === 'string') label.innerHTML = content;
  else if(content instanceof Node) label.appendChild(content.cloneNode(true));
  wrapper.appendChild(box); wrapper.appendChild(label);
  return wrapper;
}
window.efmInsertCheckItem = function(){
  var el = document.getElementById('efmEditable'); el.focus();
  var sel = window.getSelection();
  var item = efmMakeCheckItem('');
  if(sel && sel.rangeCount > 0){
    var range = sel.getRangeAt(0);
    range.deleteContents(); range.insertNode(item);
    range.setStartAfter(item); range.collapse(true);
    sel.removeAllRanges(); sel.addRange(range);
  } else { el.appendChild(item); }
  var label = item.querySelector('.fm-check-label');
  if(label) label.focus();
  efmTriggerAutosave(); efmHistoryPush(el.innerHTML);
};

// ── ABRIR FM PELO BOTÃO + DO HEADER ──────────────────────────────────
window.efmOpenFromHeader = function(){
  efmPath = []; efmRenderList();
  document.getElementById('efmOverlay').classList.add('open');
  history.pushState({nav:'efmOverlay'}, '');
  // Abre direto o modal de criar
  setTimeout(function(){ efmOpenModal(); }, 80);
};

// ── SISTEMA DE NAVEGAÇÃO HISTORY ─────────────────────────────────────
(function setupNavHistory(){
  // Base: nunca deixa o botão voltar fechar a aba ou sair da página
  history.replaceState({_base: true}, '');

  // ── Wrappers com pushState para cada abertura ──────────────────────

  // Modal nova pasta (ESTUDO)
  var _openModal = window.openModal;
  window.openModal = function(){
    _openModal();
    history.pushState({nav:'modalEstudo'}, '');
  };

  // Lixeira (ESTUDO)
  var _openTrash = window.openTrash;
  window.openTrash = function(){
    _openTrash();
    history.pushState({nav:'trashEstudo'}, '');
  };

  // Gerenciador de arquivos (FM overlay)
  var _efmOpen = window.efmOpen;
  window.efmOpen = function(){
    _efmOpen();
    history.pushState({nav:'efmOverlay'}, '');
  };

  // Modal criar arquivo (FM)
  var _efmOpenModal = window.efmOpenModal;
  window.efmOpenModal = function(){
    _efmOpenModal();
    history.pushState({nav:'efmModal'}, '');
  };

  // Lixeira FM
  var _efmOpenTrash = window.efmOpenTrash;
  window.efmOpenTrash = function(){
    _efmOpenTrash();
    history.pushState({nav:'efmTrash'}, '');
  };

  // Modo leitura
  var _efmEnterReadMode = window.efmEnterReadMode;
  window.efmEnterReadMode = function(){
    _efmEnterReadMode();
    if(document.getElementById('efmReadMode').classList.contains('open')){
      history.pushState({nav:'efmReadMode'}, '');
    }
  };

  // ── POPSTATE: do mais profundo para o mais raso ────────────────────
  window.addEventListener('popstate', function(e){
    var state = e.state || {};

    // 1. Modo Leitura (mais profundo)
    if(document.getElementById('efmReadMode').classList.contains('open')){
      window.efmExitReadMode();
      return;
    }
    // 2. Editor
    if(document.getElementById('efmEditor').classList.contains('open')){
      window.efmCloseEditor();
      return;
    }
    // 3. Viewer
    if(document.getElementById('efmViewer').classList.contains('open')){
      window.efmCloseViewer();
      return;
    }
    // 4. Confirm FM
    if(document.getElementById('efmConfirmOverlay').classList.contains('open')){
      window.efmConfirmCancel();
      return;
    }
    // 5. Lixeira FM
    if(document.getElementById('efmTrashOverlay').classList.contains('open')){
      window.efmCloseTrash();
      return;
    }
    // 6. Modal criar FM
    if(document.getElementById('efmModalOverlay').classList.contains('open')){
      window.efmCloseModal();
      return;
    }
    // 7. FM Overlay (subpasta ou raiz)
    if(document.getElementById('efmOverlay').classList.contains('open')){
      if(efmPath && efmPath.length > 0){
        efmPath.pop(); efmRenderList();
        history.pushState({nav:'efmOverlay'}, '');
      } else {
        efmClose();
      }
      return;
    }
    // 8. Lixeira Estudo
    if(document.getElementById('trashOverlay').classList.contains('show')){
      window.closeTrash();
      return;
    }
    // 9. Modal Nova Pasta Estudo
    if(document.getElementById('modalOverlay').classList.contains('show')){
      window.closeModal();
      return;
    }
    // Raiz: reaplica estado base para nunca sair da página
    if(!state._base){
      history.replaceState({_base: true}, '');
    }
  });
})();

// ── INIT ──────────────────────────────────────────────────────────────
(function init(){
  render(); iniciarListeners();
})();
</script>
