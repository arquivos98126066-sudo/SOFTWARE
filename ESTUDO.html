<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Estudo</title>
<script src="https://arquivos98126066-sudo.github.io/SOFTWARE/sync-indicator.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --surface2: #222222;
    --border: #2a2a2a;
    --accent: #c8f568;
    --accent2: #68f5c8;
    --text: #e8e8e0;
    --muted: #666;
    --danger: #f56868;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* TOAST */
  #toast {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--accent);
    color: #0f0f0f;
    padding: 10px 22px;
    border-radius: 99px;
    font-size: 13px; font-weight: 500;
    z-index: 9999;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
    white-space: nowrap; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* HEADER */
  header {
    padding: 24px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 600px; margin: 0 auto;
  }
  .logo-wrap { display: flex; align-items: center; gap: 8px; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .logo:hover { opacity: 0.75; }
  .logo-edit-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
    transition: color 0.15s;
  }
  .logo-edit-btn:hover { color: var(--accent2); }
  .logo-edit-btn svg { width: 13px; height: 13px; }
  .logo-input {
    font-family: 'DM Serif Display', serif;
    font-size: 18px; font-weight: 700;
    letter-spacing: 3px;
    background: var(--surface2); border: 1px solid var(--accent);
    border-radius: 6px; color: var(--accent);
    padding: 4px 10px; outline: none;
    text-transform: uppercase;
    max-width: 180px;
  }
  .header-btns { display: flex; gap: 8px; align-items: center; }
  .trash-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); border-radius: 8px;
    padding: 7px 12px; font-family: 'DM Mono', monospace;
    font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: border-color 0.2s, color 0.2s;
    position: relative;
  }
  .trash-btn:hover { border-color: var(--danger); color: var(--danger); }
  .trash-btn svg { width: 14px; height: 14px; }
  .trash-count {
    background: var(--danger); color: #fff;
    border-radius: 99px; font-size: 10px;
    padding: 1px 6px; font-weight: 700;
    display: none;
  }
  .trash-count.show { display: inline; }

  /* PROGRESS GLOBAL */
  .global-progress {
    max-width: 600px; margin: 20px auto 0; padding: 0 20px;
  }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase;
  }
  .progress-label .pct { color: var(--accent); font-weight: 500; }
  .progress-bar-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* MAIN */
  main { max-width: 600px; margin: 0 auto; padding: 20px 20px 120px; }

  /* ADD PASTA BTN */
  .add-folder-btn {
    width: 100%;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    color: var(--muted); border-radius: var(--radius);
    padding: 14px; font-family: 'DM Mono', monospace;
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: border-color 0.2s, color 0.2s;
    margin-bottom: 16px;
  }
  .add-folder-btn:hover { border-color: var(--accent); color: var(--accent); }
  .add-folder-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* FOLDER */
  .folder {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 12px;
    overflow: hidden; transition: border-color 0.2s;
  }
  .folder:hover { border-color: #333; }
  .folder-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none;
  }
  .folder-icon { font-size: 16px; flex-shrink: 0; }
  .folder-name {
    font-size: 14px; font-weight: 500; flex: 1;
    color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .folder-stats { font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .folder-stats .done { color: var(--accent); }
  .folder-chevron {
    width: 16px; height: 16px; color: var(--muted);
    transition: transform 0.2s; flex-shrink: 0;
  }
  .folder.open .folder-chevron { transform: rotate(90deg); }
  .folder-progress { height: 2px; background: var(--border); margin: 0 16px; }
  .folder-progress-fill { height: 100%; background: var(--accent); transition: width 0.4s; }
  .folder-body { display: none; padding: 8px 12px 12px; }
  .folder.open .folder-body { display: block; }

  /* MOVE BTNS (up/down) */
  .move-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 3px; border-radius: 4px;
    display: flex; align-items: center;
    transition: color 0.15s; flex-shrink: 0;
    font-size: 11px; line-height: 1;
  }
  .move-btn:hover { color: var(--accent); }
  .move-btn svg { width: 13px; height: 13px; }

  /* ICON BTNS */
  .icon-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px; border-radius: 4px;
    display: flex; align-items: center;
    transition: color 0.15s; flex-shrink: 0;
  }
  .icon-btn.edit:hover { color: var(--accent2); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* INLINE EDIT */
  .folder-inline-edit {
    background: var(--surface2); border: 1px solid var(--accent);
    border-radius: 6px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px;
    padding: 4px 8px; outline: none; flex: 1; min-width: 0;
  }
  .chapter-inline-edit {
    background: var(--bg); border: 1px solid var(--accent2);
    border-radius: 6px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 12px;
    padding: 3px 8px; outline: none; flex: 1; min-width: 0;
  }

  /* ADD FILES */
  .add-files-area {
    border: 1.5px dashed var(--border); border-radius: 8px;
    padding: 14px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 10px; position: relative; display: block;
  }
  .add-files-area:hover { border-color: var(--accent2); background: #1a1a1a; }
  .add-files-area input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .add-files-area p { font-size: 12px; color: var(--muted); }
  .add-files-area p span { color: var(--accent2); }

  /* CHAPTER LIST */
  .chapter-list { display: flex; flex-direction: column; gap: 6px; }
  .chapter-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative; overflow: hidden;
  }
  .chapter-item:hover { border-color: var(--accent2); background: #252525; }
  .chapter-item.copying { border-color: var(--accent); }
  .chapter-num { font-size: 10px; color: var(--muted); min-width: 24px; text-align: right; flex-shrink: 0; }
  .chapter-name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .chapter-edit-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 3px; display: flex; align-items: center;
    flex-shrink: 0; transition: color 0.15s;
  }
  .chapter-edit-btn:hover { color: var(--accent2); }
  .chapter-edit-btn svg { width: 12px; height: 12px; }
  .chapter-copy-icon { color: var(--muted); flex-shrink: 0; display: flex; align-items: center; }
  .done-btn {
    background: none; border: 1px solid var(--border);
    color: var(--muted); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 4px 10px; border-radius: 99px;
    cursor: pointer; white-space: nowrap;
    transition: border-color 0.15s, color 0.15s; flex-shrink: 0;
  }
  .done-btn:hover { border-color: var(--accent); color: var(--accent); }
  .del-chapter-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 3px; display: flex; align-items: center;
    flex-shrink: 0; transition: color 0.15s;
  }
  .del-chapter-btn:hover { color: var(--danger); }
  .del-chapter-btn svg { width: 13px; height: 13px; }

  /* EMPTY */
  .empty-msg { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }

  /* MODAL NOVA PASTA */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 36px; width: 100%; max-width: 600px;
    transform: translateY(40px);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal h3 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 16px; color: var(--text); }
  .modal input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 14px; outline: none;
    transition: border-color 0.2s; margin-bottom: 12px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal .hint { font-size: 11px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .modal .hint span { color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; }
  .btn-primary {
    flex: 1; background: var(--accent); color: #0f0f0f; border: none;
    border-radius: 8px; padding: 12px; font-family: 'DM Mono', monospace;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-cancel {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 12px 20px; font-family: 'DM Mono', monospace;
    font-size: 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }

  /* LIXEIRA DRAWER */
  .trash-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .trash-overlay.show { opacity: 1; pointer-events: all; }
  .trash-drawer {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    width: 100%; max-width: 600px;
    max-height: 75vh; display: flex; flex-direction: column;
    transform: translateY(40px);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .trash-overlay.show .trash-drawer { transform: translateY(0); }
  .trash-drawer-header {
    padding: 20px 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .trash-drawer-header h3 {
    font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .trash-drawer-header h3 svg { width: 18px; height: 18px; color: var(--danger); }
  .close-trash-btn {
    background: none; border: none; color: var(--muted);
    font-family: 'DM Mono', monospace; font-size: 13px;
    cursor: pointer; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border);
    transition: border-color 0.15s, color 0.15s;
  }
  .close-trash-btn:hover { border-color: var(--text); color: var(--text); }
  .trash-list {
    overflow-y: auto; padding: 12px 16px 24px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .trash-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .trash-item-info { flex: 1; min-width: 0; }
  .trash-item-name {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .trash-item-folder { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .restore-btn {
    background: none; border: 1px solid var(--border);
    color: var(--accent2); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 5px 12px; border-radius: 99px;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: border-color 0.15s, background 0.15s;
  }
  .restore-btn:hover { border-color: var(--accent2); background: rgba(104,245,200,0.08); }
  .perm-del-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 4px; display: flex; align-items: center;
    flex-shrink: 0; transition: color 0.15s;
  }
  .perm-del-btn:hover { color: var(--danger); }
  .perm-del-btn svg { width: 14px; height: 14px; }
  .trash-empty { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0; }

  /* RIPPLE */
  @keyframes ripple { from { transform: scale(0); opacity: 0.4; } to { transform: scale(3); opacity: 0; } }
  .ripple-el {
    position: absolute; width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); pointer-events: none;
    animation: ripple 0.5s ease-out forwards;
  }

  /* ALL DONE */
  .all-done { text-align: center; padding: 30px 0; }
  .all-done .emoji { font-size: 40px; margin-bottom: 8px; }
  .all-done p { font-size: 13px; color: var(--muted); }
  .all-done strong { color: var(--accent); }

  /* ══════════════════════════════════════════════════════
     FLUTUANTE DE ARQUIVOS (canto inferior direito)
  ══════════════════════════════════════════════════════ */
  .fm-wrap {
    position: fixed; bottom: 1.5rem; right: 1rem;
    z-index: 300; pointer-events: none;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .fm-fab {
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #c8f568, #68f5c8);
    border: none; color: #fff; font-size: 1.4rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(249,115,22,0.55);
    pointer-events: auto; transition: transform 0.2s;
    flex-shrink: 0;
  }
  .fm-fab:active { transform: scale(0.9); }

  /* GERENCIADOR OVERLAY */
  .fm-overlay {
    display: none; position: fixed; inset: 0; z-index: 9200;
    background: #0a0a12; flex-direction: column;
    font-family: 'DM Mono', monospace;
  }
  .fm-overlay.open { display: flex; }
  .fm-header {
    padding: 0.8rem 1rem;
    background: rgba(10,10,18,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .fm-back {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.15);
    color: #f0f0fa; font-size: 0.8rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .fm-path { flex: 1; font-size: 0.72rem; color: #9999bb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-hbtn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; color: #9999bb; font-family: 'DM Mono', monospace;
    font-size: 0.7rem; padding: 0.3rem 0.55rem; cursor: pointer; white-space: nowrap;
    transition: background 0.15s;
  }
  .fm-hbtn:active { background: rgba(255,255,255,0.12); }
  .fm-add-btn {
    background: linear-gradient(135deg,#c8f568,#68f5c8);
    border: none; border-radius: 50px; color: #fff;
    font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 600;
    padding: 0.35rem 0.9rem; cursor: pointer; white-space: nowrap;
  }
  .fm-list { flex: 1; overflow-y: auto; padding: 0.6rem; }
  .fm-item {
    display: flex; align-items: center; gap: 10px;
    padding: 0.65rem 0.8rem; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05);
    margin-bottom: 6px; cursor: pointer; transition: background 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .fm-item:active { background: rgba(255,255,255,0.09); }
  .fm-item-icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; }
  .fm-item-info { flex: 1; overflow: hidden; }
  .fm-item-name { font-size: 0.78rem; font-weight: 500; color: #f0f0fa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-item-meta { font-size: 0.6rem; color: #6b6b88; margin-top: 1px; }
  .fm-item-del {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
    color: #f87171; font-size: 0.7rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .fm-item-btn {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05);
    color: #9999bb; font-size: 0.75rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all 0.15s;
  }
  .fm-item-btn:active { transform: scale(0.9); }
  .fm-empty { text-align: center; padding: 3rem 1rem; color: #6b6b88; font-size: 0.8rem; }

  /* SORT BAR */
  .fm-sort-bar {
    display: flex; align-items: center; gap: 5px;
    padding: 0.35rem 0.8rem;
    background: rgba(10,10,18,0.9);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .fm-sort-bar::-webkit-scrollbar { display: none; }
  .fm-sort-chip {
    padding: 0.2rem 0.55rem; border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.15); background: transparent;
    color: #9999bb; font-family: 'DM Mono', monospace;
    font-size: 0.62rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .fm-sort-chip.active { background: rgba(249,115,22,0.2); border-color: #c8f568; color: #f0f0fa; }

  /* SEARCH BAR */
  .fm-search-bar {
    display: none; padding: 0.5rem 0.8rem 0.4rem;
    background: rgba(10,10,18,0.98);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0; gap: 6px; flex-direction: column;
  }
  .fm-search-bar.open { display: flex; }
  .fm-search-row { display: flex; gap: 6px; align-items: center; }
  .fm-search-inp {
    flex: 1; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    padding: 0.45rem 0.7rem; color: #f0f0fa;
    font-family: 'DM Mono', monospace; font-size: 0.8rem; outline: none;
  }
  .fm-search-inp:focus { border-color: #c8f568; }
  .fm-search-inp::placeholder { color: #6b6b88; }
  .fm-search-close { background: transparent; border: none; color: #9999bb; font-size: 1rem; cursor: pointer; padding: 0.2rem 0.4rem; }

  /* CONFIRM DIALOG */
  .fm-confirm-overlay {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 1.5rem;
  }
  .fm-confirm-overlay.open { display: flex; }
  .fm-confirm-box {
    background: #111118; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 320px;
    text-align: center; animation: fmSlideUp 0.2s ease;

<script type="module">
import { db } from "https://arquivos98126066-sudo.github.io/SOFTWARE/firebase-sync.js";
import {
  collection, addDoc, getDocs, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, writeBatch, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ══════════════════════════════════════════════════════
   PARTE 1 — SISTEMA DE ESTUDO (pastas + capítulos)
══════════════════════════════════════════════════════ */

var pastasCache = [];
var lixeiraCache = [];

// ── TOAST ──────────────────────────────────────────────
window.showToast = function(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
};

// ── EDITAR TÍTULO DA PÁGINA ────────────────────────────
var paginaTitulo = 'ESTUDO';

window.startEditTitle = function(){
  var logoEl = document.getElementById('logoText');
  var input = document.createElement('input');
  input.className = 'logo-input';
  input.value = paginaTitulo;
  input.maxLength = 30;
  logoEl.replaceWith(input);
  input.focus(); input.select();

  function confirmTitle(){
    var val = input.value.trim().toUpperCase();
    if(val) paginaTitulo = val;
    document.title = paginaTitulo;
    var span = document.createElement('span');
    span.className = 'logo';
    span.id = 'logoText';
    span.onclick = startEditTitle;
    span.textContent = paginaTitulo;
    input.replaceWith(span);
    // Salva no Firebase
    try {
      setDoc(doc(db,'estudo_config','data'), { titulo: paginaTitulo }).catch(function(){});

// Carrega título salvo
(async function loadTitle(){
  try {
    var snap = await getDoc(doc(db,'estudo_config','data'));
    if(snap.exists() && snap.data().titulo){
      paginaTitulo = snap.data().titulo;
      var el = document.getElementById('logoText');
      if(el) el.textContent = paginaTitulo;
      document.title = paginaTitulo;
    }
  } catch(e) {}
})();

// ── HELPERS ────────────────────────────────────────────
function extractOrder(name) {
  var m = name.match(/^\((\d+)\)/);
  return m ? parseInt(m[1]) : 9999;
}
function sortFoldersByOrder() {
  pastasCache.sort(function(a,b){ return extractOrder(a.name) - extractOrder(b.name); });
}
function sortChapters(chapters) {
  return [...chapters].sort(function(a,b){
    var numA = parseInt((a.name.match(/\d+/) || ['0'])[0]);
    var numB = parseInt((b.name.match(/\d+/) || ['0'])[0]);
    if(numA !== numB) return numA - numB;
    return a.name.localeCompare(b.name);
  });
}
function globalStats() {
  var total=0, done=0;
  pastasCache.forEach(function(f){
    total += (f.chapters||[]).length;
    done  += (f.chapters||[]).filter(function(c){return c.done;}).length;
  });
  return {total, done};
}

// ── MOVER PASTA PARA CIMA / PARA BAIXO ────────────────
window.moveFolderUp = async function(fid){
  var idx = pastasCache.findIndex(function(f){ return f.id == fid; });
  if(idx <= 0) return;
  var tmp = pastasCache[idx-1];
  pastasCache[idx-1] = pastasCache[idx];
  pastasCache[idx] = tmp;
  await saveFolderOrder();
  render();
};
window.moveFolderDown = async function(fid){
  var idx = pastasCache.findIndex(function(f){ return f.id == fid; });
  if(idx < 0 || idx >= pastasCache.length-1) return;
  var tmp = pastasCache[idx+1];
  pastasCache[idx+1] = pastasCache[idx];
  pastasCache[idx] = tmp;
  await saveFolderOrder();
  render();
};

async function saveFolderOrder(){
  // Salva um campo 'ordem' em cada pasta refletindo a posição atual
  if(window.syncShow) window.syncShow.syncing();
  try {
    var batch = writeBatch(db);
    pastasCache.forEach(function(f, i){
      if(!f.id.startsWith('local_')){
        batch.update(doc(db,'estudo_pastas', f.id), { ordem: i });
      }
    });
    await batch.commit();
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
  }
}

// ── MODAL PASTA ────────────────────────────────────────
window.openModal = function(){
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(function(){ document.getElementById('folderNameInput').focus(); }, 300);
};
window.closeModal = function(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('folderNameInput').value = '';
};
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('modalOverlay')) closeModal();
});
document.getElementById('folderNameInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') createFolder();
});

window.createFolder = async function(){
  var name = document.getElementById('folderNameInput').value.trim();
  if(!name) return;
  var pasta = { name, open: true, chapters: [], criadoEm: new Date().toISOString(), ordem: pastasCache.length };
  if(window.syncShow) window.syncShow.syncing();
  try {
    var ref = await addDoc(collection(db,'estudo_pastas'), pasta);
    pasta.id = ref.id;
    pastasCache.push(pasta);
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    pasta.id = 'local_' + Date.now();
    pastasCache.push(pasta);
    if(window.syncShow) window.syncShow.local();
    showToast('Salvo localmente (offline)');
  }
  closeModal(); render();
};

// ── LIXEIRA ESTUDO ─────────────────────────────────────
window.openTrash = function(){
  renderTrash();
  document.getElementById('trashOverlay').classList.add('show');
};
window.closeTrash = function(){
  document.getElementById('trashOverlay').classList.remove('show');
};
document.getElementById('trashOverlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('trashOverlay')) closeTrash();
});

function renderTrash(){
  var list = document.getElementById('trashList');
  if(!lixeiraCache.length){
    list.innerHTML = '<div class="trash-empty">🗑️ Lixeira vazia</div>'; return;
  }
  list.innerHTML = lixeiraCache.map(function(item){
    return '<div class="trash-item">'
      +'<div class="trash-item-info">'
      +'<div class="trash-item-name">'+(item.chapterName||'').replace(/\.[^.]+$/,'')+'</div>'
      +'<div class="trash-item-folder">📁 '+item.folderName+'</div>'
      +'</div>'
      +'<button class="restore-btn" onclick="restoreChapter(\''+item.id+'\')">↩ Recuperar</button>'
      +'<button class="perm-del-btn" onclick="permDelete(\''+item.id+'\')" title="Excluir permanentemente">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
      +'</button></div>';
  }).join('');
  updateTrashCount();
}

function updateTrashCount(){
  var cnt = document.getElementById('trashCount');
  cnt.textContent = lixeiraCache.length;
  cnt.classList.toggle('show', lixeiraCache.length > 0);
}

window.restoreChapter = async function(lixId){
  var item = lixeiraCache.find(function(x){ return x.id === lixId; });
  if(!item) return;
  var folder = pastasCache.find(function(f){ return f.id === item.folderId; });
  var chapter = { id: item.chapterId, name: item.chapterName, content: item.content, done: false };
  if(window.syncShow) window.syncShow.syncing();
  try {
    if(folder) {
      if(!folder.chapters) folder.chapters = [];
      folder.chapters.push(chapter);
      folder.chapters = sortChapters(folder.chapters);
      await updateDoc(doc(db,'estudo_pastas', folder.id), { chapters: folder.chapters });
    } else {
      var novaPasta = { name: item.folderName, open: true, chapters: [chapter], criadoEm: new Date().toISOString(), ordem: pastasCache.length };
      var ref = await addDoc(collection(db,'estudo_pastas'), novaPasta);
      novaPasta.id = ref.id;
      pastasCache.push(novaPasta);
    }
    await deleteDoc(doc(db,'estudo_lixeira', lixId));
    lixeiraCache = lixeiraCache.filter(function(x){ return x.id !== lixId; });
    if(window.syncShow) window.syncShow.synced('Estudo');
    showToast('↩ Recuperado!');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
    showToast('Erro ao recuperar');
  }
  render(); renderTrash();
};

window.permDelete = async function(lixId){
  if(window.syncShow) window.syncShow.syncing();
  try {
    await deleteDoc(doc(db,'estudo_lixeira', lixId));
    lixeiraCache = lixeiraCache.filter(function(x){ return x.id !== lixId; });
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
  }
  renderTrash(); showToast('🗑️ Excluído permanentemente');
};

// ── EDITAR PASTA ───────────────────────────────────────

      .then(function(){ if(window.syncShow) window.syncShow.synced('Estudo'); })
      .catch(function(){ if(window.syncShow) window.syncShow.offline(); });

  input.addEventListener('blur', confirm);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') input.blur();

    e.stopPropagation();
  });
  input.addEventListener('click', function(e){ e.stopPropagation(); });
};

// ── EDITAR CAPÍTULO ────────────────────────────────────
window.editChapterName = function(fid, cid){
  var folder = pastasCache.find(function(f){ return f.id == fid; });

      .then(function(){ if(window.syncShow) window.syncShow.synced('Estudo'); })

// ── EXCLUIR CAPÍTULO → LIXEIRA ─────────────────────────
window.deleteChapter = async function(fid, cid){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var idx = (folder.chapters||[]).findIndex(function(c){ return String(c.id) === String(cid); });
  if(idx === -1) return;
  var ch = folder.chapters[idx];
  var lixItem = {
    chapterId: ch.id, chapterName: ch.name, content: ch.content,
    folderId: folder.id, folderName: folder.name,
    criadoEm: new Date().toISOString()
  };
  folder.chapters.splice(idx, 1);
  if(window.syncShow) window.syncShow.syncing();
  try {
    var lixRef = await addDoc(collection(db,'estudo_lixeira'), lixItem);
    lixItem.id = lixRef.id;
    lixeiraCache.unshift(lixItem);
    await updateDoc(doc(db,'estudo_pastas', fid), { chapters: folder.chapters });
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    lixItem.id = 'local_' + Date.now();
    lixeiraCache.unshift(lixItem);
    if(window.syncShow) window.syncShow.offline();
  }
  render(); updateTrashCount();
  showToast('🗑️ Movido para a lixeira');
};

// ── COPIAR CAPÍTULO ────────────────────────────────────
window.copyChapter = async function(fid, cid, el){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var chapter = (folder.chapters||[]).find(function(c){ return String(c.id) === String(cid); });
  if(!chapter) return;
  try {
    await navigator.clipboard.writeText(chapter.content);
  } catch(e) {
    var ta = document.createElement('textarea');
    ta.value = chapter.content;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  showToast('✓ Copiado!');
  var r = document.createElement('div');
  r.className = 'ripple-el';
  r.style.left = (el.offsetWidth/2 - 30) + 'px';
  r.style.top  = (el.offsetHeight/2 - 30) + 'px';
  el.appendChild(r);
  setTimeout(function(){ r.remove(); }, 600);
  el.classList.add('copying');
  setTimeout(function(){ el.classList.remove('copying'); }, 400);
};

// ── MARCAR COMO LIDO ───────────────────────────────────
window.markDone = async function(fid, cid){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var ch = (folder.chapters||[]).find(function(c){ return String(c.id) === String(cid); });
  if(!ch) return;
  ch.done = true;
  if(window.syncShow) window.syncShow.syncing();
  try {
    await updateDoc(doc(db,'estudo_pastas', fid), { chapters: folder.chapters });
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
  }
  render();
};

// ── DELETAR PASTA ──────────────────────────────────────
window.deleteFolder = async function(fid){
  if(!confirm('Remover esta pasta e todos os capítulos?')) return;
  if(window.syncShow) window.syncShow.syncing();
  try {
    await deleteDoc(doc(db,'estudo_pastas', fid));
    pastasCache = pastasCache.filter(function(f){ return f.id != fid; });
    if(window.syncShow) window.syncShow.synced('Estudo');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
  }
  render();
};

// ── TOGGLE PASTA ───────────────────────────────────────
window.toggleFolder = async function(fid){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  folder.open = !folder.open;
  try { await updateDoc(doc(db,'estudo_pastas', fid), { open: folder.open }); } catch(e) {}
  render();
};

// ── UPLOAD DE ARQUIVOS ─────────────────────────────────
window.handleFiles = async function(fid, files){
  var folder = pastasCache.find(function(f){ return f.id == fid; });
  if(!folder) return;
  var arr = Array.from(files);
  var loaded = 0;
  arr.forEach(function(file){
    var reader = new FileReader();
    reader.onload = async function(e){
      var existing = (folder.chapters||[]).find(function(c){ return c.name === file.name; });
      if(!existing){
        if(!folder.chapters) folder.chapters = [];
        folder.chapters.push({
          id: Date.now() + '_' + Math.random(),
          name: file.name, content: e.target.result, done: false
        });
      }
      loaded++;
      if(loaded === arr.length){
        folder.chapters = sortChapters(folder.chapters);
        if(window.syncShow) window.syncShow.syncing();
        try {
          await updateDoc(doc(db,'estudo_pastas', fid), { chapters: folder.chapters });
          if(window.syncShow) window.syncShow.synced('Estudo');
        } catch(err) {
          if(window.syncShow) window.syncShow.offline();
        }
        render();
        showToast('✓ ' + arr.length + ' arquivo(s) adicionado(s)');
      }
    };
    reader.readAsText(file);
  });
};

// ── SVG ICONS ──────────────────────────────────────────
var EDIT_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
var TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>';
var COPY_SVG  = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

var UP_SVG    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>';
var DOWN_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>';

// ── RENDER ─────────────────────────────────────────────
window.render = function(){
  var stats = globalStats();
  var pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;
  document.getElementById('globalPct').textContent = pct + '%';
  document.getElementById('globalBar').style.width = pct + '%';
  updateTrashCount();

  var list = document.getElementById('folderList');
  list.innerHTML = '';

  if(!pastasCache.length){
    list.innerHTML = '<div class="empty-msg">Nenhuma pasta ainda.<br>Crie uma para começar.</div>';
    return;
  }

  pastasCache.forEach(function(folder, folderIdx){
    var pending   = (folder.chapters||[]).filter(function(c){ return !c.done; });
    var doneCount = (folder.chapters||[]).filter(function(c){ return c.done; }).length;
    var tot  = (folder.chapters||[]).length;
    var fpct = tot > 0 ? Math.round((doneCount / tot) * 100) : 0;

    var div = document.createElement('div');
    div.className = 'folder' + (folder.open ? ' open' : '');
    div.dataset.id = folder.id;

    var chaptersHTML = '';
    if(pending.length === 0 && tot > 0){
      chaptersHTML = '<div class="all-done"><div class="emoji">🎉</div><p>Todos os <strong>'+tot+'</strong> capítulos concluídos!</p></div>';
    } else if(pending.length === 0){
      chaptersHTML = '<div class="empty-msg">Nenhum arquivo ainda.<br>Adicione acima.</div>';
    } else {
      chaptersHTML = pending.map(function(ch, i){
        return '<div class="chapter-item" onclick="copyChapter(\''+folder.id+'\', \''+ch.id+'\', this)" data-fid="'+folder.id+'" data-cid="'+ch.id+'">'
          +'<span class="chapter-num">'+(i+1).toString().padStart(2,'0')+'</span>'
          +'<span class="chapter-name">'+ch.name.replace(/\.[^.]+$/,'')+'</span>'
          +'<button class="chapter-edit-btn" onclick="event.stopPropagation(); editChapterName(\''+folder.id+'\', \''+ch.id+'\')" title="Renomear">'+EDIT_SVG+'</button>'
          +'<span class="chapter-copy-icon">'+COPY_SVG+'</span>'
          +'<button class="done-btn" onclick="event.stopPropagation(); markDone(\''+folder.id+'\', \''+ch.id+'\')">lido ✓</button>'
          +'<button class="del-chapter-btn" onclick="event.stopPropagation(); deleteChapter(\''+folder.id+'\', \''+ch.id+'\')" title="Mover para lixeira">'+TRASH_SVG+'</button>'
          +'</div>';
      }).join('');
    }

    var isFirst = folderIdx === 0;
    var isLast  = folderIdx === pastasCache.length - 1;

    div.innerHTML = '<div class="folder-header" onclick="toggleFolder(\''+folder.id+'\')"><span class="folder-icon">📁</span>'
      +'<span class="folder-name">'+folder.name+'</span>'
      +'<span class="folder-stats"><span class="done">'+doneCount+'</span>/'+tot+'</span>'
      // Botões mover
      +'<button class="move-btn" onclick="event.stopPropagation(); moveFolderUp(\''+folder.id+'\')" title="Mover para cima"'+(isFirst?' disabled style="opacity:0.25;cursor:default;"':'')+'>'+UP_SVG+'</button>'
      +'<button class="move-btn" onclick="event.stopPropagation(); moveFolderDown(\''+folder.id+'\')" title="Mover para baixo"'+(isLast?' disabled style="opacity:0.25;cursor:default;"':'')+'>'+DOWN_SVG+'</button>'
      // Editar / deletar
      +'<button class="icon-btn edit" onclick="event.stopPropagation(); editFolderName(\''+folder.id+'\')" title="Renomear">'+EDIT_SVG+'</button>'
      +'<button class="icon-btn danger" onclick="event.stopPropagation(); deleteFolder(\''+folder.id+'\')" title="Remover pasta">'+TRASH_SVG+'</button>'
      +CHEV_SVG+'</div>'
      +'<div class="folder-progress"><div class="folder-progress-fill" style="width:'+fpct+'%"></div></div>'
      +'<div class="folder-body">'
      +'<label class="add-files-area"><input type="file" multiple accept="*/*" onchange="handleFiles(\''+folder.id+'\', this.files)"><p>📎 Soltar arquivos aqui ou <span>clique para selecionar</span></p></label>'
      +'<div class="chapter-list">'+chaptersHTML+'</div>'
      +'</div>';

    list.appendChild(div);
  });
};

// ── onSnapshot ─────────────────────────────────────────
function iniciarListeners(){
  onSnapshot(query(collection(db,'estudo_pastas'), orderBy('criadoEm','asc')), function(snap){
    pastasCache = [];
    snap.forEach(function(d){ pastasCache.push({ id: d.id, ...d.data() }); });
    // Ordena pelo campo 'ordem' se disponível, senão por criadoEm
    pastasCache.sort(function(a,b){
      var oa = (a.ordem !== undefined) ? a.ordem : 9999;
      var ob = (b.ordem !== undefined) ? b.ordem : 9999;
      return oa - ob;
    });
    render();
  });

  onSnapshot(query(collection(db,'estudo_lixeira'), orderBy('criadoEm','desc')), function(snap){
    lixeiraCache = [];
    snap.forEach(function(d){ lixeiraCache.push({ id: d.id, ...d.data() }); });
    updateTrashCount();
  });
}

/* ══════════════════════════════════════════════════════
   PARTE 2 — GERENCIADOR DE ARQUIVOS FLUTUANTE
   Usa coleções Firebase ISOLADAS: estudo_fm / estudo_fm_trash
   Não interfere em nenhuma outra coleção existente.
══════════════════════════════════════════════════════ */

var efmFs   = { root: { type:'folder', name:'Arquivos', children:{} } };
var efmPath = [];
var efmTrash = [];
var efmViewingKey = null;
var efmEditorKey  = null;
var efmEditorType = 'txt';
var efmNewType    = 'txt';
var efmPendingFiles = [];
var efmSortMode   = 'manual';
var efmSearchActive = false;
var efmSearchQuery  = '';
var efmHistory    = [];
var efmHistoryIdx = -1;
var efmAutosaveTimer = null;
var efmConfirmCb  = null;

// Salva no Firebase (coleção estudo_fm)
async function efmSaveFs(){
  if(window.syncShow) window.syncShow.syncing();
  try {
    await setDoc(doc(db,'estudo_fm','data'), { fs: efmFs });
    if(window.syncShow) window.syncShow.synced('Arquivos');
  } catch(e) {
    if(window.syncShow) window.syncShow.offline();
  }
}
async function efmSaveTrashFs(){
  try { await setDoc(doc(db,'estudo_fm_trash','data'), { list: efmTrash }); } catch(e){}
}

// Listeners FM isolados
onSnapshot(doc(db,'estudo_fm','data'), function(snap){
  efmFs = snap.exists() ? (snap.data().fs || efmFs) : efmFs;
  efmRenderList();
});
onSnapshot(doc(db,'estudo_fm_trash','data'), function(snap){
  efmTrash = snap.exists() ? (snap.data().list || []) : [];
});

// ── Helpers ────────────────────────────────────────────
function efmCurrentFolder(){
  var node = efmFs.root;
  for(var i=0; i<efmPath.length; i++){
    var p = efmPath[i];
    if(!node.children) node.children={};
    if(!node.children[p]) node.children[p]={type:'folder',name:p,children:{}};
    node = node.children[p];
    if(!node.children) node.children={};
  }
  return node;
}
function efmPathLabel(){
  return ['📁 Arquivos', ...efmPath].join(' › ');
}
function efmGenName(){
  var now = new Date();
  var p = function(n){ return String(n).padStart(2,'0'); };
  return now.getFullYear()+p(now.getMonth()+1)+p(now.getDate())+'-'+p(now.getHours())+p(now.getMinutes());
}
function efmSafeKey(folder, name){
  var k = name, c = 1;
  while(folder.children[k]){ k = name.replace(/(\.[^.]+)?$/, '_'+c+'$1'); c++; }
  return k;
}
function efmDetectType(filename){
  var ext = (filename.split('.').pop()||'').toLowerCase();
  if(['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return 'image';
  if(ext==='html'||ext==='htm') return 'html';
  if(ext==='md') return 'md';
  if(ext==='pdf') return 'pdf';
  return 'txt';
}
function efmHumanSize(b){
  if(b<1024) return b+'B';
  if(b<1024*1024) return (b/1024).toFixed(1)+'KB';
  return (b/1024/1024).toFixed(1)+'MB';
}
function efmProcessText(text){
  if(!text) return '';
  return text.replace(/\n/g,'<br>').replace(/https?:\/\/[^\s<>"]+/g, function(url){
    try{ var u=new URL(url); return '<a href="'+url+'" target="_blank" style="color:#c8f568;text-decoration:underline;">'+u.hostname+'</a>'; }
    catch(e){ return url; }
  });
}

// ── SEARCH ─────────────────────────────────────────────
window.efmToggleSearch = function(){

window.efmCloseSearch = function(){

  document.getElementById('efmSearchBar').classList.remove('open');

// ── SORT ───────────────────────────────────────────────
window.efmSetSort = function(mode, btn){
  efmSortMode = mode;
  document.querySelectorAll('.fm-sort-chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  efmRenderList();
};
function efmSortKeys(keys, children){
  if(efmSortMode === 'manual') return [...keys].sort(function(a,b){
    var ta=children[a].type==='folder'?0:1, tb=children[b].type==='folder'?0:1;
    return ta-tb;
  });
  return [...keys].sort(function(a,b){
    var ia=children[a], ib=children[b];
    var ta=ia.type==='folder'?0:1, tb=ib.type==='folder'?0:1;
    if(ta!==tb) return ta-tb;
    if(efmSortMode==='az') return a.localeCompare(b);
    if(efmSortMode==='za') return b.localeCompare(a);
    if(efmSortMode==='newer') return (ib.createdAt||0)-(ia.createdAt||0);
    return 0;
  });
}

// ── RENDER LIST ────────────────────────────────────────
function efmRenderList(){
  var folder = efmCurrentFolder();
  document.getElementById('efmPath').textContent = efmPathLabel();
  document.getElementById('efmBack').textContent = efmPath.length===0 ? '✕' : '←';
  var list = document.getElementById('efmList');
  list.innerHTML = '';

  var keys = Object.keys(folder.children||{});

  // Filtro busca
  if(efmSearchActive && efmSearchQuery){
    keys = keys.filter(function(k){ return k.toLowerCase().includes(efmSearchQuery); });
  }

  if(!keys.length){
    list.innerHTML = '<div class="fm-empty">📂 Vazio<br><small>Toque em "+ Novo" para adicionar</small></div>';
    return;
  }

  var sorted = efmSortKeys(keys, folder.children);
  sorted.forEach(function(key){
    var item = folder.children[key];
    var isFolder = item.type === 'folder';
    var el = document.createElement('div');
    el.className = 'fm-item';
    var icon = isFolder ? '📁' : item.type==='image' ? '🖼️' : item.type==='html' ? '🌐' : item.type==='md' ? '📝' : item.type==='pdf' ? '📕' : '📄';
    var meta = isFolder ? (Object.keys(item.children||{}).length+' item(s)') : ((item.content||'').length+' chars');
    if(item.modifiedAt) meta = new Date(item.modifiedAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

    el.innerHTML = '<div class="fm-item-icon">'+icon+'</div>'
      +'<div class="fm-item-info"><div class="fm-item-name">'+key+'</div><div class="fm-item-meta">'+meta+'</div></div>'
      +'<div style="display:flex;gap:4px;flex-shrink:0;">'
      +(!isFolder ? '<button class="fm-item-btn" title="Copiar" onclick="event.stopPropagation();efmCopyItem(\''+key+'\',this)">📋</button>' : '')
      +'<button class="fm-item-del" onclick="event.stopPropagation();efmDelete(\''+key+'\')">✕</button></div>';

    el.addEventListener('click', function(e){
      if(e.target.closest('.fm-item-btn') || e.target.closest('.fm-item-del')) return;
      if(isFolder){ efmPath.push(key); efmRenderList(); }
      else if(item.type==='image'){ efmViewImage(key); }
      else { efmOpenEditor(key); }
    });

    list.appendChild(el);
  });
}

// ── DELETE → LIXEIRA ───────────────────────────────────
window.efmDelete = function(key){
  window.efmConfirm('Mover <strong>'+key+'</strong> para a lixeira?','Mover para lixeira', async function(){
    var folder = efmCurrentFolder();
    var item = folder.children[key];
    if(!item) return;
    efmTrash.unshift({ key, item: JSON.parse(JSON.stringify(item)), path:[...efmPath], deletedAt:Date.now() });
    delete folder.children[key];
    await efmSaveFs();
    await efmSaveTrashFs();
    efmRenderList();
  });
};

// ── COPIAR ITEM ────────────────────────────────────────
window.efmCopyItem = function(key, btn){
  var folder = efmCurrentFolder();
  var item = folder.children[key];
  if(!item) return;
  var div = document.createElement('div');
  div.innerHTML = item.content||'';
  var text = div.innerText || div.textContent || item.content || '';
  navigator.clipboard.writeText(text).then(function(){
    if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; }, 1200); }
  }).catch(function(){
    var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    if(btn){ var o=btn.textContent; btn.textContent='✓'; setTimeout(function(){ btn.textContent=o; }, 1200); }
  });
};

// ── VIEW IMAGE ─────────────────────────────────────────
function efmViewImage(key){
  var folder = efmCurrentFolder();
  var item = folder.children[key];
  efmViewingKey = key;
  document.getElementById('efmViewerTitle').textContent = key;
  document.getElementById('efmViewerEditBtn').style.display = 'none';
  var body = document.getElementById('efmViewerBody');
  body.innerHTML = '';
  body.style.cssText = 'flex:1;overflow:auto;background:#000;display:flex;align-items:center;justify-content:center;padding:0;';
  var img = document.createElement('img');
  img.src = item.content;
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;';
  body.appendChild(img);
  document.getElementById('efmViewer').classList.add('open');
}

window.efmCloseViewer = function(){
  document.getElementById('efmViewer').classList.remove('open');
  efmViewingKey = null;
};
window.efmEditFromViewer = function(){
  if(!efmViewingKey) return;
  window.efmCloseViewer();
  efmOpenEditor(efmViewingKey);
};

// ── LIXEIRA FM ─────────────────────────────────────────
window.efmOpenTrash = function(){
  efmRenderTrash();
  document.getElementById('efmTrashOverlay').classList.add('open');
};
window.efmCloseTrash = function(){
  document.getElementById('efmTrashOverlay').classList.remove('open');
};
function efmRenderTrash(){
  var list = document.getElementById('efmTrashList');
  list.innerHTML = '';
  if(!efmTrash.length){
    list.innerHTML = '<div class="fm-empty">🗑️ Lixeira vazia</div>'; return;
  }
  efmTrash.forEach(function(entry, idx){
    var el = document.createElement('div');
    el.className = 'fm-trash-item';
    var icon = entry.item.type==='folder'?'📁':entry.item.type==='image'?'🖼️':'📄';
    el.innerHTML = '<div class="fm-item-icon">'+icon+'</div>'
      +'<div style="flex:1;overflow:hidden;">'
      +'<div class="fm-trash-name">'+entry.key+'</div>'
      +'<div class="fm-item-meta">'+( entry.path.length ? entry.path.join(' › ') : 'raiz' )+'</div>'
      +'</div>'
      +'<button class="fm-restore-btn">↩ Restaurar</button>'
      +'<button class="fm-trash-del-btn">✕</button>';
    el.querySelector('.fm-restore-btn').addEventListener('click', function(){ efmRestoreItem(idx); });
    el.querySelector('.fm-trash-del-btn').addEventListener('click', function(){
      window.efmConfirm('Excluir <strong>'+entry.key+'</strong> permanentemente?','Excluir', async function(){
        efmTrash.splice(idx,1);
        await efmSaveTrashFs();
        efmRenderTrash();
      });
    });
    list.appendChild(el);
  });
}
async function efmRestoreItem(idx){
  var entry = efmTrash[idx];
  if(!entry) return;
  var node = efmFs.root;
  for(var i=0; i<entry.path.length; i++){
    var p = entry.path[i];
    if(!node.children) node.children={};
    if(!node.children[p]) node.children[p]={type:'folder',name:p,children:{}};
    node = node.children[p];
    if(!node.children) node.children={};
  }
  var k = entry.key; var c = 1;
  while(node.children[k]){ k=entry.key.replace(/(\.[^.]+)?$/,'_'+c+'$1'); c++; }
  node.children[k] = entry.item;
  efmTrash.splice(idx,1);
  await efmSaveFs();
  await efmSaveTrashFs();
  efmRenderTrash();
  efmRenderList();
  efmToast('↩ Restaurado!');
}
window.efmEmptyTrash = function(){
  window.efmConfirm('Esvaziar lixeira? '+efmTrash.length+' item(s) serão excluídos definitivamente.','Esvaziar', async function(){
    efmTrash=[];
    await efmSaveTrashFs();
    efmRenderTrash();
  });
};

// ── MODAL CRIAR ────────────────────────────────────────
window.efmOpenModal = function(){
  efmNewType='txt'; efmPendingFiles=[];
  document.getElementById('efmInpName').value='';
  document.getElementById('efmInpContent').value='';
  document.getElementById('efmInpFolderName').value='';
  document.getElementById('efmUploadPreview').innerHTML='';
  efmSetType('txt');
  document.getElementById('efmModalOverlay').classList.add('open');
};
window.efmCloseModal = function(){
  document.getElementById('efmModalOverlay').classList.remove('open');
  efmPendingFiles=[];
};
window.efmSetType = function(t){
  efmNewType=t;
  ['txt','md','html','folder','upload'].forEach(function(id){
    var btn = document.getElementById('efmType'+id.charAt(0).toUpperCase()+id.slice(1));
    if(btn) btn.classList.toggle('active', t===id);
  });
  document.getElementById('efmContentWrap').style.display  = (t==='txt'||t==='md'||t==='html')?'':'none';
  document.getElementById('efmFolderWrap').style.display   = t==='folder'?'':'none';
  document.getElementById('efmUploadWrap').style.display   = t==='upload'?'':'none';
  var lbl = document.getElementById('efmInpContentLabel');
  if(t==='html') lbl.textContent='Código HTML';
  else if(t==='md') lbl.textContent='Conteúdo Markdown';
  else lbl.textContent='Conteúdo';
};
window.efmHandleDrop = function(e){
  e.preventDefault();
  document.getElementById('efmDropZone').style.borderColor='';
  efmHandleUpload(e.dataTransfer.files);
};
window.efmHandleUpload = function(files){
  if(!files||!files.length) return;
  efmPendingFiles=[];
  var preview = document.getElementById('efmUploadPreview');
  preview.innerHTML='<div style="color:#c8f568;margin-bottom:4px;">'+files.length+' arquivo(s):</div>';
  Array.from(files).forEach(function(f){
    var div=document.createElement('div');
    div.style.cssText='padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.7rem;color:#9999bb;';
    div.textContent='📄 '+f.name+' ('+efmHumanSize(f.size)+')';
    preview.appendChild(div);
    efmPendingFiles.push(f);
  });
};
window.efmSaveItem = function(){
  var folder = efmCurrentFolder();
  var now = Date.now();
  if(efmNewType==='folder'){
    var name = document.getElementById('efmInpFolderName').value.trim();
    if(!name){ alert('Digite um nome'); return; }
    folder.children[efmSafeKey(folder,name)] = {type:'folder',name,children:{},createdAt:now,modifiedAt:now};
    efmSaveFs(); efmRenderList(); efmCloseModal(); return;
  }
  if(efmNewType==='txt'||efmNewType==='md'||efmNewType==='html'){
    var rawName = document.getElementById('efmInpName').value.trim();
    var ext = efmNewType==='md'?'.md':efmNewType==='html'?'.html':'.txt';
    var key = efmSafeKey(folder, (rawName||efmGenName())+ext);
    folder.children[key] = {type:efmNewType, content:document.getElementById('efmInpContent').value, createdAt:now, modifiedAt:now};
    efmSaveFs(); efmRenderList(); efmCloseModal();
    setTimeout(function(){ efmOpenEditor(key); }, 100);
    return;
  }
  if(efmNewType==='upload'){
    if(!efmPendingFiles.length){ alert('Selecione ao menos um arquivo'); return; }
    var done=0, total=efmPendingFiles.length;
    efmPendingFiles.forEach(function(file){
      var type = efmDetectType(file.name);
      var r = new FileReader();
      r.onload = function(e){
        folder.children[efmSafeKey(folder,file.name)] = {type,content:e.target.result,createdAt:now,modifiedAt:now};
        done++;
        if(done===total){ efmSaveFs(); efmRenderList(); efmCloseModal(); efmToast('✓ '+total+' arquivo(s) adicionado(s)'); }
      };
      if(type==='image'||type==='pdf') r.readAsDataURL(file);
      else r.readAsText(file,'UTF-8');
    });
  }
};

// ── EDITOR ────────────────────────────────────────────
function efmOpenEditor(key){
  efmEditorKey = key;
  var item = efmCurrentFolder().children[key];
  if(!item) return;
  efmEditorType = item.type||'txt';
  var editable   = document.getElementById('efmEditable');
  var codeEditor = document.getElementById('efmCodeEditor');
  var toolbar    = document.getElementById('efmEditor').querySelector('.fm-toolbar');

  if(efmEditorType==='html'){
    editable.style.display='none'; codeEditor.style.display='block';
    codeEditor.value = item.content||'';
    toolbar.style.display='none';
    codeEditor.oninput = function(){ efmTriggerAutosave(); };
  } else {
    editable.style.display='block'; codeEditor.style.display='none';
    var raw = item.content||'';
    var hasHTML = /<[a-z][\s\S]*>/i.test(raw);
    editable.innerHTML = hasHTML ? raw : efmProcessText(raw);
    toolbar.style.display='flex';
    editable.oninput = function(){ efmTriggerAutosave(); };
    editable.onpaste = function(e){
      e.preventDefault();
      var clip = e.clipboardData||window.clipboardData;
      var html = clip.getData('text/html');
      var plain = clip.getData('text/plain');
      document.execCommand('insertHTML', false, html||efmProcessText(plain));
      efmTriggerAutosave();
    };
  }
  efmHistoryInit(editable.innerHTML);
  document.getElementById('efmEditor').classList.add('open');
  setTimeout(function(){
    efmEditorType==='html' ? codeEditor.focus() : editable.focus();
  }, 200);
}

function efmTriggerAutosave(){
  clearTimeout(efmAutosaveTimer);
  efmAutosaveTimer = setTimeout(function(){
    efmDoSave();
    var badge = document.getElementById('efmAutosaveBadge');
    badge.classList.add('show');
    setTimeout(function(){ badge.classList.remove('show'); }, 2000);
  }, 1500);
}

function efmDoSave(){
  if(!efmEditorKey) return;
  var item = efmCurrentFolder().children[efmEditorKey];
  if(!item) return;
  if(efmEditorType==='html'){
    item.content = document.getElementById('efmCodeEditor').value;
  } else {
    item.content = document.getElementById('efmEditable').innerHTML;
  }
  item.modifiedAt = Date.now();
  efmSaveFs();
}

window.efmSave = function(){
  efmDoSave();
  var badge = document.getElementById('efmAutosaveBadge');
  badge.classList.add('show');
  setTimeout(function(){ badge.classList.remove('show'); }, 1500);
};

window.efmCloseEditor = function(){
  clearTimeout(efmAutosaveTimer);
  efmDoSave();
  document.getElementById('efmEditor').classList.remove('open');
  document.getElementById('efmEditable').innerHTML='';
  document.getElementById('efmCodeEditor').value='';
  efmEditorKey=null; efmHistory=[]; efmHistoryIdx=-1;
};

window.efmCmd = function(cmd){
  document.getElementById('efmEditable').focus();
  document.execCommand(cmd, false, null);
};

window.efmCopyAll = function(){
  var el = document.getElementById('efmEditable');
  var text = el.innerText||el.textContent||'';
  try {
    var blobH = new Blob([el.innerHTML],{type:'text/html'});
    var blobT = new Blob([text],{type:'text/plain'});
    navigator.clipboard.write([new ClipboardItem({'text/html':blobH,'text/plain':blobT})]);
  } catch(e){ navigator.clipboard.writeText(text); }
  efmToast('✓ Copiado!');
};

// Undo / Redo
function efmHistoryInit(html){ efmHistory=[html]; efmHistoryIdx=0; }
function efmHistoryPush(html){
  if(efmHistoryIdx<efmHistory.length-1) efmHistory=efmHistory.slice(0,efmHistoryIdx+1);
  if(efmHistory[efmHistoryIdx]===html) return;
  efmHistory.push(html);
  if(efmHistory.length>80) efmHistory.shift();
  efmHistoryIdx=efmHistory.length-1;
}
window.efmUndo = function(){
  if(efmHistoryIdx<=0) return;
  efmHistoryIdx--;
  document.getElementById('efmEditable').innerHTML=efmHistory[efmHistoryIdx];
  efmDoSave();
};
window.efmRedo = function(){
  if(efmHistoryIdx>=efmHistory.length-1) return;
  efmHistoryIdx++;
  document.getElementById('efmEditable').innerHTML=efmHistory[efmHistoryIdx];
  efmDoSave();
};
document.getElementById('efmEditable').addEventListener('input', function(){
  efmHistoryPush(this.innerHTML);
});

// ── MODO LEITURA ───────────────────────────────────────
window.efmEnterReadMode = function(){
  if(!efmEditorKey) return;
  efmDoSave();
  var item = efmCurrentFolder().children[efmEditorKey];
  if(!item) return;
  document.getElementById('efmReadTitle').textContent = efmEditorKey;
  var content = document.getElementById('efmReadContent');
  var html = efmEditorType==='html' ? item.content : document.getElementById('efmEditable').innerHTML;
  content.innerHTML = html;
  content.querySelectorAll('a').forEach(function(a){ if(!a.target) a.target='_blank'; });
  document.getElementById('efmReadMode').classList.add('open');
};
window.efmExitReadMode = function(){
  document.getElementById('efmReadMode').classList.remove('open');
};
window.efmExitReadModeToEditor = function(){
  document.getElementById('efmReadMode').classList.remove('open');
  if(efmEditorKey) efmOpenEditor(efmEditorKey);
};
