<script>
// ── Toast (clássico, sempre disponível, mesmo offline) ──
(function(){
  var timer=null;
  window.toast=function(msg,tipo){
    var t=document.getElementById('toast');
    if(!t) return;
    t.textContent=msg;
    t.classList.toggle('erro', tipo==='erro');
    t.classList.add('show');
    clearTimeout(timer);
    timer=setTimeout(function(){ t.classList.remove('show'); },2600);
  };
})();

function p_esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function parseMarkdown(t){
  if(!t)return'';

  var lines=t.split('\n');
  var out=[], inList=false, inOl=false;

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
            .replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  }
  function closeLists(){
    if(inList){out.push('</ul>');inList=false;}
    if(inOl){out.push('</ol>');inOl=false;}
  }

  for(var i=0;i<lines.length;i++){
    var l=lines[i];

    // Check marcado - [x]
    var chkDone=l.match(/^-\s+\[x\]\s*(.*)/i);
    // Check vazio - [ ]
    var chkOpen=l.match(/^-\s+\[ \]\s*(.*)/);
    // Lista numerada
    var isNum=l.match(/^(\d+)\.\s+(.*)/);
    // Lista bullet
    var isBullet=l.match(/^[-•]\s+(.*)/);

    if(chkDone||chkOpen){
      closeLists();
      var txt=esc(chkDone?chkDone[1]:chkOpen[1]);
      var done=!!chkDone;
      var uid='chk_'+i+'_'+Math.random().toString(36).slice(2,6);
      out.push('<label class="p-chk-item"><input type="checkbox" id="'+uid+'"'+(done?' checked':'')+' onchange="p_toggleCheck(this)"><span class="p-chk-txt">'+txt+'</span></label>');
    } else if(isNum){
      if(inList){out.push('</ul>');inList=false;}
      if(!inOl){out.push('<ol>');inOl=true;}
      out.push('<li>'+esc(isNum[2])+'</li>');
    } else if(isBullet){
      if(inOl){out.push('</ol>');inOl=false;}
      if(!inList){out.push('<ul>');inList=true;}
      out.push('<li>'+esc(isBullet[1])+'</li>');
    } else if(l.match(/^---+\s*$/)){
      closeLists();
      out.push('<hr class="md-hr">');
    } else if(l.match(/^#{1,4}\s+/)){
      closeLists();
      var hm=l.match(/^(#{1,4})\s+(.*)/);
      out.push('<div class="md-h">'+esc(hm[2])+'</div>');
    } else {
      closeLists();
      if(l.trim()===''){
        out.push('<div class="md-gap"></div>');
      } else {
        out.push('<div>'+esc(l)+'</div>');
      }
    }
  }
  if(inList)out.push('</ul>');
  if(inOl)out.push('</ol>');
  return out.join('');
}

function p_toggleCheck(input){
  var done=input.checked;
  var label=input.closest('label');
  var txtEl=label.querySelector('.p-chk-txt');
  var txt=txtEl.textContent;
  var card=input.closest('.p-step-card');
  if(!card)return;
  var idx=parseInt(card.dataset.idx);
  if(isNaN(idx))return;
  var escaped=txt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  var re=new RegExp('- \\[[ xX]\\] '+escaped);
  p_steps[idx].detail=p_steps[idx].detail.replace(re,(done?'- [x] ':'- [ ] ')+txt);
  p_salvarSteps();
}
window.p_toggleCheck=p_toggleCheck;

// Impede que clique no label/checkbox propague para o card
document.addEventListener('click',function(e){
  if(e.target.closest('.p-chk-item')){
    e.stopPropagation();
  }
},true);
</script>

    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;

<script>
let p_justDragged = false;

// ── Ícones (mesmo conjunto do sprite) ──
function ic(name, cls){
  return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}

// ══ MULTI-PROCESSO: estado global ══
var p_procs   = [];  // [{id, type, name, parentId, order, steps:[]}]
var p_procIdx = 0;   // índice do processo ativo (dentro de p_procs)
var p_steps   = [];  // alias: p_procs[p_procIdx].steps
var p_fabOpen = false;
var p_currentFolderId = null; // pasta atual na navegação (null = raiz)
var p_activeIdx = null;

// ── Persistência: IndexedDB (local) + Firebase (nuvem) ──
// Espelho exato do padrão usado no Administração.html

// ── IndexedDB ──
var _p_idb = null;
function p_idbOpen(){
  return new Promise(function(resolve){
    if(_p_idb){ resolve(_p_idb); return; }
    var req = indexedDB.open('doa_processo_db', 1);
    req.onupgradeneeded = function(e){ e.target.result.createObjectStore('kv'); };
    req.onsuccess = function(e){ _p_idb = e.target.result; resolve(_p_idb); };
    req.onerror = function(){ resolve(null); };
  });
}
function p_idbSet(key, val){
  p_idbOpen().then(function(db){
    if(!db){ localStorage.setItem(key, JSON.stringify(val)); return; }
    var tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(JSON.stringify(val), key);
  });
}
function p_idbGet(key){
  return p_idbOpen().then(function(db){
    if(!db){
      try{ return JSON.parse(localStorage.getItem(key)); } catch(e){ return null; }
    }
    return new Promise(function(resolve){
      var tx = db.transaction('kv','readonly');
      var req = tx.objectStore('kv').get(key);
      req.onsuccess = function(){ try{ resolve(req.result ? JSON.parse(req.result) : null); } catch(e){ resolve(null); } };
      req.onerror = function(){ resolve(null); };
    });
  });
}

// ── Firebase (lazy init via módulo ES) ──
var _p_db = null;
var _p_docRef = null;
var _p_fbReady = false;

async function p_initFirebase(){
  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { initializeFirestore, persistentLocalCache, persistentSingleTabManager, getFirestore, doc, getDoc, setDoc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const { getAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

    const cfg = {
      apiKey: "AIzaSyDPJvM-XZWfa8HQ7h8v0Usb1Hf3q8sDqpg",
      authDomain: "meus-apps-8ca76.firebaseapp.com",
      projectId: "meus-apps-8ca76",
      storageBucket: "meus-apps-8ca76.firebasestorage.app",
      messagingSenderId: "768854372271",
      appId: "1:768854372271:web:467b541baf3c513f03095a"
    };

    const apps = getApps();
    const app = apps.length ? apps[0] : initializeApp(cfg);

    // Ativa cache persistente no IndexedDB do browser
    // Na segunda visita em diante, onSnapshot entrega dados do cache LOCAL instantaneamente
    // sem esperar a rede — elimina a tela em branco
    try {
      _p_db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
      });
    } catch(e2){
      // Se já foi inicializado (ex: hot reload), usa o existente
      _p_db = getFirestore(app);
    }

    const auth = getAuth(app);

    await new Promise(function(resolve){
      onAuthStateChanged(auth, function(user){ if(user) resolve(user); });
      signInAnonymously(auth).catch(function(e){ console.warn('Auth erro:', e); resolve(null); });
    });

    _p_docRef = doc(_p_db, 'doa', 'processos');
    _p_fbReady = true;

    // Escuta mudanças — na 1ª visita vem da rede, nas seguintes vem do cache local imediatamente
    onSnapshot(_p_docRef, async function(snap){
      if(!snap.exists()) return;
      var nuvem = snap.data().procs || [];
      if(!nuvem.length) return;
      p_procs = nuvem;
      var migrou = p_migrateIfNeeded();
      p_idbSet('doa_procs', p_procs);
      if(migrou){ p_salvarTudo(); }
      p_syncAlias();
      pl_refreshIfOpen();
      // Renderiza se a tela de processo estiver aberta
      var overlay = document.getElementById('processo-overlay');
      if(overlay && overlay.classList.contains('popen')){
        p_render();
        requestAnimationFrame(p_drawLines);
      }
    }, function(e){ console.warn('Snapshot erro:', e); });

  } catch(e){
    console.warn('Firebase indisponível:', e);
    _p_fbReady = false;
  }
}

// ── Salvar: IndexedDB primeiro, Firebase depois ──
async function p_salvarTudo(){
  // 1. Salva local imediatamente — inclui o id do processo ativo
  p_idbSet('doa_procs', p_procs);
  var activeItem = p_procs[p_procIdx];
  if(activeItem && activeItem.type === 'process'){
    localStorage.setItem('doa_active_proc_id', String(activeItem.id));
  }
  if(window.syncShow) window.syncShow.syncing();
  // 2. Tenta Firebase
  if(_p_fbReady && _p_docRef){
    try {
      const { setDoc } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
      await setDoc(_p_docRef, { procs: p_procs, _t: Date.now() });
      if(window.syncShow) window.syncShow.synced('Processo');
    } catch(e){
      console.warn('Erro Firebase, salvo local:', e);
      if(window.syncShow) window.syncShow.offline();
    }
  } else {
    if(window.syncShow) window.syncShow.local();
  }
}

function p_salvarSteps(){
  if(p_procs[p_procIdx]) p_procs[p_procIdx].steps = p_steps;
  p_salvarTudo();
}

function p_stepsDefault(){
  return [
    {word:'Descobrir',detail:'Perguntar quem é o proprietário do estabelecimento'},
    {word:'Nome',detail:'Anotar o nome do responsável'},

function p_syncAlias(){
  // p_procIdx pode apontar para processo ou pasta; garante que aponta para processo válido
  var item = p_procs[p_procIdx];
  if(!item || item.type === 'folder'){
    // Encontra o primeiro processo na raiz ou qualquer processo
    var firstProc = p_procs.find(function(x){ return x.type === 'process'; });
    if(firstProc){ p_procIdx = p_procs.indexOf(firstProc); item = firstProc; }
    else { p_steps = []; var t=document.getElementById('p-proc-title'); if(t) t.textContent='Meu Processo'; return; }
  }
  p_steps = item.steps || [];
  var titleEl = document.getElementById('p-proc-title');
  if(titleEl) titleEl.textContent = item.name || 'Meu Processo';
}

function p_migrateIfNeeded(){
  var needsMigration = false;
  p_procs.forEach(function(item, i){
    if(!item.type){
      item.type = 'process';
      needsMigration = true;
    }
    // Normaliza parentId — trata undefined, null, '', 'null', 'undefined' como null
    var pid = p_normId(item.parentId);
    if(item.parentId !== pid){
      item.parentId = pid;
      needsMigration = true;
    }
    if(item.order === undefined || item.order === null){
      item.order = i;
      needsMigration = true;
    }
  });
  return needsMigration;
}

async function p_carregarSteps(){
  var local = await p_idbGet('doa_procs');
  if(local && local.length){
    p_procs = local; p_procIdx = 0;
  } else {
    try {
      var leg = JSON.parse(localStorage.getItem('doa_processos_v2'));
      if(leg && leg.length){ p_procs = leg; p_procIdx = 0; p_idbSet('doa_procs', leg); }
    } catch(e){}
  }
  if(!p_procs.length){
    p_procs = [{id:Date.now(), type:'process', name:'Meu Processo', parentId:null, order:0, steps:p_stepsDefault()}];
    p_procIdx = 0;
  }
  // Restaura o último processo ativo pelo id salvo
  var savedId = localStorage.getItem('doa_active_proc_id');
  if(savedId){
    var savedNum = parseInt(savedId);
    var savedItem = p_procs.find(function(x){ return x.id === savedNum && x.type === 'process'; });
    if(savedItem) p_procIdx = p_procs.indexOf(savedItem);
  }
  // Migração automática de dados antigos
  if(p_migrateIfNeeded()){ p_salvarTudo(); }
  p_syncAlias();
  pl_refreshIfOpen();
  p_initFirebase();
}

// ── Selecionar processo / navegar pastas ──
// Normaliza qualquer variação de "sem pasta" para null
function p_normId(v){
  if(v === undefined || v === null || v === '' || v === 'null' || v === 'undefined') return null;
  return v;
}

function p_getItemsAt(folderId){
  var target = p_normId(folderId);
  var all = p_procs.filter(function(x){
    return p_normId(x.parentId) === target;
  });
  // Pastas primeiro, depois processos — cada grupo ordenado por order
  var folders = all.filter(function(x){ return x.type === 'folder'; })
                   .sort(function(a,b){ return (a.order||0)-(b.order||0); });
  var procs   = all.filter(function(x){ return x.type !== 'folder'; })
                   .sort(function(a,b){ return (a.order||0)-(b.order||0); });
  return folders.concat(procs);
}

function p_getBreadcrumb(folderId){
  var crumbs = [];
  var cur = folderId;
  while(cur !== null && cur !== undefined){
    var item = p_procs.find(function(x){ return x.id === cur; });
    if(!item) break;
    crumbs.unshift(item.name);
    cur = item.parentId;
  }
  return crumbs;
}

// Barra de caminho (voltar + pasta atual)
function p_paintCrumbBar(barId, folderId){
  var bar = document.getElementById(barId);
  if(!bar) return;
  var show = p_normId(folderId) !== null;
  bar.style.display = show ? 'flex' : 'none';
  if(show){
    bar.querySelector('.crumb').innerHTML = ic('folder') + '<span>' + p_esc(p_getBreadcrumb(folderId).join(' › ')) + '</span>';
  }
}

// Linha de processo/pasta — usada nas duas listas
function p_buildRow(item, key, openFolder, openProc){
  var isFolder = item.type === 'folder';
  var isActive = (!isFolder && p_procs.indexOf(item) === p_procIdx);
  var row = document.createElement('div');
  row.dataset[key] = item.id;
  row.className = 'row' + (isFolder ? ' has-edit' : ' proc') + (isActive ? ' active' : '');

  var count;
  if(isFolder){
    var inside = p_procs.filter(function(x){ return x.parentId === item.id; }).length;
    count = inside + (inside === 1 ? ' item' : ' itens');
  } else {
    var n = item.steps ? item.steps.length : 0;
    count = n + (n === 1 ? ' etapa' : ' etapas');
  }

  row.innerHTML =
    '<button type="button" class="row-main">' +
      ic(isFolder ? 'folder' : 'flow', 'row-ico') +
      '<span class="row-name">' + p_esc(item.name) + '</span>' +
      '<span class="chip">' + count + '</span>' +
      (isFolder ? ic('chevron-right', 'row-chev') : '') +
    '</button>' +
    (isFolder ? '<button type="button" class="row-edit" aria-label="Editar pasta" data-tip="Editar pasta">' + ic('dots-v') + '</button>' : '');

  var main = row.querySelector('.row-main');
  if(isFolder){
    main.onclick = function(e){ e.stopPropagation(); openFolder(item); };
    row.querySelector('.row-edit').onclick = function(e){ e.stopPropagation(); p_openRenameFolder(item.id); };
  } else {
    main.onclick = function(e){ e.stopPropagation(); openProc(item); };
  }
  return row;
}

// ── Reordenar por arraste (toque longo de 500ms) — serve às duas listas ──
function p_setupListDrag(list, sel, key, getFolder, rerender){
  var rows = Array.from(list.querySelectorAll(sel));
  if(rows.length < 2) return;

  rows.forEach(function(row){
    var isDragging = false;
    var ghostEl = null;
    var srcId = null;
    var startY = 0;
    var lastOver = null;
    var longPressTimer = null;
    var activated = false;
    var touchId = null;

    function clearDrop(){
      list.querySelectorAll(sel).forEach(function(r){ r.classList.remove('drop'); });
    }

    function startDrag(clientY){
      if(activated) return;
      activated = true;
      isDragging = true;
      srcId = parseInt(row.dataset[key]);
      startY = clientY;
      row.style.opacity = '0.4';
      navigator.vibrate && navigator.vibrate(40);

      ghostEl = row.cloneNode(true);
      ghostEl.classList.add('row-ghost');
      var rect = row.getBoundingClientRect();
      ghostEl.style.top = rect.top + 'px';
      ghostEl.style.left = rect.left + 'px';
      ghostEl.style.width = rect.width + 'px';
      document.body.appendChild(ghostEl);
    }

    function moveDrag(clientY){
      if(!isDragging) return;
      var rect = row.parentElement.getBoundingClientRect();
      ghostEl.style.top = Math.max(rect.top, Math.min(rect.bottom - 50, clientY - 24)) + 'px';

      clearDrop();
      var el = document.elementFromPoint(row.getBoundingClientRect().left + 10, clientY);
      var targetRow = el ? el.closest(sel) : null;
      if(targetRow && targetRow !== row){
        targetRow.classList.add('drop');
        lastOver = parseInt(targetRow.dataset[key]);
      } else {
        lastOver = null;
      }
    }

    function endDrag(){
      if(!isDragging){ activated = false; return; }
      isDragging = false;
      activated = false;
      row.style.opacity = '';
      if(ghostEl){ ghostEl.remove(); ghostEl = null; }
      clearDrop();

      if(lastOver !== null && lastOver !== srcId){
        var levelItems = p_getItemsAt(getFolder());
        var srcItem = p_procs.find(function(x){ return x.id === srcId; });
        var dstItem = p_procs.find(function(x){ return x.id === lastOver; });
        if(srcItem && dstItem){
          var srcPos = levelItems.indexOf(srcItem);
          var dstPos = levelItems.indexOf(dstItem);
          if(srcPos !== -1 && dstPos !== -1){
            levelItems.splice(srcPos, 1);
            levelItems.splice(dstPos, 0, srcItem);
            levelItems.forEach(function(it, i){ it.order = i; });
            p_salvarTudo();
            rerender();
          }
        }
      }
      lastOver = null;
    }

    // Touch — long press de 500ms ativa o drag
    row.addEventListener('touchstart', function(e){
      if(e.target.closest('.row-edit')) return;
      var t = e.touches[0];
      touchId = t.identifier;
      startY = t.clientY;
      longPressTimer = setTimeout(function(){ startDrag(startY); }, 500);
    }, {passive:true});

    row.addEventListener('touchmove', function(e){
      var t = Array.from(e.changedTouches).find(function(x){ return x.identifier === touchId; });
      if(!isDragging){
        // Cancela long press se usuário está scrollando (movimento > 10px)
        if(t && Math.abs(t.clientY - startY) > 10){ clearTimeout(longPressTimer); }
        return;
      }
      e.preventDefault();
      if(t) moveDrag(t.clientY);
    }, {passive:false});

    row.addEventListener('touchend', function(){ clearTimeout(longPressTimer); endDrag(); }, {passive:true});
    row.addEventListener('touchcancel', function(){ clearTimeout(longPressTimer); endDrag(); }, {passive:true});

    // Mouse — clique + arraste após 500ms
    row.addEventListener('mousedown', function(e){
      if(e.target.closest('.row-edit')) return;
      if(e.target.closest('button')) return; // não interfere em cliques normais
      e.preventDefault();
      longPressTimer = setTimeout(function(){ startDrag(e.clientY); }, 500);
      function onMove(ev){
        if(!isDragging){ clearTimeout(longPressTimer); return; }
        moveDrag(ev.clientY);
      }
      function onUp(){ clearTimeout(longPressTimer); endDrag(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function p_deleteProc(){
  var item = p_procs[p_procIdx];
  if(!item) return;
  if(item.type === 'folder'){
    var inside = p_procs.filter(function(x){ return x.parentId === item.id; });
    if(inside.length > 0){ toast('Esvazie a pasta antes de excluir.', 'erro'); return; }
    p_confirm('Excluir esta pasta?', function(){
      var fi = p_procs.indexOf(item);
      if(fi !== -1) p_procs.splice(fi, 1);
      p_procIdx = 0; p_syncAlias(); p_activeIdx = null;
      p_closeRenameProc(); p_salvarTudo(); toast('Pasta excluída');
    });
    return;
  }
  var allProcs = p_procs.filter(function(x){ return x.type === 'process'; });
  if(allProcs.length <= 1){ toast('Este é o único processo.', 'erro'); return; }
  p_confirm('Excluir este processo?', function(){
    var pi = p_procs.indexOf(item);
    if(pi === -1) return;
    p_procs.splice(pi, 1);
    p_procIdx = Math.max(0, pi - 1);
    // Garante que p_procIdx aponta para um processo
    if(p_procs[p_procIdx] && p_procs[p_procIdx].type === 'folder'){

    p_closeRenameProc(); p_render(); p_salvarTudo(); pl_refreshIfOpen(); toast('Processo excluído');
  });

// Renderiza o nível atual de navegação dentro da janela "Move para"
function p_renderMoveLevel(){
  var item = p_procs[p_procIdx];
  if(!item) return;

  // Caminho clicável
  var bc = document.getElementById('p-move-breadcrumb');
  bc.innerHTML = '';
  function chip(label, icon, on, fn){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip-btn' + (on ? ' on' : '');
    b.innerHTML = (icon ? ic(icon) : '') + '<span>' + p_esc(label) + '</span>';
    b.onclick = fn;
    return b;
  }
  bc.appendChild(chip('Raiz', 'home', p_moveCurrentFolder === null, function(){ p_moveCurrentFolder = null; p_renderMoveLevel(); }));

  if(p_moveCurrentFolder !== null){
    var chain = [];
    var cur = p_procs.find(function(x){ return x.id === p_moveCurrentFolder; });
    while(cur){ chain.unshift(cur); var pid = cur.parentId; cur = p_procs.find(function(x){ return x.id === pid; }); }
    chain.forEach(function(folder){
      var sep = document.createElement('span');
      sep.className = 'sep';
      sep.innerHTML = ic('chevron-right');
      bc.appendChild(sep);
      bc.appendChild(chip(folder.name, null, folder.id === p_moveCurrentFolder, function(){ p_moveCurrentFolder = folder.id; p_renderMoveLevel(); }));
    });
  }

  // Lista do nível atual: só as subpastas diretas (exceto a própria, se for pasta)
  var list = document.getElementById('p-move-list');
  list.innerHTML = '';
  var folders = p_procs.filter(function(x){
    return x.type === 'folder' && p_normId(x.parentId) === p_normId(p_moveCurrentFolder) && x.id !== item.id;
  }).sort(function(a,b){ return (a.order||0)-(b.order||0); });

  if(folders.length === 0){
    list.innerHTML = '<div class="empty-note">Sem subpastas</div>';
  } else {
    folders.forEach(function(folder){
      list.appendChild(p_simpleRow('folder', folder.name, true, function(){ p_moveCurrentFolder = folder.id; p_renderMoveLevel(); }));
    });
  }

  // Botão "Move para cá" — esconde se o destino já é o local atual do item
  var hereBtn = document.getElementById('p-move-here-btn');
  var isAlreadyHere = (p_normId(item.parentId) === p_normId(p_moveCurrentFolder));
  if(isAlreadyHere){
    hereBtn.style.display = 'none';
  } else {
    hereBtn.style.display = 'flex';
    hereBtn.textContent = p_moveCurrentFolder === null ? 'Move para a raiz' : 'Move para cá';
  }
}

function p_moveItemTo(targetFolderId){
  var item = p_procs[p_procIdx];
  if(!item) return;
  item.parentId = p_normId(targetFolderId);
  var levelItems = p_getItemsAt(item.parentId);
  var maxOrder = levelItems.reduce(function(m,x){ return x.id !== item.id ? Math.max(m, x.order||0) : m; }, -1);
  item.order = maxOrder + 1;

  toast('Movido para ' + destName);
}

// Auto-continuar listas nos textareas
function p_listEnter(e){
  if(e.key!=='Enter')return;
  const el=e.target;
  const pos=el.selectionStart;
  const val=el.value;
  const lineStart=val.lastIndexOf('\n',pos-1)+1;
  const line=val.substring(lineStart,pos);

  // Lista numerada: "1. " → próxima "2. "
  const numMatch=line.match(/^(\d+)\.\s+(.+)/);
  if(numMatch){
    e.preventDefault();
    const nextNum=parseInt(numMatch[1])+1;
    const ins='\n'+nextNum+'. ';
    el.setRangeText(ins,pos,pos,'end');
    el.dispatchEvent(new Event('input'));
    return;
  }
  // Lista com check: "- [ ] " ou "- [x] "
  const chkMatch=line.match(/^-\s+\[[ x]\]\s+(.+)/i);
  if(chkMatch){
    e.preventDefault();
    el.setRangeText('\n- [ ] ',pos,pos,'end');
    el.dispatchEvent(new Event('input'));
    return;
  }
  // Lista bullet: "- "
  const bulletMatch=line.match(/^[-•]\s+(.+)/);
  if(bulletMatch){
    e.preventDefault();
    el.setRangeText('\n- ',pos,pos,'end');
    el.dispatchEvent(new Event('input'));
    return;
  }
}

// Converte a coordenada (clientX, clientY) de um toque/clique na posição
// correspondente de caractere dentro do valor de um campo de texto, usando
// a API nativa do navegador para textareas/divs (caretRangeFromPoint /
// caretPositionFromPoint). Retorna null se não for possível calcular —
// nesse caso a janela abre normalmente, sem cursor pré-posicionado.
function p_caretPosFromPoint(el, x, y){
  try{
    if(el.tagName==='TEXTAREA'){
      // Em textareas não há range nativo; aproxima usando um elemento
      // espelho invisível com o mesmo texto e estilo para medir a posição.
      return p_caretPosInTextarea(el, x, y);
    }
    // Para elementos renderizados (divs com HTML), usa a API de range do navegador.
    let range=null;
    if(document.caretRangeFromPoint){
      range=document.caretRangeFromPoint(x,y);
    } else if(document.caretPositionFromPoint){
      const pos=document.caretPositionFromPoint(x,y);
      if(pos){ range=document.createRange(); range.setStart(pos.offsetNode,pos.offset); }
    }
    if(!range)return null;
    // Mapeia o nó/offset do range de volta para um índice no texto plano
    // (markdown original), comparando contra o texto visível do elemento.
    const pre=document.createRange();
    pre.selectNodeContents(el);
    pre.setEnd(range.startContainer, range.startOffset);
    return pre.toString().length;
  }catch(err){
    return null;
  }
}

// Aproxima a posição do caractere tocado dentro de um <textarea>, usando um
// <span> espelho (mesma fonte/tamanho) só para medir — nunca exibido.
// Calcula por linha (rápido, O(linhas)) e depois por coluna dentro da linha
// encontrada, em vez de testar caractere por caractere — importante para
// textos longos, onde a versão ingênua ficaria lenta.
function p_caretPosInTextarea(textarea, x, y){
  const style=getComputedStyle(textarea);
  const lineHeight=parseFloat(style.lineHeight)||(parseFloat(style.fontSize)*1.4);
  const rect=textarea.getBoundingClientRect();
  const relX=x-rect.left-textarea.clientLeft+textarea.scrollLeft;
  const relY=y-rect.top-textarea.clientTop+textarea.scrollTop;

  const lines=textarea.value.split('\n');
  const lineIdx=Math.max(0, Math.min(lines.length-1, Math.floor(relY/lineHeight)));

  // Soma o tamanho das linhas anteriores (+1 por cada \n) para achar o offset inicial da linha.
  let baseOffset=0;
  for(let i=0;i<lineIdx;i++) baseOffset += lines[i].length+1;

  const lineText=lines[lineIdx];
  if(!lineText) return baseOffset;

  // Mede a linha encontrada com um espelho de uma linha só, testando cada
  // caractere dessa linha — bem mais barato que percorrer o texto inteiro.
  const mirror=document.createElement('span');
  ['fontFamily','fontSize','fontWeight','letterSpacing']
    .forEach(p=>{ mirror.style[p]=style[p]; });
  mirror.style.position='absolute';
  mirror.style.visibility='hidden';
  mirror.style.whiteSpace='pre';
  document.body.appendChild(mirror);

  let bestCol=lineText.length;
  let bestDist=Infinity;
  for(let col=0;col<=lineText.length;col++){
    mirror.textContent=lineText.slice(0,col);
    const w=mirror.getBoundingClientRect().width;
    const dist=Math.abs(w-relX);
    if(dist<bestDist){ bestDist=dist; bestCol=col; }
  }
  document.body.removeChild(mirror);

  return baseOffset+bestCol;
}

// render
function p_render(){
  p_flowEl.innerHTML='';
  p_svgEl.innerHTML='';
  p_svgEl.style.height='0';

  if(!p_steps.length){
    p_flowEl.innerHTML='<div class="p-empty"><span>Sem etapas</span><button class="btn btn-main" onclick="p_openModal()">'+ic('plus')+'Nova etapa</button></div>';
    return;
  }

  p_steps.forEach((s,i)=>{
    const row=document.createElement('div');
    row.className='p-f-row '+(i%2===0?'ltr':'rtl');
    row.dataset.idx=i;

    const card=document.createElement('div');
    card.className='p-step-card'+(p_activeIdx===i?' active':'')+(s.done?' done':'')+(p_inlineEditIdx===i?' inline-editing':'');
    card.dataset.idx=i;

    if(p_inlineEditIdx===i){
      // Modo edição inline: descrição vira textarea editável no próprio card.
      card.innerHTML=`
        <div class="p-s-word">${p_esc(s.word)}</div>
        <textarea class="p-s-inline-edit" id="p-inline-detail-${i}" oninput="p_autoGrow(this)">${p_esc(s.detail||'')}</textarea>
      `;
    } else {
      card.innerHTML=`
        <div class="p-s-word">${p_esc(s.word)}</div>
        ${s.detail?`<div class="p-s-detail">${parseMarkdown(s.detail)}</div>`:''}
      `;
    }

    if(p_inlineEditIdx===i){
      // No modo inline: 1 clique no textarea NÃO abre a janela — só edita ali.
      // 2 cliques (duplo toque) no texto abre a janela tradicional, posicionando
      // o cursor no ponto exato onde o usuário tocou.
      const inlineEl=card.querySelector('.p-s-inline-edit');
      inlineEl.addEventListener('blur',()=>{ p_commitInlineEdit(i); });
      inlineEl.addEventListener('dblclick',e=>{
        e.preventDefault();
        const caretPos=p_caretPosFromPoint(inlineEl,e.clientX,e.clientY);
        p_commitInlineEdit(i);
        p_openEdit(i, caretPos);
      });
      card.addEventListener('click',e=>{ e.stopPropagation(); });
    } else {
      // 3 estados por clique simples: fechado → leitura (active) → inline.
      // Duplo-clique, em qualquer um dos dois primeiros estados, vai direto
      // à janela tradicional, com o cursor na posição tocada.
      let clickTimer=null;
      card.addEventListener('click',e=>{
        if(p_dragIdx!==null||p_justDragged)return;
        if(clickTimer){ clearTimeout(clickTimer); clickTimer=null; return; } // é o 2º clique de um duplo-clique — ignora aqui, dblclick trata
        clickTimer=setTimeout(()=>{
          clickTimer=null;
          if(p_activeIdx===i){
            // já estava em modo leitura → avança para edição inline.
            if(s.detail!==undefined){
              p_activeIdx=null;
              p_inlineEditIdx=i;
              p_render();
            } else {
              // sem descrição, não há o que editar inline — vai direto à janela.
              p_openEdit(i);
            }
          } else {
            // card fechado → abre modo leitura (expandido).
            p_activeIdx=i;
            p_render();
          }
        },250);
      });
      card.addEventListener('dblclick',e=>{
        e.preventDefault();
        const detailEl=card.querySelector('.p-s-detail');
        const caretPos=detailEl?p_caretPosFromPoint(detailEl,e.clientX,e.clientY):null;
        p_openEdit(i, caretPos);
      });
    }

    if(p_inlineEditIdx!==i){
      p_setupDrag(card,i);
    }
    row.appendChild(card);
    p_flowEl.appendChild(row);

    if(i<p_steps.length-1){
      const sp=document.createElement('div');
      sp.className='p-row-spacer';
      p_flowEl.appendChild(sp);
    }
  });

  // Foca automaticamente o textarea inline, se algum card estiver nesse modo,
  // posicionando o cursor no final do texto (edição contínua mais natural).
  if(p_inlineEditIdx!==null){
    const inlineEl=document.getElementById('p-inline-detail-'+p_inlineEditIdx);
    if(inlineEl){
      setTimeout(()=>{
        inlineEl.focus();
        inlineEl.selectionStart=inlineEl.selectionEnd=inlineEl.value.length;
        inlineEl.style.height='';
        inlineEl.style.height=inlineEl.scrollHeight+'px';
      },50);
    }
  }

  // Aguarda o layout estabilizar completamente antes de desenhar as linhas
  setTimeout(p_drawLines, 80);
}

// Linhas curvas entre as etapas
function p_drawLines(){
  p_svgEl.innerHTML='';
  const rows=[...p_flowEl.querySelectorAll('.p-f-row')];
  if(!rows.length)return;

  const canvasRect=p_canvasEl.getBoundingClientRect();
  const scrollTop=p_canvasEl.scrollTop;
  const totalH=p_flowEl.scrollHeight;
  p_svgEl.setAttribute('height',totalH);
  p_svgEl.style.height=totalH+'px';

  rows.forEach((row,i)=>{
    if(i>=rows.length-1)return;
    const card=row.querySelector('.p-step-card');
    const nextCard=rows[i+1].querySelector('.p-step-card');
    if(!card||!nextCard)return;

    const r1=card.getBoundingClientRect();
    const r2=nextCard.getBoundingClientRect();

    // coordenadas relativas ao topo do canvas + scroll
    const x1=r1.left+(r1.width/2)-canvasRect.left;
    const y1=r1.bottom-canvasRect.top+scrollTop;
    const x2=r2.left+(r2.width/2)-canvasRect.left;
    const y2=r2.top-canvasRect.top+scrollTop;
    const cy=(y1+y2)/2;

    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${x1},${y1} C${x1},${cy} ${x2},${cy} ${x2},${y2}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke','#534AB7');
    path.setAttribute('stroke-opacity','.38');
    path.setAttribute('stroke-width','2');
    path.setAttribute('stroke-linecap','round');
    p_svgEl.appendChild(path);
  });
}

// ── DRAG & DROP ──────────────────────────────────────────────────────────
// Regra: só troca se arrastar o dedo DE um card ATÉ outro card.
// Clique simples nunca muda a ordem.

let p_dragSrcIdx = null;   // card que está sendo arrastado
let p_dragOver   = null;   // card que está sendo sobreposto

function p_setupDrag(card, idx){
  let touchId    = null;
  let pressing   = false;
  let didDrag    = false;
  let startX, startY;
  const MOVE_THRESHOLD = 12; // px mínimos para considerar que arrastou

  // ── TOUCH ──
  card.addEventListener('touchstart', e=>{
    if(card.classList.contains('active')) return;
    const t = e.touches[0];
    touchId  = t.identifier;
    pressing = true;
    didDrag  = false;
    startX   = t.clientX;
    startY   = t.clientY;
  }, {passive:true});

  card.addEventListener('touchmove', e=>{
    if(card.classList.contains('active')){ return; }
    if(!pressing) return;
    const t = [...e.changedTouches].find(x=>x.identifier===touchId);
    if(!t) return;

    const dx = Math.abs(t.clientX - startX);
    const dy = Math.abs(t.clientY - startY);

    if(!didDrag && (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD)){
      // Só inicia drag se movimento for mais horizontal que vertical
      if(dx > dy){
        didDrag = true;
        p_dragSrcIdx = idx;
        card.classList.add('dragging');
        navigator.vibrate && navigator.vibrate(30);
      } else {
        // movimento vertical — deixa scrollar, cancela drag
        pressing = false;
        return;
      }
    }

    if(didDrag){
      e.preventDefault();
      card.style.pointerEvents = 'none';
      const el = document.elementFromPoint(t.clientX, t.clientY);
      card.style.pointerEvents = '';
      const target = el ? el.closest('.p-step-card') : null;
      const targetIdx = target ? parseInt(target.dataset.idx) : null;

      p_flowEl.querySelectorAll('.drag-over-top').forEach(c=>c.classList.remove('drag-over-top'));
      if(target && targetIdx !== idx){
        target.classList.add('drag-over-top');
        p_dragOver = targetIdx;
      } else {
        p_dragOver = null;
      }
    }
  }, {passive:false});

  card.addEventListener('touchend', e=>{
    pressing = false;
    card.classList.remove('dragging');
    p_flowEl.querySelectorAll('.drag-over-top').forEach(c=>c.classList.remove('drag-over-top'));

    if(didDrag && p_dragSrcIdx !== null && p_dragOver !== null && p_dragOver !== p_dragSrcIdx){
      // Troca simples entre os dois cards
      const tmp = p_steps[p_dragSrcIdx];
      p_steps[p_dragSrcIdx] = p_steps[p_dragOver];
      p_steps[p_dragOver]   = tmp;
      p_activeIdx = null;
      p_render();
      p_salvarSteps();
      // Só bloqueia click se realmente arrastou
      p_justDragged = true;
      setTimeout(()=>{ p_justDragged = false; }, 300);
    }

    p_dragSrcIdx = null;
    p_dragOver   = null;
    didDrag      = false;
  }, {passive:true});
}

// Listeners globais de mouse — apenas para desktop
(function(){
  let mDragging = false;
  let mSrcCard  = null;
  let mSrcIdx   = null;
  let mStartX, mStartY;
  const THRESHOLD = 12;

  document.addEventListener('mousedown', e=>{
    const card = e.target.closest('.p-step-card');
    if(!card) return;
    mSrcCard  = card;
    mSrcIdx   = parseInt(card.dataset.idx);
    mDragging = false;
    mStartX   = e.clientX;
    mStartY   = e.clientY;
  });

  document.addEventListener('mousemove', e=>{
    if(mSrcIdx === null) return;
    const dx = Math.abs(e.clientX - mStartX);
    const dy = Math.abs(e.clientY - mStartY);
    if(!mDragging && (dx > THRESHOLD || dy > THRESHOLD)){
      mDragging = true;
      mSrcCard && mSrcCard.classList.add('dragging');
    }
    if(mDragging){
      mSrcCard && (mSrcCard.style.pointerEvents = 'none');
      const el = document.elementFromPoint(e.clientX, e.clientY);
      mSrcCard && (mSrcCard.style.pointerEvents = '');
      const target = el ? el.closest('.p-step-card') : null;
      p_flowEl.querySelectorAll('.drag-over-top').forEach(c=>c.classList.remove('drag-over-top'));
      if(target && parseInt(target.dataset.idx) !== mSrcIdx){
        target.classList.add('drag-over-top');
        p_dragOver = parseInt(target.dataset.idx);
      } else {
        p_dragOver = null;
      }
    }
  });

  document.addEventListener('mouseup', e=>{
    if(mSrcCard) mSrcCard.classList.remove('dragging');
    p_flowEl.querySelectorAll('.drag-over-top').forEach(c=>c.classList.remove('drag-over-top'));
    if(mDragging && mSrcIdx !== null && p_dragOver !== null && p_dragOver !== mSrcIdx){
      const tmp = p_steps[mSrcIdx];
      p_steps[mSrcIdx]  = p_steps[p_dragOver];
      p_steps[p_dragOver] = tmp;
      p_activeIdx = null;
      p_render();
      p_salvarSteps();
    }
    mDragging = false; mSrcCard = null; mSrcIdx = null; p_dragOver = null;
  });
})();

p_canvasEl.addEventListener('scroll',()=>requestAnimationFrame(p_drawLines));
p_canvasEl.addEventListener('contextmenu',e=>e.preventDefault());
p_canvasEl.addEventListener('click',e=>{
  if(!e.target.closest('.p-step-card')){
    if(p_inlineEditIdx!==null) p_commitInlineEdit(p_inlineEditIdx);
    else if(p_activeIdx!==null){p_activeIdx=null;p_render();}
  }
});

// Formatação inline no textarea
function p_fmt(id, type){
  const el=document.getElementById(id);
  if(!el)return;
  const start=el.selectionStart, end=el.selectionEnd;
  const sel=el.value.substring(start,end);
  let wrap='';
  if(type==='bold') wrap='**';
  if(type==='italic') wrap='*';
  if(type==='list'){
    if(sel){
      const lined=sel.split('\n').map(l=>l.startsWith('- ')?l:'- '+l).join('\n');
      el.setRangeText(lined,start,end,'select');
    } else {
      el.setRangeText('\n- ',start,end,'end');
    }
    el.focus();return;
  }
  if(type==='check'){
    if(sel){
      const lined=sel.split('\n').map(l=>'- [ ] '+l.replace(/^[-•]\s*/,'')).join('\n');
      el.setRangeText(lined,start,end,'select');
    } else {
      el.setRangeText('\n- [ ] ',start,end,'end');
    }
    el.focus();return;
  }
  if(type==='num'){
    if(sel){
      const lined=sel.split('\n').map((l,i)=>(i+1)+'. '+l.replace(/^\d+\.\s*/,'')).join('\n');
      el.setRangeText(lined,start,end,'select');
    } else {
      el.setRangeText('\n1. ',start,end,'end');
    }
    el.focus();return;
  }
  if(sel){
    el.setRangeText(wrap+sel+wrap,start,end,'select');
  } else {
    el.setRangeText(wrap+wrap,start,end,'end');
    el.selectionStart=el.selectionEnd=start+wrap.length;
  }
  el.focus();
}
window.p_fmt=p_fmt;

// ── Auto-grow do textarea sem resetar height a cada tecla ──
// O padrão antigo (height='auto' a cada input) força um reflow que faz o
// Chrome mobile perder a posição de scroll e "saltar" para outro ponto da
// janela enquanto o usuário digita. Aqui só aumentamos a altura quando o
// conteúdo realmente excede a altura atual — nunca resetamos antes de medir.
function p_autoGrow(el){
  if(el.scrollHeight > el.clientHeight){
    el.style.height = el.scrollHeight + 'px';
  }
}
window.p_autoGrow = p_autoGrow;

// ── --p-modal-maxh sincronizado com a altura real visível (sem o teclado),
// em vez de usar 92vh fixo, que ignora o espaço ocupado pelo teclado.
(function(){
  function p_updateModalMaxH(){
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--p-modal-maxh', (vh*0.92)+'px');
  }
  p_updateModalMaxH();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', p_updateModalMaxH);
  } else {
    window.addEventListener('resize', p_updateModalMaxH);
  }
})();

// ── Balão de informação: aparece só ao segurar o elemento ──
(function(){
  var tip = document.getElementById('tip');
  var timer = null, hideTimer = null, suppress = false;

  function show(el){
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    var r = el.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(12, r.left + r.width/2 - w/2), window.innerWidth - w - 12);
    var y = r.top - h - 10;
    if(y < 12) y = r.bottom + 10;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
    suppress = true;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, 1600);
  }
  function hide(){
    tip.classList.remove('show');
    setTimeout(function(){ suppress = false; }, 350);
  }
  function start(e){
    var el = e.target.closest && e.target.closest('[data-tip]');
    if(!el) return;
    clearTimeout(timer);
    timer = setTimeout(function(){ show(el); }, 450);
  }
  function cancel(){ clearTimeout(timer); }

  document.addEventListener('touchstart', start, {passive:true});
  document.addEventListener('touchmove', cancel, {passive:true});
  document.addEventListener('touchend', cancel, {passive:true});
  document.addEventListener('touchcancel', cancel, {passive:true});
  document.addEventListener('mousedown', start);
  document.addEventListener('mouseup', cancel);
  document.addEventListener('click', function(e){
    if(suppress && e.target.closest && e.target.closest('[data-tip]')){
      e.stopPropagation(); e.preventDefault(); suppress = false;
    }
  }, true);
})();

abrirProcesso();
</script>
