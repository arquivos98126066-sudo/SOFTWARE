<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Outros</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #ffffff;
  --surface:   #f9fafb;
  --card:      #ffffff;
  --card-hi:   #f5f5f5;
  --border:    rgba(0,0,0,0.08);
  --border-hi: rgba(0,0,0,0.15);
  --accent:    #111111;
  --accent-dim: rgba(0,0,0,0.06);
  --white:     #111111;
  --muted:     #6b7280;
  --muted2:    rgba(0,0,0,0.28);
  --fh:        'Barlow', sans-serif;
  --fl:        'Barlow Condensed', sans-serif;
  --fb:        'DM Sans', sans-serif;
  --r:         14px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--fb);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, black 15%, transparent 100%);
}
body::after {
  content: '';
  position: fixed;
  top: -130px; left: 50%; transform: translateX(-50%);
  width: 540px; height: 380px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.04) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

.back-btn {
  display: inline-flex; align-items: center; gap: 7px;
  color: var(--muted);
  font-size: 13px; font-family: var(--fh); font-weight: 600;
  text-decoration: none;
  margin: max(18px, env(safe-area-inset-top, 18px)) 0 0 13px;
  padding: 8px 14px;
  border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface);
  transition: color .2s, border-color .2s;
  position: relative; z-index: 10;
}
.back-btn:active { opacity: .7; }
.back-btn:hover  { color: #111111; border-color: var(--border-hi); }

.page-wrap {
  display: flex; flex-direction: column;
  min-height: 100dvh;
  padding-bottom: max(18px, env(safe-area-inset-bottom, 18px));
  position: relative; z-index: 1;
}

.identity {
  display: flex; align-items: center; justify-content: center;
  gap: 7px; padding: 14px 20px 16px;
  position: relative; z-index: 1;
}
.identity-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #111111;
}
.identity-label {
  font-family: var(--fl);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--muted);
}

/* 2-column grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 0 12px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  position: relative; z-index: 1;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 15px 13px 14px;
  text-decoration: none;
  display: flex; flex-direction: column;
  align-items: flex-start; gap: 6px;
  position: relative; overflow: hidden;
  transition: transform .16s cubic-bezier(.22,.68,0,1.2),
              border-color .2s, background .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
  will-change: transform;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.20) 60%, transparent);
  opacity: .62;
  transition: opacity .22s, left .25s, right .25s;
}
.card::after {
  content: '';
  position: absolute;
  bottom: -26px; left: -18px;
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.04) 0%, transparent 70%);
  opacity: .6;
  pointer-events: none;
}
.card:active { transform: scale(.952); border-color: var(--border-hi); }
@media (hover: hover) {
  .card:hover {
    background: var(--card-hi);
    border-color: rgba(0,0,0,0.15);
    box-shadow: 0 8px 28px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }
  .card:hover::before { opacity: 1; left: 5%; right: 5%; }
}

.card-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; line-height: 1; flex-shrink: 0;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.card:active .card-icon,
.card:hover  .card-icon {
  background: rgba(0,0,0,0.07);
  border-color: rgba(0,0,0,0.15);
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.card-name {
  font-family: var(--fh);
  font-size: 13.5px; font-weight: 500;
  color: #111111; line-height: 1.2; letter-spacing: -.2px;
}
.card-desc { font-size: 10.5px; color: var(--muted); line-height: 1.4; }

.card-arrow {
  position: absolute; bottom: 11px; right: 11px;
  width: 20px; height: 20px; border-radius: 5px;
  background: rgba(0,0,0,0.04);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 11px; font-weight: 700;
  transition: background .2s, color .2s, box-shadow .2s;
}
.card:hover .card-arrow,
.card:active .card-arrow {
  background: #111111;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

.footer {
  text-align: center;
  color: var(--muted2);
  font-family: var(--fl); font-size: 9.5px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  padding: 16px 24px 0;
  position: relative; z-index: 1;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .36s cubic-bezier(.22,.68,0,1.1) both; }
.card:nth-child(1) { animation-delay: .04s; }
.card:nth-child(2) { animation-delay: .08s; }
.card:nth-child(3) { animation-delay: .12s; }
.card:nth-child(4) { animation-delay: .16s; }
.card:nth-child(5) { animation-delay: .20s; }
.card:nth-child(6) { animation-delay: .24s; }
.card:nth-child(7) { animation-delay: .28s; }
.card:nth-child(8) { animation-delay: .32s; }

@media (max-width: 360px) {
  .grid { gap: 7px; padding: 0 10px; }
  .card { padding: 13px 11px 12px; }
  .card-name { font-size: 13px; }
}
</style>
</head>
