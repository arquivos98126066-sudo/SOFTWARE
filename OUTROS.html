<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outros</title>
<meta name="theme-color" content="#0d0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --bg: #0d0f1a;
    --card: #161928;
    --border: #252a42;
    --accent: #5b8dee;
    --accent2: #f97316;
    --text: #eef0ff;
    --muted: #7a82a8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  .header {
    padding: 48px 24px 32px;
    text-align: center;
    position: relative;
  }
  .header::after {
    content: '';
    display: block;
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    margin: 16px auto 0;
    border-radius: 2px;
  }
  .header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px;
    max-width: 500px;
    margin: 0 auto;
  }

  .card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 18px 20px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s, border-color 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.96); }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--c1), var(--c2));
    opacity: 1;
  }

  .card-icon { font-size: 30px; line-height: 1; }
  .card-name { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.2; }
  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .card-arrow { position: absolute; bottom: 14px; right: 14px; font-size: 16px; color: var(--muted); opacity: 0.5; }

  .c-gold    { --c1: #f59e0b; --c2: #fcd34d; }
  .c-indigo  { --c1: #6366f1; --c2: #a5b4fc; }
  .c-rose    { --c1: #f43f5e; --c2: #fda4af; }
  .c-emerald { --c1: #10b981; --c2: #6ee7b7; }
  .c-violet  { --c1: #8b5cf6; --c2: #ddd6fe; }

  .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 40px; padding: 0 24px; }

  /* BOTÃO VOLTAR */
  #__btn-voltar {
    position: fixed;
    bottom: 28px;
    left: 20px;
    z-index: 99999;
    background: transparent;
    border: none;
    box-shadow: none;
    color: rgba(255, 255, 255, 0.28);
    text-decoration: none;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 300;
    line-height: 1;
    transition: color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  #__btn-voltar:active {
    color: rgba(255, 255, 255, 0.65);
    transform: scale(0.88) translateX(-3px);
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Outros</h1>
    <p>Toque para abrir</p>
  </div>

  <div class="grid">
    <a class="card c-gold" href="RICO.html">
      <span class="card-icon">💰</span>
      <span class="card-name">Rico</span>
      <span class="card-desc">Finanças e riqueza</span>
      <span class="card-arrow">→</span>
    </a>
    <a class="card c-indigo" href="Workshop.html">
      <span class="card-icon">🛠️</span>
      <span class="card-name">Workshop</span>
      <span class="card-desc">Oficina e projetos</span>
      <span class="card-arrow">→</span>
    </a>
    <a class="card c-rose" href="DOA.html">
      <span class="card-icon">🤝</span>
      <span class="card-name">DOA</span>
      <span class="card-desc">Doações e apoio</span>
      <span class="card-arrow">→</span>
    </a>
    <a class="card c-emerald" href="ESTUDO.html">
      <span class="card-icon">📚</span>
      <span class="card-name">Estudo</span>
      <span class="card-desc">Aprendizado</span>
      <span class="card-arrow">→</span>
    </a>
    <a class="card c-violet" href="Code.html">
      <span class="card-icon">🖥️</span>
      <span class="card-name">Code</span>
      <span class="card-desc">Código HTML</span>
      <span class="card-arrow">→</span>
    </a>
  </div>

  <div class="footer">
    <p>arquivos98126066-sudo · SOFTWARE</p>
  </div>

  <!-- BOTÃO VOLTAR -->
  <a id="__btn-voltar" href="index.html">←</a>

</body>
</html>
