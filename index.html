<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =============================================
   TOKENS
============================================= */
:root {
  --bg:        #ffffff;
  --surface:   #f9fafb;
  --card:      #ffffff;
  --card-hi:   #f5f5f5;
  --border:    rgba(0,0,0,0.08);
  --border-hi: rgba(0,0,0,0.15);
  --accent:    #111111;
  --accent-dim: rgba(0,0,0,0.06);
  --white:     #111111;
  --muted:     #6b7280;
  --muted2:    rgba(0,0,0,0.28);
  --fh:        'Barlow', sans-serif;
  --fl:        'Barlow Condensed', sans-serif;
  --fb:        'DM Sans', sans-serif;
  --r:         14px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--fb);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, black 15%, transparent 100%);
}
body::after {
  content: '';
  position: fixed;
  top: -130px; left: 50%; transform: translateX(-50%);
  width: 540px; height: 380px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.04) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

/* =============================================
   LOCK SCREEN
============================================= */
#lock-screen {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
}
#lock-screen.show { display: flex; }

#lock-screen::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.04) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  pointer-events: none;
}

.lock-logo {
  width: 48px; height: 48px;
  border-radius: 13px;
  background: var(--accent-dim);
  border: 1px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 22px;
  position: relative; z-index: 1;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.lock-logo svg { width: 22px; height: 22px; }

.lock-title {
  font-family: var(--fh);
  font-size: 21px; font-weight: 500;
  color: var(--white);
  letter-spacing: -0.3px;
  margin-bottom: 5px;
  position: relative; z-index: 1;
}
.lock-subtitle {
  font-size: 13px; color: var(--muted);
  margin-bottom: 24px;
  position: relative; z-index: 1;
}

.lock-field {
  width: 100%; max-width: 300px;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.lock-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 13px 16px;
  color: var(--white);
  font-family: var(--fb); font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.lock-input::placeholder { color: var(--muted2); }
.lock-input:focus {
  border-color: rgba(0,0,0,0.30);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}
.lock-input.error {
  border-color: rgba(239,68,68,.6);
  animation: shake .32s ease;
}

.lock-btn {
  width: 100%; max-width: 300px;
  background: #111111; color: #ffffff;
  border: none; border-radius: 11px;
  padding: 14px;
  font-family: var(--fh); font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 6px;
  position: relative; z-index: 1;
  letter-spacing: .2px;
  transition: opacity .2s, transform .14s, box-shadow .2s;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.lock-btn:active { transform: scale(.97); box-shadow: none; }
.lock-btn:disabled { opacity: .4; cursor: not-allowed; }

.lock-error {
  font-size: 12px; color: #ef4444;
  display: none; text-align: center;
  margin-top: 8px; position: relative; z-index: 1;
}
.lock-error.show { display: block; }
.lock-loading {
  font-size: 12px; color: var(--muted);
  display: none; text-align: center;
  margin-top: 8px; position: relative; z-index: 1;
}
.lock-loading.show { display: block; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-7px); }
  75%      { transform: translateX(7px); }
}

/* =============================================
   APP CONTENT
============================================= */
#app-content { display: none; position: relative; z-index: 1; }
#app-content.show, html.dica #app-content { display: block; }

.logout-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top, 14px));
  right: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 7px 13px;
  font-size: 11px; font-family: var(--fb); font-weight: 500;
  cursor: pointer; z-index: 100;
  transition: color .2s, border-color .2s;
  letter-spacing: .3px;
}
.logout-btn:hover { color: #111111; border-color: var(--border-hi); }

.menu-tela { background: #020719; position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.menu-box { position: relative; width: min(100vw, calc(100dvh * 841 / 1870)); }
/* o quadro mede a própria área visível: a imagem sempre cabe inteira, sem passar da tela nem mudar de posição ao entrar e sair do app */
@supports (width: 1cqw) {
  .menu-tela { container-type: size; }
  .menu-box { width: min(100cqw, calc(100cqh * 841 / 1870)); }
}
.menu-box img { display: block; width: 100%; height: auto; -webkit-user-select: none; user-select: none; }
.menu-link { position: absolute; display: block; border-radius: 28px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.app-wrap {
  display: flex; flex-direction: column;
  min-height: 100dvh;
  padding-top: max(22px, env(safe-area-inset-top, 22px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.identity {
  display: flex; align-items: center; justify-content: center;
  gap: 7px;
  padding: 0 20px 16px;
  position: relative; z-index: 1;
}
.identity-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #111111;
}
.identity-label {
  font-family: var(--fl);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--muted);
}

/* Grid — single column, fills remaining height */
.grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 12px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
  position: relative; z-index: 1;
}

.grid .card {
  flex: 1;
}

/* Card — wide by default on main page */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 18px 18px;
  text-decoration: none;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 14px;
  position: relative; overflow: hidden;
  transition: transform .16s cubic-bezier(.22,.68,0,1.2),
              border-color .2s, background .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
  will-change: transform;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.20) 60%, transparent);
  opacity: .62;
  transition: opacity .22s, left .25s, right .25s;
}
.card::after {
  content: '';
  position: absolute;
  bottom: -26px; left: -18px;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.04) 0%, transparent 70%);
  opacity: .6;
  transition: opacity .3s;
  pointer-events: none;
}
.card:active {
  transform: scale(.98);
  border-color: var(--border-hi);
}
@media (hover: hover) {
  .card:hover {
    background: var(--card-hi);
    border-color: rgba(0,0,0,0.15);
    box-shadow: 0 8px 28px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }
  .card:hover::before { opacity: 1; left: 5%; right: 5%; }
  .card:hover::after  { opacity: 1; }
}

/* Icon — larger for wide cards */
.card-icon {
  width: 58px; height: 58px;
  border-radius: 14px;
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; line-height: 1; flex-shrink: 0;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.card:active .card-icon,
.card:hover .card-icon {
  background: rgba(0,0,0,0.07);
  border-color: rgba(0,0,0,0.15);
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.card-text {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
}

.card-name {
  font-family: var(--fh);
  font-size: 18px; font-weight: 700;
  color: #111111; line-height: 1.2; letter-spacing: -.2px;
}
.card-desc {
  font-size: 11px; color: var(--muted); line-height: 1.4;
}

.card-arrow {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: rgba(0,0,0,0.04);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px; font-weight: 700;
  flex-shrink: 0;
  transition: background .2s, color .2s, box-shadow .2s;
}
.card:hover .card-arrow,
.card:active .card-arrow {
  background: #111111;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

.footer {
  text-align: center;
  color: var(--muted2);
  font-family: var(--fl); font-size: 9.5px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  padding: 14px 24px 0;
  position: relative; z-index: 1;
}

/* PWA */
#pwa-banner {
  display: none;
  position: fixed;
  bottom: max(14px, env(safe-area-inset-bottom, 14px));
  left: 12px; right: 12px;
  background: var(--surface);
  border: 1px solid rgba(0,0,0,0.10);
  border-radius: 14px;
  padding: 13px 15px;
  flex-direction: row; align-items: center; gap: 10px;
  z-index: 999;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
#pwa-banner.show { display: flex; }
#pwa-banner span { flex: 1; font-size: 12.5px; color: #111111; }
#pwa-install {
  background: #111111; color: #fff; border: none;
  border-radius: 8px; padding: 8px 13px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: var(--fh);
  box-shadow: 0 2px 12px rgba(0,0,0,0.18);
}
#pwa-dismiss {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
#app-content.show .card { animation: fadeUp .36s cubic-bezier(.22,.68,0,1.1) both; }
#app-content.show .card:nth-child(1) { animation-delay: .04s; }
#app-content.show .card:nth-child(2) { animation-delay: .08s; }
#app-content.show .card:nth-child(3) { animation-delay: .12s; }
#app-content.show .card:nth-child(4) { animation-delay: .16s; }
#app-content.show .card:nth-child(5) { animation-delay: .20s; }

/* Sair escondido: aparece segurando o dedo em "Workspace" */
.logout-btn { display: none; }
.logout-btn.show { display: block; animation: fadeUp .25s ease both; }
.identity { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* ===== Visual profissional: ícones SVG em gradiente ===== */
.card-icon {
  width: 62px; height: 62px; border-radius: 18px; border: 0;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  box-shadow: 0 8px 18px -7px var(--sh), inset 0 1px 0 rgba(255,255,255,.38), inset 0 -2px 0 rgba(0,0,0,.08);
}
.card-icon svg {
  width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.16));
}
.card:active .card-icon, .card:hover .card-icon {
  background: linear-gradient(145deg, var(--c1), var(--c2)); border: 0; filter: brightness(1.06);
  box-shadow: 0 8px 18px -7px var(--sh), inset 0 1px 0 rgba(255,255,255,.38), inset 0 -2px 0 rgba(0,0,0,.08);
}
.card-name { font-size: 20px; letter-spacing: -.3px; }
.card-desc { font-size: 12px; }
.card-arrow { width: 32px; height: 32px; border-radius: 50%; }
.card-arrow svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.identity{min-height:36px;padding:0 20px 6px}

/* ===== Versão sem título: margens iguais em cima e embaixo, cartões distribuídos ===== */
.identity { min-height: 28px; padding: 0; }
.app-wrap { padding-top: max(0px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 28px)); }
.grid { gap: 10px; }

/* ===== Tela fixa: os cartões dividem a altura visível, sem rolagem ===== */
html, body { height: 100%; overflow: hidden; }
.app-wrap { position: fixed; inset: 0; min-height: 0; height: auto; }
.grid { min-height: 0; }
.grid .card { flex: 1 1 0; min-height: 0; padding-top: 8px; padding-bottom: 8px; }

/* ===== Segurar um app: baixar, enviar, voltar ao original ===== */
.menu-link { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
#apps-ov { position: fixed; inset: 0; z-index: 9000; background: rgba(2,7,25,.62); display: none; align-items: flex-end; justify-content: center; }
#apps-ov.on { display: flex; }
#apps-sheet { width: 100%; max-width: 480px; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); border-radius: 26px 26px 0 0; background: rgba(12,18,42,.97); border: 1px solid rgba(255,255,255,.12); border-bottom: 0; color: #fff; animation: appsSobe .22s ease both; }
@keyframes appsSobe { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
#apps-sheet .t { font-family: var(--fh); font-size: 18px; font-weight: 700; text-align: center; }
#apps-sheet .s { font-size: 12.5px; text-align: center; color: rgba(255,255,255,.58); margin: 3px 0 14px; }
#apps-sheet button { display: flex; align-items: center; gap: 14px; width: 100%; height: 56px; padding: 0 18px; margin-top: 8px; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; background: rgba(255,255,255,.07); color: #fff; font-family: var(--fh); font-size: 16px; font-weight: 600; cursor: pointer; }
#apps-sheet button:active { background: rgba(255,255,255,.16); }
#apps-sheet button:disabled { opacity: .35; }
#apps-sheet button svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#apps-aviso { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); z-index: 9100; transform: translate(-50%, 8px); max-width: 90vw; padding: 12px 20px; border-radius: 999px; background: #fff; color: #111; font-family: var(--fh); font-size: 14px; font-weight: 700; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#apps-aviso.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>

<div id="lock-screen">
  <div class="lock-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>

<!-- APP -->
<div id="app-content">

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPJvM-XZWfa8HQ7h8v0Usb1Hf3q8sDqpg",
    authDomain: "meus-apps-8ca76.firebaseapp.com",
    projectId: "meus-apps-8ca76",
    storageBucket: "meus-apps-8ca76.firebasestorage.app",
    messagingSenderId: "768854372271",
    appId: "1:768854372271:web:467b541baf3c513f03095a",
    measurementId: "G-251F3PL3ET"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, u => u ? mostrarApp() : mostrarLogin());

  window.fazerLogin = async function () {
    const email   = document.getElementById('email-input').value;
    const senha   = document.getElementById('pw-input').value;
    const erro    = document.getElementById('pw-error');
    const loading = document.getElementById('pw-loading');
    const btn     = document.getElementById('login-btn');
    erro.classList.remove('show');
    loading.classList.add('show');
    btn.disabled = true;
    try {
      await signInWithEmailAndPassword(auth, email, senha);
    } catch (e) {
      erro.classList.add('show');
      loading.classList.remove('show');
      btn.disabled = false;
      const pw = document.getElementById('pw-input');
      pw.classList.add('error');
      pw.value = '';
      setTimeout(() => pw.classList.remove('error'), 600);
    }
  };

  window.fazerLogout = async function () { await signOut(auth); };

  function mostrarApp() {
    try { localStorage.setItem('menu_logado', '1'); } catch (e) {}
    document.getElementById('lock-screen').classList.remove('show');
    document.getElementById('app-content').classList.add('show');
  }
  function mostrarLogin() {
    try { localStorage.removeItem('menu_logado'); } catch (e) {}
    document.documentElement.classList.remove('dica');
    document.getElementById('app-content').classList.remove('show');
    document.getElementById('lock-screen').classList.add('show');
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.fazerLogin();
  });
  document.getElementById('email-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('pw-input').focus();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(e => console.warn(e));
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwa-banner').classList.add('show');
  });
  document.getElementById('pwa-install').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('pwa-banner').classList.remove('show');
    }
  });
  document.getElementById('pwa-dismiss').addEventListener('click', () => {
    document.getElementById('pwa-banner').classList.remove('show');
  });
</script>

<script>
(function () {
  var id = document.querySelector('.identity'), btn = document.querySelector('.logout-btn'), t = null, h = null;
  if (!id || !btn) return;
  function mostrar() {
    btn.classList.add('show');
    if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
    clearTimeout(h); h = setTimeout(function () { btn.classList.remove('show'); }, 6000);
  }
  function cancelar() { clearTimeout(t); t = null; }
  id.addEventListener('pointerdown', function () { cancelar(); t = setTimeout(mostrar, 600); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (e) { id.addEventListener(e, cancelar); });
  id.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
<script>
(function () {
  var NOMES = {
    'TAPETE-CRM.html': ['Tapete CRM', 'TAPETE-CRM.html'], 'MEU-CRM.html': ['Meu CRM', 'MEU-CRM.html'],
    'DOA.html': ['Plano', 'DOA.html'], 'ADM.html': ['ADM', 'ADM.html'],
    'RICO.html': ['Rico', 'RICO.html'], 'LER.html': ['Estudo', 'ESTUDO.html']
  };
  var ENVIADOS = 'apps-enviados';
  var ov = document.getElementById('apps-ov'), fileIn = document.getElementById('apps-file');
  var avisoEl = document.getElementById('apps-aviso'), avisoTm = null;
  var alvo = null, tm = null, x0 = 0, y0 = 0, longo = false, confirmaTm = null, abriuEm = 0;
  function aviso(t) { avisoEl.textContent = t; avisoEl.className = 'on'; clearTimeout(avisoTm); avisoTm = setTimeout(function () { avisoEl.className = ''; }, 2600); }
  function arq(a) { return a.getAttribute('href'); }
  function urlDe(a) { return new URL(arq(a), location.href).href; }
  function enviada(a) {
    if (!window.caches) return Promise.resolve(false);
    return caches.open(ENVIADOS).then(function (c) { return c.match(urlDe(a), { ignoreSearch: true }); }).then(function (r) { return !!r; }).catch(function () { return false; });
  }
  function abre(a) {
    alvo = a; longo = true;
    var n = NOMES[arq(a)] || [a.getAttribute('aria-label'), arq(a)];
    document.getElementById('apps-t').textContent = n[0];
    var o = document.getElementById('apps-orig'); o.disabled = true; o.lastChild.nodeValue = 'Voltar ao original';
    document.getElementById('apps-s').textContent = '';
    enviada(a).then(function (sim) {
      if (alvo !== a) return;
      document.getElementById('apps-s').textContent = sim ? 'Neste aparelho: versão enviada por você' : 'Neste aparelho: versão original';
      o.disabled = !sim;
    });
    ov.className = 'on'; abriuEm = Date.now();
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }
  function fecha() { ov.className = ''; alvo = null; clearTimeout(confirmaTm); }
  function baixar(a) {
    var n = NOMES[arq(a)] || [0, arq(a)];
    fetch(arq(a)).then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) {
      var u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = n[1]; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      aviso('Baixando ' + n[1]);
    }).catch(function () { aviso('Não consegui baixar. Veja a conexão.'); });
  }
  function enviar(a, arquivo) {
    if (!arquivo) return;
    if (!window.caches) { aviso('Este navegador não guarda arquivos enviados.'); return; }
    if (arquivo.size > 8 * 1024 * 1024) { aviso('Arquivo grande demais (máximo 8 MB).'); return; }
    var ur = urlDe(a), nome = (NOMES[arq(a)] || [arq(a)])[0];
    arquivo.text().then(function (t) {
      if (!/<html[\s>]|<!doctype html/i.test(t)) { aviso('Esse arquivo não parece um HTML.'); return; }
      return caches.open(ENVIADOS).then(function (c) {
        return c.put(new Request(ur), new Response(t, { headers: { 'content-type': 'text/html; charset=utf-8' } }));
      }).then(function () {
        aviso(nome + ': novo enviado' + (navigator.serviceWorker && navigator.serviceWorker.controller ? '' : '. Feche e abra o app uma vez.'));
      });
    }).catch(function () { aviso('Não consegui guardar o arquivo.'); });
  }
  function original(a) {
    if (!window.caches) return;
    caches.open(ENVIADOS).then(function (c) { return c.delete(urlDe(a), { ignoreSearch: true }); }).then(function () {
      aviso((NOMES[arq(a)] || [arq(a)])[0] + ': voltou ao original');
    }).catch(function () { aviso('Não consegui voltar ao original.'); });
  }

  document.getElementById('apps-sheet').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.disabled || !alvo || Date.now() - abriuEm < 450) return;
    var a = alvo, acao = b.getAttribute('data-a');
    if (acao === 'baixar') { fecha(); baixar(a); }
    else if (acao === 'enviar') { fileIn._app = a; fileIn.value = ''; fecha(); fileIn.click(); }
    else if (acao === 'original') {
      if (b._pedido) { fecha(); original(a); return; }
      b._pedido = true; b.lastChild.nodeValue = 'Toque de novo para confirmar';
      clearTimeout(confirmaTm); confirmaTm = setTimeout(function () { b._pedido = false; b.lastChild.nodeValue = 'Voltar ao original'; }, 3000);
    }
  });
  ov.addEventListener('click', function (e) { if (e.target === ov && Date.now() - abriuEm > 450) fecha(); });
  fileIn.addEventListener('change', function () { var a = fileIn._app; if (a && fileIn.files && fileIn.files[0]) enviar(a, fileIn.files[0]); });

  var links = document.querySelectorAll('.menu-link');
  Array.prototype.forEach.call(links, function (a) {
    a.setAttribute('draggable', 'false');
    a.addEventListener('pointerdown', function (e) {
      longo = false; x0 = e.clientX; y0 = e.clientY; clearTimeout(tm);
      tm = setTimeout(function () { tm = null; abre(a); }, 500);
    });
    a.addEventListener('pointermove', function (e) {
      if (tm && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) { clearTimeout(tm); tm = null; }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { a.addEventListener(n, function () { clearTimeout(tm); tm = null; }); });
    a.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    a.addEventListener('click', function (e) { if (longo) { e.preventDefault(); setTimeout(function () { longo = false; }, 0); } });
  });
})();
</script>
</body>
