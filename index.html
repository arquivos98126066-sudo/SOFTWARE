<style>
/* =============================================
   TOKENS
============================================= */
:root {
  --bg:        #ffffff;
  --surface:   #f9fafb;
  --card:      #ffffff;
  --card-hi:   #f5f5f5;
  --border:    rgba(0,0,0,0.08);
  --border-hi: rgba(0,0,0,0.15);
  --accent:    #111111;
  --accent-dim: rgba(0,0,0,0.06);
  --white:     #111111;
  --muted:     #6b7280;
  --muted2:    rgba(0,0,0,0.28);
  --fh:        'Barlow', sans-serif;
  --fl:        'Barlow Condensed', sans-serif;
  --fb:        'DM Sans', sans-serif;
  --r:         14px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--fb);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse 90% 55% at 50% 0%, black 15%, transparent 100%);
}
body::after {
  content: '';
  position: fixed;
  top: -130px; left: 50%; transform: translateX(-50%);
  width: 540px; height: 380px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.04) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}

/* =============================================
   LOCK SCREEN
============================================= */
#lock-screen {
  display: none;
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 28px;
}
#lock-screen.show { display: flex; }

#lock-screen::before {
  content: '';
  position: absolute;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.04) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  pointer-events: none;
}

.lock-logo {
  width: 48px; height: 48px;
  border-radius: 13px;
  background: var(--accent-dim);
  border: 1px solid var(--border-hi);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 22px;
  position: relative; z-index: 1;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.lock-logo svg { width: 22px; height: 22px; }

.lock-title {
  font-family: var(--fh);
  font-size: 21px; font-weight: 500;
  color: var(--white);
  letter-spacing: -0.3px;
  margin-bottom: 5px;
  position: relative; z-index: 1;
}
.lock-subtitle {
  font-size: 13px; color: var(--muted);
  margin-bottom: 24px;
  position: relative; z-index: 1;
}

.lock-field {
  width: 100%; max-width: 300px;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}
.lock-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 13px 16px;
  color: var(--white);
  font-family: var(--fb); font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
.lock-input::placeholder { color: var(--muted2); }
.lock-input:focus {
  border-color: rgba(0,0,0,0.30);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}
.lock-input.error {
  border-color: rgba(239,68,68,.6);
  animation: shake .32s ease;
}

.lock-btn {
  width: 100%; max-width: 300px;
  background: #111111; color: #ffffff;
  border: none; border-radius: 11px;
  padding: 14px;
  font-family: var(--fh); font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 6px;
  position: relative; z-index: 1;
  letter-spacing: .2px;
  transition: opacity .2s, transform .14s, box-shadow .2s;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.lock-btn:active { transform: scale(.97); box-shadow: none; }
.lock-btn:disabled { opacity: .4; cursor: not-allowed; }

.lock-error {
  font-size: 12px; color: #ef4444;
  display: none; text-align: center;
  margin-top: 8px; position: relative; z-index: 1;
}
.lock-error.show { display: block; }
.lock-loading {
  font-size: 12px; color: var(--muted);
  display: none; text-align: center;
  margin-top: 8px; position: relative; z-index: 1;
}
.lock-loading.show { display: block; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-7px); }
  75%      { transform: translateX(7px); }
}

/* =============================================
   APP CONTENT
============================================= */
#app-content { display: none; position: relative; z-index: 1; }
#app-content.show, html.dica #app-content { display: block; }

.logout-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top, 14px));
  right: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  padding: 7px 13px;
  font-size: 11px; font-family: var(--fb); font-weight: 500;
  cursor: pointer; z-index: 100;
  transition: color .2s, border-color .2s;
  letter-spacing: .3px;
}
.logout-btn:hover { color: #111111; border-color: var(--border-hi); }

.menu-tela { background: #020719; position: fixed; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.menu-box { position: relative; width: min(100vw, calc(100dvh * 841 / 1870)); }
/* o quadro mede a própria área visível: a imagem sempre cabe inteira, sem passar da tela nem mudar de posição ao entrar e sair do app */
@supports (width: 1cqw) {
  .menu-tela { container-type: size; }
  .menu-box { width: min(100cqw, calc(100cqh * 841 / 1870)); }
}
.menu-box img { display: block; width: 100%; height: auto; -webkit-user-select: none; user-select: none; }
.menu-link { position: absolute; display: block; border-radius: 28px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.app-wrap {
  display: flex; flex-direction: column;
  min-height: 100dvh;
  padding-top: max(22px, env(safe-area-inset-top, 22px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
}

.identity {
  display: flex; align-items: center; justify-content: center;
  gap: 7px;
  padding: 0 20px 16px;
  position: relative; z-index: 1;
}
.identity-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #111111;
}
.identity-label {
  font-family: var(--fl);
  font-size: 9.5px; font-weight: 800;
  letter-spacing: 3.5px; text-transform: uppercase;
  color: var(--muted);
}

/* Grid — single column, fills remaining height */
.grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 12px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
  position: relative; z-index: 1;
}

.grid .card {
  flex: 1;
}

/* Card — wide by default on main page */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 18px 18px;
  text-decoration: none;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 14px;
  position: relative; overflow: hidden;
  transition: transform .16s cubic-bezier(.22,.68,0,1.2),
              border-color .2s, background .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
  will-change: transform;
  box-shadow: 0 4px 18px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.20) 60%, transparent);
  opacity: .62;
  transition: opacity .22s, left .25s, right .25s;
}
.card::after {
  content: '';
  position: absolute;
  bottom: -26px; left: -18px;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,0,0,0.04) 0%, transparent 70%);
  opacity: .6;
  transition: opacity .3s;
  pointer-events: none;
}
.card:active {
  transform: scale(.98);
  border-color: var(--border-hi);
}
@media (hover: hover) {
  .card:hover {
    background: var(--card-hi);
    border-color: rgba(0,0,0,0.15);
    box-shadow: 0 8px 28px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }
  .card:hover::before { opacity: 1; left: 5%; right: 5%; }
  .card:hover::after  { opacity: 1; }
}

/* Icon — larger for wide cards */
.card-icon {
  width: 58px; height: 58px;
  border-radius: 14px;
  background: rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; line-height: 1; flex-shrink: 0;
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.card:active .card-icon,
.card:hover .card-icon {
  background: rgba(0,0,0,0.07);
  border-color: rgba(0,0,0,0.15);
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);
}

.card-text {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
}

.card-name {
  font-family: var(--fh);
  font-size: 18px; font-weight: 700;
  color: #111111; line-height: 1.2; letter-spacing: -.2px;
}
.card-desc {
  font-size: 11px; color: var(--muted); line-height: 1.4;
}

.card-arrow {
  width: 24px; height: 24px;
  border-radius: 6px;
  background: rgba(0,0,0,0.04);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px; font-weight: 700;
  flex-shrink: 0;
  transition: background .2s, color .2s, box-shadow .2s;
}
.card:hover .card-arrow,
.card:active .card-arrow {
  background: #111111;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

.footer {
  text-align: center;
  color: var(--muted2);
  font-family: var(--fl); font-size: 9.5px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase;
  padding: 14px 24px 0;
  position: relative; z-index: 1;
}

/* PWA */
#pwa-banner {
  display: none;
  position: fixed;
  bottom: max(14px, env(safe-area-inset-bottom, 14px));
  left: 12px; right: 12px;
  background: var(--surface);
  border: 1px solid rgba(0,0,0,0.10);
  border-radius: 14px;
  padding: 13px 15px;
  flex-direction: row; align-items: center; gap: 10px;
  z-index: 999;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
#pwa-banner.show { display: flex; }
#pwa-banner span { flex: 1; font-size: 12.5px; color: #111111; }
#pwa-install {
  background: #111111; color: #fff; border: none;
  border-radius: 8px; padding: 8px 13px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: var(--fh);
  box-shadow: 0 2px 12px rgba(0,0,0,0.18);
}
#pwa-dismiss {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1;
}

@keyframes fadeUp{from{}to{}}
#app-content.show .card { animation: fadeUp .36s cubic-bezier(.22,.68,0,1.1) both; }
#app-content.show .card:nth-child(1) { animation-delay: .04s; }
#app-content.show .card:nth-child(2) { animation-delay: .08s; }
#app-content.show .card:nth-child(3) { animation-delay: .12s; }
#app-content.show .card:nth-child(4) { animation-delay: .16s; }
#app-content.show .card:nth-child(5) { animation-delay: .20s; }


/* menu do cliente: montado na hora so com os apps liberados (modelo aprovado, Estilo B) */
#menu-cli { display: none; position: fixed; inset: 0; z-index: 3; overflow-y: auto; background: radial-gradient(circle at 20% 0, #1b2a8a, #070a22 62%); }
html.cli #menu-cli, #menu-cli.on { display: flex; }
html.cli .menu-tela { display: none; }
#menu-cli .mc { margin: auto; width: 100%; max-width: 430px; padding: calc(env(safe-area-inset-top, 0px) + 26px) 20px calc(env(safe-area-inset-bottom, 0px) + 30px); display: flex; flex-direction: column; align-items: center; }
#menu-cli .lg { position: relative; top: 6px; flex: none; margin-bottom: 30px; width: 80px; height: 80px; border-radius: 50%; border: 3px solid #8a7bff; box-shadow: 0 0 18px #6a5cff; display: flex; align-items: center; justify-content: center; color: #fff; font: 800 28px -apple-system, 'Segoe UI', sans-serif; background: #0a0f33; }
#menu-cli .gd { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
#menu-cli .gd.k1 { grid-template-columns: 1fr; }
#menu-cli a.ap { border-radius: 22px; border: 1.5px solid rgba(255,255,255,.33); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; font: 500 15px -apple-system, 'Segoe UI', sans-serif; text-decoration: none; box-shadow: inset 0 0 20px rgba(255,255,255,.13); height: 120px; -webkit-tap-highlight-color: transparent; }
#menu-cli a.ap:active { filter: brightness(1.2); transform: scale(.97); }
#menu-cli a.ap svg { width: 34px; height: 34px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#menu-cli .gd > a.ap:last-child:nth-child(odd) { grid-column: 1 / 3; }
#menu-cli .k1 a.ap, #menu-cli .k2 a.ap { height: 130px; }
#menu-cli .k4 a.ap { height: 112px; } #menu-cli .k5 a.ap { height: 96px; } #menu-cli .k6 a.ap { height: 100px; }
#menu-cli .k7 .gd, #menu-cli .gd.k7 { gap: 11px; }
#menu-cli .k7 a.ap { height: 76px; font-size: 13px; gap: 5px; } #menu-cli .k7 svg { width: 26px; height: 26px; }
#menu-cli .k8 a.ap, #menu-cli .k9 a.ap, #menu-cli .k10 a.ap { height: 62px; gap: 3px; font-size: 12px; }
#menu-cli .k8 svg, #menu-cli .k9 svg, #menu-cli .k10 svg { width: 22px; height: 22px; }
#menu-cli .gd.k8, #menu-cli .gd.k9, #menu-cli .gd.k10 { gap: 9px; }
#menu-cli .sair { margin-top: 26px; background: none; border: 0; color: rgba(255,255,255,.35); font-size: 12px; }
.c-b{background:linear-gradient(145deg,#2a6bff,#123aa8)}.c-v{background:linear-gradient(145deg,#2fbf5a,#126a34)}.c-p{background:linear-gradient(145deg,#8a3bff,#4a14a0)}.c-o{background:linear-gradient(145deg,#ff8a2a,#a8490f)}.c-r{background:linear-gradient(145deg,#ff3b8a,#a01450)}.c-y{background:linear-gradient(145deg,#2ab8ff,#0f6fa8)}
/* Sair escondido: aparece segurando o dedo em "Workspace" */
.logout-btn { display: none; }
.logout-btn.show { display: block; animation: fadeUp .25s ease both; }
.identity { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* ===== Visual profissional: ícones SVG em gradiente ===== */
.card-icon {
  width: 62px; height: 62px; border-radius: 18px; border: 0;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  box-shadow: 0 8px 18px -7px var(--sh), inset 0 1px 0 rgba(255,255,255,.38), inset 0 -2px 0 rgba(0,0,0,.08);
}

  width: 34px; height: 34px; fill: none; stroke: #fff; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.16));
}
.card:active .card-icon, .card:hover .card-icon {
  background: linear-gradient(145deg, var(--c1), var(--c2)); border: 0; filter: brightness(1.06);
  box-shadow: 0 8px 18px -7px var(--sh), inset 0 1px 0 rgba(255,255,255,.38), inset 0 -2px 0 rgba(0,0,0,.08);
}
.card-name { font-size: 20px; letter-spacing: -.3px; }
.card-desc { font-size: 12px; }
.card-arrow { width: 32px; height: 32px; border-radius: 50%; }
.card-arrow svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.identity{min-height:36px;padding:0 20px 6px}

/* ===== Versão sem título: margens iguais em cima e embaixo, cartões distribuídos ===== */
.identity { min-height: 28px; padding: 0; }
.app-wrap { padding-top: max(0px, env(safe-area-inset-top, 0px)); padding-bottom: max(28px, env(safe-area-inset-bottom, 28px)); }
.grid { gap: 10px; }

/* ===== Tela fixa: os cartões dividem a altura visível, sem rolagem ===== */
html, body { height: 100%; overflow: hidden; }
.app-wrap { position: fixed; inset: 0; min-height: 0; height: auto; }
.grid { min-height: 0; }
.grid .card { flex: 1 1 0; min-height: 0; padding-top: 8px; padding-bottom: 8px; }

/* ===== Segurar um app: baixar, enviar, voltar ao original ===== */
.menu-link { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
#apps-ov { position: fixed; inset: 0; z-index: 9000; background: rgba(2,7,25,.45); display: none; }
#apps-ov.on { display: block; }
#apps-sheet { --tint: #ffffff; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 38px); display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 30px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02)), rgba(10,15,38,.86); border: 1px solid rgba(255,255,255,.28); border: 1px solid color-mix(in srgb, var(--tint) 60%, transparent); box-shadow: 0 22px 54px rgba(0,0,0,.65), 0 0 36px color-mix(in srgb, var(--tint) 38%, transparent), inset 0 1px 0 rgba(255,255,255,.22); animation: appsSobe .2s ease both; }
@keyframes appsSobe{from{}to{}}
#apps-sheet button { position: relative; display: grid; place-items: center; width: 58px; height: 58px; padding: 0; border-radius: 21px; background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.11); color: #fff; cursor: pointer; transition: background .15s, transform .12s; }
#apps-sheet button:first-child { background: linear-gradient(145deg, color-mix(in srgb, var(--tint) 55%, #0a0f26), color-mix(in srgb, var(--tint) 25%, #0a0f26)); border-color: color-mix(in srgb, var(--tint) 70%, transparent); }
#apps-sheet button:active { transform: scale(.94); filter: brightness(1.25); }

#apps-aviso { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); z-index: 9100; transform: translate(-50%, 8px); max-width: 90vw; padding: 11px 20px; border-radius: 999px; background: rgba(18,26,58,.92); border: 1px solid rgba(255,255,255,.18); color: #fff; font-family: var(--fh); font-size: 13.5px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: none; }
#apps-aviso.on { opacity: 1; transform: translate(-50%, 0); }
</style>

<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <div class="lock-title">Acesso restrito</div>

<!-- LOGIN: Cloudflare -->
<script type="module">
  /* login (Cloudflare): e-mail e senha guardados no servidor; o aparelho guarda só a chave de renovação */
  const BASE_AUTH = /github\.io$/.test(location.hostname) ? 'https://nv-dados.meusapps.workers.dev' : '';
  const temNovo = () => { try { return !!localStorage.getItem('nv.rt2'); } catch (e) { return false; } };
  if (temNovo()) mostrarApp(null); else mostrarLogin();

  window.fazerLogin = async function () {
    const email   = document.getElementById('email-input').value;
    const senha   = document.getElementById('pw-input').value;
    const erro    = document.getElementById('pw-error');
    const loading = document.getElementById('pw-loading');
    const btn     = document.getElementById('login-btn');
    erro.classList.remove('show');
    loading.classList.add('show');
    btn.disabled = true;
    try {
      let novo = null;
      try {
        const r = await fetch(BASE_AUTH + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.trim(), senha }) });
        if (r.ok) novo = await r.json();
      } catch (e) {}
      if (!novo || !novo.refresh) throw new Error('login recusado');
      try { localStorage.setItem('nv.rt2', novo.refresh); localStorage.setItem('nv.email2', novo.email || ''); } catch (e) {}
      mostrarApp(null);
    } catch (e) {
      erro.classList.add('show');
      loading.classList.remove('show');
      btn.disabled = false;
      const pw = document.getElementById('pw-input');
      pw.classList.add('error');
      pw.value = '';
      setTimeout(() => pw.classList.remove('error'), 600);
    }
  };

  window.fazerLogout = async function () { try { localStorage.removeItem('nv.rt'); localStorage.removeItem('nv.rt2'); localStorage.removeItem('nv.email2'); } catch (e) {} if (window.NvCanal) NvCanal.sair(); mostrarLogin(); };

  /* cada pessoa só abre as áreas liberadas para ela (quem libera é o servidor; aqui só avisa no toque) */
  var AREA = { 'TAPETE-CRM.html': 'tapete', 'MEU-CRM.html': 'crm', 'DOA.html': 'plano', 'ADM.html': 'adm', 'RICO.html': 'rico', 'LER.html': 'estudo' };
  /* menu do cliente: so os apps liberados; com 1 app abre direto nele; o dono segue com o menu dele */
  var ICO = { chart: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>', coin: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.5 2.5-1.5s2.5.7 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.7 2.5 1.7 2.5-.5 2.5-1.5"/>', book: '<path d="M3 5h7a2 2 0 012 2v12a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v12a2 2 0 012-2h7z"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 5a3.5 3.5 0 010 7M22 20c0-3-2-5-4-5.5"/>', rug: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 6v12M17 6v12M3 12h18"/>', cash: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', bars: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', list: '<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/>', tool: '<path d="M14 6a4 4 0 005 5l-9 9a2 2 0 01-3-3l9-9a4 4 0 01-2-2z"/>' };
  var MENU = [
    ['plano', 'Plano', 'DOA.html', 'b', 'chart'], ['rico', 'Rico', 'RICO.html', 'v', 'coin'], ['estudo', 'Estudo', 'LER.html', 'p', 'book'],
    ['crm', 'Meu CRM', 'MEU-CRM.html', 'y', 'users'], ['tapete', 'Tapete CRM', 'TAPETE-CRM.html', 'o', 'rug'], ['adm', 'ADM', 'ADM.html', 'r', 'cash'],
    ['prevenda', 'Pré-venda', 'PRE-VENDA.html', 'o', 'bars'], ['retina', 'Retina', 'RETINA.html', 'y', 'eye'], ['opa', 'Método OPA', 'METODO-OPA.html', 'p', 'list'], ['workshop', 'Workshop', 'Workshop.html', 'v', 'tool']
  ];
  async function liberaAreas() {
    try {
      if (!window.NvCanal) await import('./nv-canal.js');
      var eu = await NvCanal.eu(); if (!eu) return;
      try { localStorage.setItem('menu_perfil', eu.admin ? 'adm' : 'cli'); } catch (e) {}
      if (eu.admin) { document.documentElement.classList.remove('cli'); document.getElementById('menu-cli').classList.remove('on'); return; }
      var livres = MENU.filter(function (m) { return eu.areas.some(function (x) { return x === m[0] || x.indexOf(m[0] + ':') === 0; }); });
      if (livres.length === 1) { location.replace(livres[0][2]); return; }
      var n = Math.min(livres.length, 10);
      document.getElementById('menu-cli').innerHTML = '<div class="mc"><div class="lg">V4</div><div class="gd k' + n + '">' + livres.map(function (m) {
        return '<a class="ap c-' + m[3] + '" href="' + m[2] + '"><svg viewBox="0 0 24 24">' + ICO[m[4]] + '</svg>' + m[1] + '</a>';
      }).join('') + '</div></div>';
      document.getElementById('menu-cli').classList.add('on');
      document.documentElement.classList.add('cli');
    } catch (e) {}
  }
  function mostrarApp(u) {
    try { localStorage.setItem('menu_logado', '1'); } catch (e) {}
    liberaAreas();
    document.getElementById('lock-screen').classList.remove('show');
    document.getElementById('app-content').classList.add('show');
  }
  function mostrarLogin() {
    try { localStorage.removeItem('menu_logado'); } catch (e) {}
    document.documentElement.classList.remove('dica');
    document.getElementById('app-content').classList.remove('show');
    document.getElementById('lock-screen').classList.add('show');
  }

  document.getElementById('pw-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.fazerLogin();
  });
  document.getElementById('email-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('pw-input').focus();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(e => console.warn(e));
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwa-banner').classList.add('show');
  });
  document.getElementById('pwa-install').addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('pwa-banner').classList.remove('show');
    }
  });
  document.getElementById('pwa-dismiss').addEventListener('click', () => {
    document.getElementById('pwa-banner').classList.remove('show');
  });
</script>

<script>
(function () {
  var id = document.querySelector('.identity'), btn = document.querySelector('.logout-btn'), t = null, h = null;
  if (!id || !btn) return;
  function mostrar() {
    btn.classList.add('show');
    if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
    clearTimeout(h); h = setTimeout(function () { btn.classList.remove('show'); }, 6000);
  }
  function cancelar() { clearTimeout(t); t = null; }
  id.addEventListener('pointerdown', function () { cancelar(); t = setTimeout(mostrar, 600); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (e) { id.addEventListener(e, cancelar); });
  id.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
<script>
(function () {
  var NOMES = {
    'TAPETE-CRM.html': ['Tapete CRM', 'TAPETE-CRM.html'], 'MEU-CRM.html': ['Meu CRM', 'MEU-CRM.html'],
    'DOA.html': ['Plano', 'DOA.html'], 'ADM.html': ['ADM', 'ADM.html'],
    'RICO.html': ['Rico', 'RICO.html'], 'LER.html': ['Estudo', 'ESTUDO.html']
  };
  var ENVIADOS = 'apps-enviados';
  var CORES = { 'TAPETE-CRM.html': '#ff2d55', 'MEU-CRM.html': '#19d38a', 'DOA.html': '#9fb0d6', 'ADM.html': '#2f7bff', 'RICO.html': '#ffb020', 'LER.html': '#a45cff' };
  var ov = document.getElementById('apps-ov'), fileIn = document.getElementById('apps-file');
  var avisoEl = document.getElementById('apps-aviso'), avisoTm = null;
  var alvo = null, tm = null, x0 = 0, y0 = 0, longo = false, confirmaTm = null, abriuEm = 0;
  function aviso(t) { avisoEl.textContent = t; avisoEl.className = 'on'; clearTimeout(avisoTm); avisoTm = setTimeout(function () { avisoEl.className = ''; }, 2600); }
  function arq(a) { return a.getAttribute('href'); }
  /* app que saiu pela faixa de baixo abre na mesma posicao (vale 1 hora, uma vez) */
  document.addEventListener('click', function (e) {
    var l = e.target.closest && e.target.closest('a.menu-link'); if (!l) return;
    var C = { 'TAPETE-CRM.html': 'TAPETE', 'MEU-CRM.html': 'CRM', 'DOA.html': 'DOA', 'ADM.html': 'ADM', 'RICO.html': 'RICO', 'LER.html': 'LER' };
    try {
      var c = C[(l.getAttribute('href') || '').split('?')[0]], v = JSON.parse(localStorage.getItem('alterna.volta') || '{}');
      if (c && v[c] && Date.now() - v[c] < 3600000) { sessionStorage.setItem('troca', c); delete v[c]; localStorage.setItem('alterna.volta', JSON.stringify(v)); }
    } catch (x) {}
  }, true);
  function urlDe(a) { return new URL(arq(a), location.href).href; }
  function enviada(a) {
    if (!window.caches) return Promise.resolve(false);
    return caches.open(ENVIADOS).then(function (c) { return c.match(urlDe(a), { ignoreSearch: true }); }).then(function (r) { return !!r; }).catch(function () { return false; });
  }
  function abre(a) {
    alvo = a; longo = true;
    var o = document.getElementById('apps-orig'), sh = document.getElementById('apps-sheet');
    o.disabled = true; o.classList.remove('tem'); o._pedido = false;
    enviada(a).then(function (sim) {
      if (alvo !== a) return;
      o.disabled = !sim; o.classList.toggle('tem', sim);
    });
    ov.className = 'on'; abriuEm = Date.now();
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    setTimeout(function () { try { window.getSelection().removeAllRanges(); } catch (e) {} }, 150);
    sh.style.setProperty('--tint', CORES[arq(a)] || '#ffffff');
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }
  function fecha() { ov.className = ''; alvo = null; clearTimeout(confirmaTm); }
  function baixar(a) {
    var n = NOMES[arq(a)] || [0, arq(a)];
    fetch(arq(a)).then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) {
      var u = URL.createObjectURL(b), l = document.createElement('a');
      l.href = u; l.download = n[1]; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      aviso('Baixando ' + n[1]);
    }).catch(function () { aviso('Não consegui baixar. Veja a conexão.'); });
  }
  function enviar(a, arquivo) {
    if (!arquivo) return;
    if (!window.caches) { aviso('Este navegador não guarda arquivos enviados.'); return; }
    if (arquivo.size > 8 * 1024 * 1024) { aviso('Arquivo grande demais (máximo 8 MB).'); return; }
    var ur = urlDe(a), nome = (NOMES[arq(a)] || [arq(a)])[0];
    arquivo.text().then(function (t) {
      if (!/<html[\s>]|<!doctype html/i.test(t)) { aviso('Esse arquivo não parece um HTML.'); return; }
      return caches.open(ENVIADOS).then(function (c) {
        return c.put(new Request(ur), new Response(t, { headers: { 'content-type': 'text/html; charset=utf-8' } }));
      }).then(function () {
        aviso(nome + ': novo enviado' + (navigator.serviceWorker && navigator.serviceWorker.controller ? '' : '. Feche e abra o app uma vez.'));
      });
    }).catch(function () { aviso('Não consegui guardar o arquivo.'); });
  }
  function original(a) {
    if (!window.caches) return;
    caches.open(ENVIADOS).then(function (c) { return c.delete(urlDe(a), { ignoreSearch: true }); }).then(function () {
      aviso((NOMES[arq(a)] || [arq(a)])[0] + ': voltou ao original');
    }).catch(function () { aviso('Não consegui voltar ao original.'); });
  }

  document.getElementById('apps-sheet').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.disabled || !alvo || Date.now() - abriuEm < 450) return;
    var a = alvo, acao = b.getAttribute('data-a');
    if (acao === 'baixar') { fecha(); baixar(a); }
    else if (acao === 'enviar') { fileIn._app = a; fileIn.value = ''; fecha(); fileIn.click(); }
    else if (acao === 'original') {
      if (b._pedido) { fecha(); original(a); return; }
      b._pedido = true; aviso('Toque de novo para voltar ao original');
      clearTimeout(confirmaTm); confirmaTm = setTimeout(function () { b._pedido = false; }, 3000);
    }
  });
  ov.addEventListener('click', function (e) { if (e.target === ov && Date.now() - abriuEm > 450) fecha(); });
  fileIn.addEventListener('change', function () { var a = fileIn._app; if (a && fileIn.files && fileIn.files[0]) enviar(a, fileIn.files[0]); });

  document.addEventListener('selectstart', function (e) { var t = e.target && e.target.nodeType === 1 ? e.target : (e.target && e.target.parentElement); if (!t || !t.closest || !t.closest('input, textarea')) e.preventDefault(); });
  var links = document.querySelectorAll('.menu-link');
  Array.prototype.forEach.call(links, function (a) {
    a.setAttribute('draggable', 'false');
    a.addEventListener('pointerdown', function (e) {
      longo = false; x0 = e.clientX; y0 = e.clientY; clearTimeout(tm);
      tm = setTimeout(function () { tm = null; abre(a); }, 500);
    });
    a.addEventListener('pointermove', function (e) {
      if (tm && (Math.abs(e.clientX - x0) > 10 || Math.abs(e.clientY - y0) > 10)) { clearTimeout(tm); tm = null; }
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { a.addEventListener(n, function () { clearTimeout(tm); tm = null; }); });
    a.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    a.addEventListener('selectstart', function (e) { e.preventDefault(); });
    a.addEventListener('click', function (e) { if (longo) { e.preventDefault(); setTimeout(function () { longo = false; }, 0); } });
  });
})();
</script>
