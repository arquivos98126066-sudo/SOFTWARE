<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRÉ-VENDA</title>
<script src="https://arquivos98126066-sudo.github.io/SOFTWARE/sync-indicator.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Variáveis padrão do sistema ── */
  --sys-bg: #07070f;
  --sys-glass: rgba(255,255,255,0.05);
  --sys-glass2: rgba(255,255,255,0.09);
  --sys-border: rgba(255,255,255,0.08);
  --sys-border2: rgba(255,255,255,0.15);
  --sys-text: #f0f0fa;
  --sys-muted: #6b6b88;
  --sys-muted2: #9999bb;
  --sys-accent: #7c6dfa;
  --sys-accent2: #c96dfa;
  --sys-green: #3ddc84;
  --sys-red: #f87171;
  /* ── Variáveis do tema PRE-VENDA — Dark Futurista ── */
  --bg:#ffffff;
  --s1:#f9fafb;
  --s2:#f0f0f0;
  --border:rgba(0,0,0,0.08);
  --border2:rgba(0,0,0,0.13);
  --accent:#111111;
  --accent2:#444444;
  --red:#ff4d6a;
  --green:#2ecc8a;
  --gold:#f5a623;
  --text:#111111;
  --muted:#6b7280;
  --muted2:#9ca3af;
  --disabled:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100%;display:flex;flex-direction:column;overflow-x:hidden;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.96);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,0,0,0.08);height:54px;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.topbar-line{flex:1;height:1px;border-radius:2px;background:linear-gradient(90deg,rgba(0,0,0,0.15),rgba(0,0,0,0));}
.topbar-add{background:none;border:none;color:#111111;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1;flex-shrink:0;}
.topbar-product{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:border-color .2s;}
.topbar-product.has{color:#111111;border-color:#111111;}
.topbar-product:active{opacity:.7;}

/* PAGES */
.page{display:none;flex-direction:column;flex:1;padding-bottom:72px;overflow-y:auto;}
.page.active{display:flex;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,0.97);backdrop-filter:blur(24px);border-top:1px solid rgba(0,0,0,0.08);display:flex;height:62px;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;transition:color .2s;letter-spacing:.3px;}
.bn.active{color:#111111;}
.bn-icon{font-size:18px;line-height:1;}

/* PAGE HEADER */
.ph{padding:14px 16px 14px;}
.ph-title{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px;color:var(--muted2);letter-spacing:.2px;text-transform:uppercase;}
.ph-desc{font-size:12px;color:var(--muted);line-height:1.5;}

/* PRODUCT GRID */
.pgrid{padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.pcard{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .25s,background .25s,box-shadow .25s;position:relative;}
.pcard.sel{border-color:#111111;background:rgba(0,0,0,0.04);box-shadow:0 0 0 1px rgba(0,0,0,0.10);}
.pcard:active{opacity:.8;}
.pemoji{width:28px;height:28px;border-radius:7px;flex-shrink:0;background:var(--s2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;}
.pinfo{flex:1;min-width:0;}
.pname{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.pmeta{font-size:11px;color:var(--muted);margin-top:3px;}
.psel-badge{position:absolute;top:50%;transform:translateY(-50%);right:52px;background:#111111;color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:2px 8px;letter-spacing:.5px;}
.pdel{background:none;border:none;color:var(--muted);font-size:16px;padding:6px;cursor:pointer;flex-shrink:0;border-radius:8px;transition:color .2s;}
.pdel:hover{color:var(--red);}

.pempty{padding:50px 16px;text-align:center;color:var(--muted);}
.pempty-icon{font-size:48px;margin-bottom:14px;}
.pempty-txt{font-size:14px;line-height:1.7;}

.fadd{padding:16px 16px 10px;}
.fadd-btn{width:100%;background:#111111;color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-family:'Inter',sans-serif;letter-spacing:.2px;transition:opacity .2s;}
.fadd-btn:active{opacity:.85;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#ffffff;border:1px solid rgba(0,0,0,0.10);border-top:none;border-radius:24px 24px 0 0;padding:28px 20px 36px;width:100%;transform:translateY(40px);transition:transform .25s;}
.modal-overlay.open .modal{transform:none;}
.modal-title{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;margin-bottom:20px;color:var(--text);}
.mfield{margin-bottom:14px;}
.mlbl{font-size:11px;color:var(--muted2);margin-bottom:5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.minput{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;transition:border-color .2s;}
.minput:focus{border-color:#111111;}
.mbtn{width:100%;background:#111111;color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;font-family:'Inter',sans-serif;letter-spacing:.3px;}
.mcancel{width:100%;background:none;border:none;color:var(--muted);font-size:14px;padding:12px;cursor:pointer;font-family:'Inter',sans-serif;}

/* BLOCKS */
.blks{padding:20px 16px;display:flex;flex-direction:column;gap:10px;}
.blk{background:var(--s1);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:border-color .2s;}
.blk.open{border-color:var(--border2);}
.blkhead{display:flex;align-items:center;padding:10px 16px;cursor:pointer;gap:12px;user-select:none;}
.blkicon{font-size:14px;flex-shrink:0;}
.blkinfo{flex:1;}
.blkname{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--text);}
.blkmeta{font-size:11px;color:var(--muted);margin-top:2px;}
.blkhev{font-size:12px;color:var(--muted);transition:transform .25s;flex-shrink:0;margin-right:14px;}
.blk.open .blkhev{transform:rotate(180deg);}
.blkbody{display:none;padding:4px 16px 18px;}
.blk.open .blkbody{display:block;}

.stitle{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;}

/* TAGS */
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.tag{background:rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.10);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;color:#111111;}
.tag-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0;transition:color .2s;}
.tag-del:hover{color:var(--red);}
.tinput-row{display:flex;gap:6px;margin-top:4px;}
.tinput{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12px;outline:none;font-family:'Inter',sans-serif;transition:border-color .2s;}
.tinput:focus{border-color:#111111;}
.tadd-btn{background:#111111;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .2s;}
.tadd-btn:active{opacity:.8;}

.bprim{font-family:'Inter',sans-serif;width:100%;background:#111111;color:#fff;border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.2px;transition:opacity .2s;}
.bprim:active{opacity:.85;}

.bsec{font-family:'Inter',sans-serif;width:100%;background:#f5f5f5;color:#444444;border:1px solid rgba(0,0,0,0.10);border-radius:10px;padding:9px;font-size:11px;font-weight:600;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.2px;transition:opacity .2s;}
.bsec:active{opacity:.75;}

/* EDITABLE INLINE FIELDS */
.ef{
  display:inline-block;
  background:none;
  border:none;
  border-bottom:1.5px dashed rgba(0,0,0,0.2);
  border-radius:0;
  padding:0 2px;
  color:#444444;
  font-size:inherit;
  font-weight:600;
  cursor:text;
  min-width:40px;
  outline:none;
  transition:color .2s, border-color .2s;
  font-family:'Inter',sans-serif;
  line-height:inherit;
}
.ef.ok{color:var(--text);}
.ef:focus{border-bottom-color:#111111;color:#111111;}
.ef[data-ph]:empty::before{content:attr(data-ph);color:#6b7280;opacity:.7;font-weight:600;font-size:inherit;}

/* PREVIEW BLOCK */
.prev-block{
  background:var(--s2);
  border:1px solid var(--border2);
  border-radius:14px;
  padding:16px;
  font-size:13px;
  line-height:2;
  color:var(--text);
  margin-bottom:4px;
}

/* FORMULA CARD */
.fcard{background:var(--s2);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:10px;}
.fcard-title{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}

/* CONCORRENTES */
.cfield{margin-bottom:12px;}
.cfield-lbl{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.cfield-area{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:12px;color:var(--text);font-size:13px;line-height:1.7;outline:none;font-family:'Inter',sans-serif;resize:none;min-height:70px;transition:border-color .2s;}
.cfield-area:focus{border-color:#111111;}

/* SCRIPT VIEW */
.shtitle{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;padding:14px 16px 10px;border-bottom:1px solid var(--border);margin-bottom:10px;letter-spacing:.2px;color:var(--muted2);text-transform:uppercase;}
.shbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;}
.fps{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;}
.fpst{font-family:'Inter',sans-serif;font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.fptext{font-size:13px;line-height:1.8;color:var(--text);}
.fpmt{font-size:13px;color:var(--muted);font-style:italic;padding:20px 0;text-align:center;}

/* ARSENAL */
.apage{padding:0 16px 16px;}
.asel{margin-bottom:14px;}
.asel-lbl{font-size:11px;color:var(--muted2);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.asel-select{width:100%;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:11px 40px 11px 12px;color:var(--text);font-size:13px;outline:none;font-family:'Inter',sans-serif;transition:border-color .2s;}
.asel-select:focus{border-color:#111111;}
.acat{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.acath{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:8px;user-select:none;}
.aicon{font-size:18px;}
.aname{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;flex:1;color:var(--text);}
.acnt{background:#111111;color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:2px 8px;}
.achev{font-size:11px;color:var(--muted);transition:transform .2s;}
.acat.open .achev{transform:rotate(180deg);}
.aitems{display:none;border-top:1px solid var(--border);padding:8px 14px;}
.acat.open .aitems{display:block;}
.aitem{padding:9px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;}
.aitem:last-child{border-bottom:none;}
.ainame{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.aibody{font-size:12px;color:var(--muted2);margin-top:4px;line-height:1.7;}
.ai-del{background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;opacity:.6;flex-shrink:0;padding:2px;}
.ai-del:hover{opacity:1;}

/* AO VIVO */
.live-wrap{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;}
.live-sel-row{background:var(--s1);border:1px solid var(--border2);border-radius:14px;padding:14px;}
.live-sel-lbl{font-size:10px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;}
.live-select{width:100%;background:#ffffff;border:1px solid rgba(0,0,0,0.10);border-radius:10px;padding:10px 12px;color:#111111;font-size:13px;outline:none;font-family:'Inter',sans-serif;}
.live-result{background:var(--s1);border:1px solid var(--border2);border-radius:14px;padding:16px;display:none;}
.live-result.show{display:block;}
.live-result-inner{font-size:13px;line-height:1.9;color:var(--text);white-space:pre-wrap;}
.live-sec-hd{font-size:10px;font-weight:700;color:#444444;text-transform:uppercase;letter-spacing:.8px;margin-top:14px;margin-bottom:4px;}
.live-sec-hd:first-child{margin-top:0;}
.live-copy-btn{width:100%;background:var(--s2);color:#444444;border:1px solid var(--border2);border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Inter',sans-serif;transition:opacity .2s;}
.live-copy-btn:active{opacity:.75;}
.live-build-btn{width:100%;background:#111111;color:#fff;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Inter',sans-serif;transition:opacity .2s;}
.live-build-btn:active{opacity:.85;}

.sep{height:1px;background:var(--border);margin:14px 0;}

.no-prod{padding:70px 20px;text-align:center;color:var(--muted);}
.no-prod-icon{font-size:52px;margin-bottom:16px;}
.no-prod-txt{font-size:14px;line-height:1.7;}

.etitle{font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 12px;padding-right:24px;}
.obj-card{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;}
.obj-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;opacity:.7;transition:opacity .2s;}
.obj-del:hover{opacity:1;}
.oferta-card{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;}
.oferta-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;opacity:.7;transition:opacity .2s;}
.oferta-del:hover{opacity:1;}
.ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
</style>
</head>
<body>

<div class="topbar">
  <button class="topbar-add" onclick="openNewProd()">＋</button>
  <div class="topbar-line"></div>
  <div class="topbar-product" id="topProd" onclick="goPage('produtos')">Selecionar produto</div>
</div>

<!-- PAGE: PRODUTOS -->
<div class="page active" id="page-produtos">
  <div class="ph">
    <div class="ph-title">Produtos</div>
  </div>
  <div class="pgrid" id="pgrid"></div>
</div>

<!-- PAGE: SCRIPT -->
<div class="page" id="page-script">
  <div id="no-prod-script" class="no-prod" style="display:none">
    <div class="no-prod-icon">📋</div>
    <div class="no-prod-txt">Selecione um produto para montar seu script.</div>
  </div>
  <div id="script-content">
    <div class="ph" style="padding:0;">
      <div class="ph-title" id="scProdName" style="display:none;"></div>
    </div>
    <div class="blks" id="blks"></div>
  </div>
</div>

<!-- PAGE: ARSENAL -->
<div class="page" id="page-arsenal">
  <div class="ph">
    <div class="ph-title">⚔️ Arsenal</div>
  </div>
  <div class="apage">
    <div class="asel" style="position:relative;">
      <div id="asel-btn" onclick="toggleAselDrop()" style="display:flex;align-items:center;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:11px 12px;cursor:pointer;gap:8px;">
        <span id="asel-label" style="flex:1;font-size:13px;font-family:Inter,sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Nenhum produto</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;margin-right:16px;"><path d="M2 4L6 8L10 4" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div id="asel-drop" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--s1);border:1px solid var(--border2);border-radius:12px;z-index:300;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.5);">
        <div id="asel-list" style="max-height:220px;overflow-y:auto;"></div>
      </div>
      <select id="asel" style="display:none;" onchange="renderArsenal()"></select>
    </div>
    <div id="arsenal-body"></div>
  </div>
</div>

<!-- PAGE: SCRIPT AO VIVO -->
<div class="page" id="page-sh">
  <div class="shtitle">📋 Script Ao Vivo</div>
  <div class="live-wrap" id="live-wrap">
    <div class="fpmt">Selecione um produto para montar o script ao vivo.</div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bn active" id="bn-produtos" onclick="goPage('produtos')"><span class="bn-icon">📦</span>Produtos</button>
  <button class="bn" id="bn-script" onclick="goPage('script')"><span class="bn-icon">📝</span>Script</button>
  <button class="bn" id="bn-arsenal" onclick="goPage('arsenal')"><span class="bn-icon">⚔️</span>Arsenal</button>
  <button class="bn" id="bn-sh" onclick="goPage('sh')"><span class="bn-icon">📋</span>Ao Vivo</button>
  <button class="bn" id="bn-lixeira" onclick="goPage('lixeira');renderLixeira()"><span class="bn-icon">🗑️</span>Lixeira</button>
</nav>

<!-- PAGE: LIXEIRA -->
<div class="page" id="page-lixeira">
  <div class="ph">
    <div class="ph-title">🗑️ Lixeira</div>
  </div>
  <div style="padding:0 16px;" id="lixeira-lista"></div>
</div>

<!-- MODAL NOVO PRODUTO -->
<div class="modal-overlay" id="modal-new-prod">
  <div class="modal">
    <div class="modal-title">Novo Produto</div>
    <div class="ph-desc" style="margin-bottom:18px;font-size:13px;">Dê um nome para identificar este produto.</div>
    <div class="mfield">
      <div class="mlbl">Nome do produto</div>
      <input class="minput" id="new-prod-name" placeholder="Ex: Curso X, Serviço Y..." maxlength="40">
    </div>
    <div class="mfield">
      <div class="mlbl">Emoji (opcional)</div>
      <input class="minput" id="new-prod-emoji" placeholder="🎯" maxlength="4">
    </div>
    <button class="mbtn" onclick="createProd()">Criar produto</button>
    <button class="mcancel" onclick="closeModal('modal-new-prod')">Cancelar</button>
  </div>
</div>

<script type="module">
import { db } from "https://arquivos98126066-sudo.github.io/SOFTWARE/firebase-sync.js";
import {
  collection, doc, setDoc, deleteDoc, onSnapshot, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── CAMADA 1: LOCAL — IndexedDB com fallback localStorage ──────────────
function saveLocal(key, data) {
  try {
    const req = indexedDB.open('meus_apps_backup', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('data');
    req.onsuccess = e => {
      const tx = e.target.result.transaction('data', 'readwrite');
      tx.objectStore('data').put(JSON.stringify(data), key);
    };
  } catch(_) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(_) {}
  }
}

function loadLocal(key) {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open('meus_apps_backup', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('data');
      req.onsuccess = e => {
        const tx = e.target.result.transaction('data', 'readonly');
        const r = tx.objectStore('data').get(key);
        r.onsuccess = () => resolve(r.result ? JSON.parse(r.result) : null);
        r.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    } catch(_) {
      try { resolve(JSON.parse(localStorage.getItem(key))); } catch(_) { resolve(null); }
    }
  });
}


// ── ESTADO EM MEMÓRIA ─────────────────────────────────────
const STATE = { prods: [], sel: null };
const COLL = 'pre_venda';
const SEL_KEY = 'prevenda_sel';

// ── HELPERS ───────────────────────────────────────────────
function esc(t) {
  if (!t && t !== 0) return '';
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function getProds() { return STATE.prods; }
function getSel() { return STATE.sel; }
function D() { return STATE.prods.find(p => p.id === STATE.sel) || null; }

// ── CONTROLE DE TIMESTAMP (evita race condition do onSnapshot) ────────────
// Registra o timestamp do último save local para bloquear snapshots antigos
const _saveTimestamps = {}; // id → timestamp do último saveProd
let _blockSnapshotUntil = 0; // bloqueia onSnapshot por N ms após qualquer save

// ── IDs excluídos (evita onSnapshot restaurar) ───────────────────────────────
let _deletedProdsIds = {};
try {
  const _raw = localStorage.getItem('deleted_prevenda_ids');
  if (_raw) _deletedProdsIds = JSON.parse(_raw);
} catch(_) {}
function marcarDeletadoProd(id) {
  _deletedProdsIds[id] = Date.now();
  try { localStorage.setItem('deleted_prevenda_ids', JSON.stringify(_deletedProdsIds)); } catch(_) {}
}

// ── FIRESTORE SAVE ────────────────────────────────────────
async function saveProd(p) {
  const now = Date.now();
  const payload = { ...p, updatedAt: now };
  // 1. Salva local PRIMEIRO
  saveLocal('pre_venda_' + p.id, payload);
  // 2. Atualiza STATE em memória imediatamente (sem esperar nuvem)
  const idx = STATE.prods.findIndex(x => x.id === p.id);
  if (idx >= 0) STATE.prods[idx] = payload; else STATE.prods.push(payload);
  // 3. Marca timestamp para guard do onSnapshot
  _saveTimestamps[p.id] = now;
  _blockSnapshotUntil = now + 5000; // bloqueia por 5s após qualquer save
  // 4. Salva cache local da lista completa
  saveLocal('pre_venda_cache', STATE.prods);
  // 5. Envia para nuvem
  if (window.syncShow) window.syncShow.syncing();
  try {
    await setDoc(doc(db, COLL, p.id), payload);
    if (window.syncShow) window.syncShow.synced('Pré-Venda');
  } catch (err) {
    // Offline: marca como pendente
    try {
      const pending = JSON.parse(localStorage.getItem('prevenda_pending') || '{}');
      pending[p.id] = { ...payload, pendingSync: true };
      localStorage.setItem('prevenda_pending', JSON.stringify(pending));
    } catch (_) {}
    if (window.syncShow) window.syncShow.offline();
  }
}

async function deleteProdDB(id) {
  // Remove do pending se existir
  try {
    const pending = JSON.parse(localStorage.getItem('prevenda_pending') || '{}');
    if (pending[id]) { delete pending[id]; localStorage.setItem('prevenda_pending', JSON.stringify(pending)); }
  } catch(_) {}
  if (window.syncShow) window.syncShow.syncing();
  try {
    await deleteDoc(doc(db, COLL, id));
    if (window.syncShow) window.syncShow.synced('Pré-Venda');
  } catch (err) {
    if (window.syncShow) window.syncShow.offline();
  }
}

// ── SYNC PENDENTES ────────────────────────────────────────
async function syncPending() {
  try {
    const pending = JSON.parse(localStorage.getItem('prevenda_pending') || '{}');
    const ids = Object.keys(pending);
    if (!ids.length) return;
    for (const id of ids) {
      const p = { ...pending[id] };
      delete p.pendingSync;
      await setDoc(doc(db, COLL, id), p);
      delete pending[id];
    }
    localStorage.setItem('prevenda_pending', JSON.stringify(pending));
    if (window.syncShow) window.syncShow.synced('Pré-Venda');
  } catch (_) {}
}

// ── CARREGAR DO LOCAL (usado quando offline) ──────────────
async function carregarDoLocal() {
  const cache = await loadLocal('pre_venda_cache');
  if (cache && cache.length) {
    STATE.prods = cache;
    const savedSel = localStorage.getItem(SEL_KEY);
    if (savedSel && STATE.prods.find(p => p.id === savedSel)) STATE.sel = savedSel;
    else if (STATE.prods.length > 0) STATE.sel = STATE.prods[0].id;
    renderProds();
    updateTopProd();
    if (window.syncShow) window.syncShow.offline();
  }
}

// ── onSnapshot COM GUARD DE TIMESTAMP ────────────────────
function initRealtimeSync() {
  // Carrega local imediatamente enquanto espera o Firebase
  carregarDoLocal();

  onSnapshot(collection(db, COLL), (snapshot) => {
    const now = Date.now();

    // Se acabamos de salvar, aguarda o guard expirar antes de aceitar snapshot
    if (now < _blockSnapshotUntil) return;

    // Monta lista da nuvem
    const cloudList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

    // Para cada produto, aceita da nuvem só se nuvem for igual ou mais recente que local
    const merged = [];
    for (const cloud of cloudList) {
      // Ignora itens excluídos localmente
      if (_deletedProdsIds[cloud.id]) continue;
      const localTs = _saveTimestamps[cloud.id] || 0;
      const cloudTs = cloud.updatedAt || 0;
      if (localTs > cloudTs) {
        // Local mais recente — usa local, ignora nuvem para este produto
        const local = STATE.prods.find(p => p.id === cloud.id);
        if (local) merged.push(local);
        // Tenta corrigir nuvem em background
        setDoc(doc(db, COLL, cloud.id), local).catch(() => {});
      } else {
        merged.push(cloud);
      }
    }

    // Adiciona produtos novos que estão só no local (criados offline) — nunca dropa pendentes
    for (const local of STATE.prods) {
      if (!merged.find(p => p.id === local.id) && !_deletedProdsIds[local.id]) merged.push(local);
    }

    STATE.prods = merged;
    saveLocal('pre_venda_cache', STATE.prods);

    const savedSel = localStorage.getItem(SEL_KEY);
    if (savedSel && STATE.prods.find(p => p.id === savedSel)) {
      STATE.sel = savedSel;
    } else if (STATE.prods.length > 0 && !STATE.sel) {
      STATE.sel = STATE.prods[0].id;
    }
    renderProds();
    updateTopProd();
  }, async (err) => {
    // Offline: carrega do local
    console.warn('onSnapshot offline:', err);
    await carregarDoLocal();
  });

  // Monitora reconexão para sincronizar pendentes
  window.addEventListener('online', async () => {
    _blockSnapshotUntil = Date.now() + 10000;
    setTimeout(async () => { await syncPending(); }, 800);
  });
}

function saveField(path, value) {
  if (!path) return;
  const p = D();
  if (!p) return;
  const parts = path.split('.');
  let obj = p;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    const nextIsNum = !isNaN(parts[i + 1]);
    if (obj[k] === undefined || obj[k] === null) obj[k] = nextIsNum ? [] : {};
    obj = obj[k];
  }
  obj[parts[parts.length - 1]] = value;
  saveProd(p);
}

function setupEf(body) {
  body.querySelectorAll('.ef').forEach(el => {
    let timer;
    el.oninput = () => {
      const v = el.textContent.trim();
      el.classList.toggle('ok', v.length > 0);
      clearTimeout(timer);
      timer = setTimeout(() => saveField(el.dataset.field, v), 800);
    };
    el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } };
  });
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0d1b3e;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

      ${delBtn}
    </div>`;
  }).join('');
  catEl.innerHTML = `
    <div class="acath"><span class="aicon">${icon}</span><span class="aname">${name}</span><span class="acnt">${items.length}</span><span class="achev">▾</span></div>
    <div class="aitems">${ih}</div>`;
  catEl.querySelector('.acath').onclick = () => catEl.classList.toggle('open');
  if (onDel) {
    catEl.querySelectorAll('.ai-del').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); onDel(parseInt(btn.dataset.idx)); };
    });
  }
  return catEl;
}

function renderArsenal() {
  const id = document.getElementById('asel')?.value;
  const p = getProds().find(x => x.id === id);
  const body = document.getElementById('arsenal-body');
  body.innerHTML = '';
  if (!p) { body.innerHTML = '<div class="fpmt">Nenhum produto selecionado.</div>'; return; }
  ensureFields(p);

  const bdpItems = [
    ...(p.beneficios||[]).map(t => ({ name: '🤝 ' + t })),
    ...(p.dores||[]).map(t => ({ name: '💢 ' + t })),
    ...(p.prazeres||[]).map(t => ({ name: '✨ ' + t })),
    ...(p.objecoes||[]).map(t => ({ name: '🛡️ ' + t })),
  ];

  function saveAndRefresh(arr, idx) {
    const pp = getProds().find(x => x.id === id); if (!pp) return;
    ensureFields(pp);
    pp.arsenal[arr].splice(idx, 1);
    saveProd(pp);
    renderArsenal();
  }

  const cats = [
    makeAcat('🎯', 'Benefícios / Dores', bdpItems),
    makeAcat('🏁', 'Concorrentes', [
      ...(p.concorrentes?.quem ? [{ name: 'Quem são', texto: p.concorrentes.quem }] : []),
      ...(p.concorrentes?.vantagens_deles ? [{ name: 'Vantagens deles', texto: p.concorrentes.vantagens_deles }] : []),
      ...(p.concorrentes?.minhas_vantagens ? [{ name: 'Minhas vantagens', texto: p.concorrentes.minhas_vantagens }] : []),
    ]),
    makeAcat('🤜', 'Conexão', p.arsenal.conexao, idx => saveAndRefresh('conexao', idx)),
    makeAcat('🧲', 'Gancho', p.arsenal.gancho, idx => saveAndRefresh('gancho', idx)),
    makeAcat('🔎', 'Diagnóstico', p.arsenal.diagnostico, idx => saveAndRefresh('diagnostico', idx)),
    makeAcat('💎', 'Ofertas', p.arsenal.oferta, idx => saveAndRefresh('oferta', idx)),
    makeAcat('🌡️', 'Barômetro', p.arsenal.barometro, idx => saveAndRefresh('barometro', idx)),
    makeAcat('🛡️', 'Quebra de Objeção', p.arsenal.objecao, idx => saveAndRefresh('objecao', idx)),
    makeAcat('🤝', 'Fechamento', p.arsenal.fechamento, idx => saveAndRefresh('fechamento', idx)),
  ];

  cats.forEach(c => { if (c) body.appendChild(c); });
  if (!body.children.length) body.innerHTML = '<div class="fpmt">Nenhum argumento cadastrado ainda.</div>';
}
window.renderArsenal = renderArsenal;

// ── SCRIPT AO VIVO ────────────────────────────────────────
function renderLive() {
  const d = D();
  const wrap = document.getElementById('live-wrap');
  if (!d) {
    wrap.innerHTML = '<div class="fpmt">Selecione um produto para montar o script ao vivo.</div>';
    return;
  }
  ensureFields(d);

  const etapas = [
    { key: 'conexao', icon: '🤜', label: 'Conexão / Rapport', items: d.arsenal.conexao },
    { key: 'gancho', icon: '🧲', label: 'Gancho', items: d.arsenal.gancho },
    { key: 'diag', icon: '🔎', label: 'Diagnóstico', items: d.arsenal.diagnostico },
    { key: 'oferta', icon: '💎', label: 'Oferta', items: d.arsenal.oferta },
    { key: 'baro', icon: '🌡️', label: 'Barômetro', items: d.arsenal.barometro },
    { key: 'objecao', icon: '🛡️', label: 'Quebra de Objeção', items: d.arsenal.objecao },
    { key: 'fech', icon: '🤝', label: 'Fechamento', items: d.arsenal.fechamento },
  ].filter(e => e.items && e.items.length > 0);

  let h = '';
  etapas.forEach(e => {
    const opts = e.items.map((it, i) => `<option value="${i}">${esc(it.titulo||it.name||'Item '+(i+1))}</option>`).join('');
    h += `<div class="live-sel-row">
      <div class="live-sel-lbl">${e.icon} ${e.label}</div>
      <select class="live-select" id="live-sel-${e.key}">${opts}</select>
    </div>`;
  });

  if (!etapas.length) {
    wrap.innerHTML = '<div class="fpmt">Salve itens no Arsenal para montar o script ao vivo.</div>';
    return;
  }

  h += `<button class="live-build-btn" onclick="buildLiveScript()">📋 Montar Script</button>`;
  h += `<div class="live-result" id="live-result">
    <div class="live-result-inner" id="live-result-inner"></div>
    <button class="live-copy-btn" onclick="copyLiveScript()">📋 Copiar script</button>
  </div>`;

  wrap.innerHTML = h;
  wrap._etapas = etapas;
}

function buildLiveScript() {
  const wrap = document.getElementById('live-wrap');
  const etapas = wrap._etapas;
  if (!etapas) return;
  const d = D(); if (!d) return;
  ensureFields(d);

  let partes = [];
  etapas.forEach(e => {
    const sel = document.getElementById('live-sel-' + e.key);
    if (!sel) return;
    const idx = parseInt(sel.value);
    const item = e.items[idx];
    if (!item) return;
    partes.push({ label: e.icon + ' ' + e.label.toUpperCase(), texto: item.texto || item.body || '' });
  });

  const resultEl = document.getElementById('live-result');
  const innerEl = document.getElementById('live-result-inner');
  innerEl.innerHTML = '';

  partes.forEach(parte => {
    const hd = document.createElement('div');
    hd.className = 'live-sec-hd';
    hd.textContent = parte.label;
    innerEl.appendChild(hd);
    const txt = document.createElement('div');
    txt.style.cssText = 'font-size:13px;line-height:1.9;color:var(--text);margin-bottom:12px;';
    txt.textContent = parte.texto;
    innerEl.appendChild(txt);
  });

  resultEl.classList.add('show');
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
window.buildLiveScript = buildLiveScript;

function copyLiveScript() {
  const innerEl = document.getElementById('live-result-inner');
  if (!innerEl) return;
  const parts = [];
  innerEl.querySelectorAll('.live-sec-hd').forEach(hd => {
    const next = hd.nextElementSibling;
    if (next) parts.push(hd.textContent + '\n' + next.textContent);
  });
  const fullText = parts.join('\n\n');
  navigator.clipboard.writeText(fullText).then(() => showToast('Script copiado!')).catch(() => showToast('Erro ao copiar'));
}
window.copyLiveScript = copyLiveScript;

// ── LIXEIRA ───────────────────────────────────────────────
let lixeira = [];
const LIXEIRA_KEY = 'prevenda_lixeira_cache';

function enviarParaLixeira(item) {
  item._lixeira_data = new Date().toLocaleString('pt-BR');
  lixeira.unshift(item);
  salvarLixeira();
}

function salvarLixeira() {
  saveLocal(LIXEIRA_KEY, { list: lixeira });
  if (window.syncShow) window.syncShow.syncing();
  import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(({ doc: fsDoc, setDoc: fsSetDoc }) => {
    fsSetDoc(fsDoc(db, 'prevenda_lixeira', 'lista'), { list: lixeira, updatedAt: Date.now() })
      .then(() => { if (window.syncShow) window.syncShow.synced('Lixeira'); })
      .catch(() => { if (window.syncShow) window.syncShow.offline(); });
  });
}

function carregarLixeira() {
  loadLocal(LIXEIRA_KEY).then(data => {
    lixeira = data ? (data.list || []) : [];
  });
}

function restaurarDaLixeira(index) {
  const item = lixeira.splice(index, 1)[0];
  if (!item) return;
  delete item._lixeira_data;
  salvarLixeira();
  saveProd(item);
  showToast('Produto restaurado!');
  renderLixeira();
}
window.restaurarDaLixeira = restaurarDaLixeira;

function excluirPermanentemente(index) {
  if (!confirm('Apagar permanentemente? Não pode ser desfeito.')) return;
  lixeira.splice(index, 1);
  salvarLixeira();
  showToast('Excluído permanentemente');
  renderLixeira();
}
window.excluirPermanentemente = excluirPermanentemente;

function renderLixeira() {
  const el = document.getElementById('lixeira-lista');
  if (!el) return;
  if (!lixeira.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--muted2);font-size:13px;">Lixeira vazia</div>';
    return;
  }
  el.innerHTML = lixeira.map((item, i) => `
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;">
      <div style="font-size:22px;">${item.emoji||'🎯'}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name||'Produto'}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${item._lixeira_data||''}</div>
      </div>
      <button onclick="restaurarDaLixeira(${i})" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;">Restaurar</button>
      <button onclick="excluirPermanentemente(${i})" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px;">🗑</button>
    </div>
  `).join('');
}
window.renderLixeira = renderLixeira;

document.getElementById('modal-new-prod').addEventListener('click', function(e) {
  if (e.target === this) closeModal('modal-new-prod');
});
document.getElementById('new-prod-name').addEventListener('keydown', e => {

syncPending(); // tenta subir pendentes ao abrir (caso tenha voltado online)

carregarLixeira();
