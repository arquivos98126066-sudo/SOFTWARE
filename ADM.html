<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>Administração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f5f8; --card:#fff; --tx:#0f172a; --tx2:#6b7280; --tx3:#9aa3b2; --bd:#e6e9ef; --bd-in:#e5e7eb;
  --chip:#f1f4f8; --seg:#eceff4; --main:#111; --red:#dc2626; --red-bd:#fbd5d5;
  --grad:linear-gradient(135deg,#15803d,#22c55e 55%,#4ade80);
  --f-title:'Barlow','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{min-height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}

.ic{width:20px;height:20px;display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* dinheiro: degradê verde, R$ menor e levantado */
.m{display:inline-block;font-family:var(--f-title);font-weight:700;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.m .rs{display:inline-block;font-size:.58em;position:relative;top:-.42em;margin-right:.18em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.m .sg{margin-right:.12em}
.m.neg,.m.neg .rs{background:none;color:var(--tx);-webkit-text-fill-color:var(--tx)}
.m.red,.m.red .rs{background:none;color:var(--red);-webkit-text-fill-color:var(--red)}
.m.big{font-size:44px;line-height:1.05}
.m.md{font-size:22px}
.m.sm{font-size:19px}

/* topo */
.hdr{position:sticky;top:0;z-index:100;padding:calc(12px + env(safe-area-inset-top)) 12px 6px;background:linear-gradient(var(--bg) 78%,rgba(243,245,248,0))}
.topbar{display:flex;align-items:center;gap:8px;height:58px;padding:0 6px 0 20px;background:#fff;border:1px solid var(--bd);border-radius:999px;max-width:520px;margin:0 auto}
.tb-title{flex:1;min-width:0;font-family:var(--f-title);font-weight:600;font-size:20px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--chip);color:#334155;font-weight:700;font-size:12.5px;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip.chip-red{background:#fef2f2;color:var(--red)}
.rbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx);flex-shrink:0;transition:background .15s}
.rbtn:active{background:var(--chip)}
.rbtn.line{background:#fff;border:1px solid var(--bd-in)}
.rbtn.red{color:var(--red);border-color:var(--red-bd)}

/* menu lateral solto */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:200}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:calc(12px + env(safe-area-inset-top));bottom:calc(12px + env(safe-area-inset-bottom));left:12px;width:min(300px,calc(100vw - 24px));
  background:#fff;border:1px solid var(--bd);border-radius:26px;z-index:201;display:flex;flex-direction:column;padding:22px 12px 16px;overflow-y:auto;
  transform:translateX(calc(-100% - 24px));transition:transform .26s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer-head{padding:0 10px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.drawer-logo{font-family:var(--f-title);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.drawer-item{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15.5px;color:var(--tx);text-align:left;transition:background .15s,color .15s}
.drawer-item .ic{color:var(--tx2)}
.drawer-item:active{background:var(--chip)}
.drawer-item.on{background:var(--main);color:#fff}
.drawer-item.on .ic{color:#fff}
.drawer-footer{margin-top:auto;padding:14px 10px 0;color:var(--tx2);font-size:13.5px;font-weight:500}

/* telas */
.pnl{display:none;padding:6px 12px calc(40px + env(safe-area-inset-bottom));flex-direction:column;gap:12px;max-width:520px;margin:0 auto;width:100%}
.pnl.on{display:flex}
.card{background:#fff;border:1px solid var(--bd);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.feat{background:linear-gradient(180deg,#fff,#f7f9fc);box-shadow:0 18px 40px -24px rgba(15,23,42,.3)}
.card>.chip{align-self:flex-start}
.line{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sep{border-top:1px solid var(--bd);padding-top:12px}
.title{font-family:var(--f-title);font-weight:600;font-size:18px;letter-spacing:-.01em}
.ic-circle{width:40px;height:40px;border-radius:50%;background:var(--chip);color:#475569;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic-circle .ic{width:19px;height:19px}
.empty{text-align:center;padding:36px 10px;color:var(--tx2);font-size:15px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;border:1px solid transparent;transition:opacity .15s,background .15s}
.btn:active{opacity:.78}
.btn .ic{width:18px;height:18px}
.btn-main{background:var(--main);color:#fff}
.btn-sec{background:#fff;color:var(--tx);border-color:var(--bd-in)}
.btn-del{background:#fff;color:var(--red);border-color:var(--red-bd)}
.btn-block{display:flex;width:100%}
.btn-sm{height:44px;padding:0 20px;font-size:14.5px}
.btn-row{display:flex;gap:8px}
.btn-pg{position:relative;height:34px;min-width:64px;padding:0 16px;font-size:13.5px;flex-shrink:0}
.btn-pg::after{content:'';position:absolute;inset:-6px -4px}
.btn-row .btn{flex:1;padding:0 12px}

/* campos */
.fld{position:relative;display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--bd-in);border-radius:999px;padding:0 20px 0 18px;cursor:text;transition:border-color .15s;min-width:0}
.fld>.ic{width:18px;height:18px;color:var(--tx3);margin-top:16px}
.fld:focus-within{border-color:#b9c0cc}
.fld input,.fld textarea,.fld select{display:block;flex:1 1 0;min-width:0;width:100%;height:50px;background:transparent;border:none;outline:none;font-size:16px;line-height:24px;padding:13px 0;color:var(--tx);-webkit-appearance:none;appearance:none}
.fld ::placeholder{color:var(--tx3)}
.fld.area{border-radius:24px}
.fld.area textarea{height:auto;min-height:150px;resize:none;line-height:1.6}
.fld.area.sm textarea{min-height:88px}
.fld input[type=date]{min-height:50px}
input[type=date]::-webkit-calendar-picker-indicator{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .fld{padding:0 12px 0 14px;gap:8px}
.qf{display:flex;gap:8px;align-items:center}
.qf .fld{flex:1}
#btnRegistrarIA,#btnCopiaIA,.btn-row>.btn{height:44px;font-size:14.5px}
#btnRegistrarLanc{height:44px;font-size:14.5px;width:auto;min-width:180px;margin:0 auto;padding:0 28px}
.qf .btn-main{height:44px;min-width:92px;padding:0 22px;font-size:14.5px;letter-spacing:.01em;flex-shrink:0}

/* valor em reais */
.money-field{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;min-width:200px;max-width:100%;height:60px;padding:0 28px;margin:0 auto;
  background:linear-gradient(180deg,#fff,#f7f9fc);border:1px solid var(--bd);border-radius:999px;box-shadow:0 16px 34px -22px rgba(15,23,42,.35);transition:border-color .15s}
.money-field:focus-within{border-color:#9bd9b0}
.money-field span{font-family:var(--f-title);font-weight:700;font-size:16px;line-height:1;position:relative;top:-5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.money-field input{flex:0 1 auto;field-sizing:content;width:auto;min-width:0;max-width:100%;height:52px;border:none;outline:none;text-align:center;font-family:var(--f-title);font-weight:700;font-size:30px;line-height:1;padding:0;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--tx);font-variant-numeric:lining-nums tabular-nums;-webkit-appearance:none;appearance:none}
.money-field input:placeholder-shown{min-width:3ch}

/* escolhas */
.mot-area{display:none}
.mot-area.open{display:block}
.seg{display:flex;gap:2px;padding:4px;background:var(--seg);border-radius:999px}
.seg button,.fbtn{flex:1;min-height:44px;padding:0 10px;border-radius:999px;font-weight:600;font-size:14.5px;color:#374151;transition:background .15s,color .15s;white-space:nowrap}
.seg button.on,.fbtn.on{background:var(--main);color:#fff}
.chip-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:999px;background:var(--chip);color:#334155;font-weight:700;font-size:14px}
.chip-btn .ic{width:16px;height:16px;stroke-width:2}
.chip-btn.on{background:var(--main);color:#fff}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:20px;background:var(--chip);color:#334155;font-size:14px;line-height:1.5;font-weight:500}
.note .ic{width:16px;height:16px;margin-top:3px;color:var(--tx2)}
.note b{font-weight:700}

/* distribuição */
.dist-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--bd)}
.dist-item:first-of-type{border-top:none;padding-top:4px}
.dist-item:last-child{padding-bottom:2px}
.dist-nome{font-family:var(--f-title);font-weight:600;font-size:16px}
.dist-pct{margin-left:2px}

/* histórico */
.hcat-card{background:#fff;border:1px solid var(--bd);border-radius:24px;overflow:hidden}
.hcat-head{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 16px;text-align:left}
.hcat-info{flex:1;min-width:0;display:flex;flex-direction:column}
.hcat-nome{font-family:var(--f-title);font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.hcat-sub{font-size:13px;color:var(--tx2)}
.hcat-chev{width:16px;height:16px;color:var(--tx3);transition:transform .2s}
.hcat-card:has(.hcat-body.open) .hcat-chev{transform:rotate(90deg)}
.hcat-body{display:none;border-top:1px solid var(--bd);padding:4px 16px 8px}
.hcat-body.open{display:block}
.hlanc{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}
.hlanc:last-child{border-bottom:none}
.hlanc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hlanc-left{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.hlanc-data{font-size:13.5px;color:var(--tx2)}
.mot{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:18px;background:var(--chip);font-size:13.5px;color:#475569;line-height:1.5}
.mot .ic{width:16px;height:16px;margin-top:2px;flex-shrink:0;color:var(--tx3)}
.mini-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;margin:-6px 0;border-radius:999px;color:var(--tx2);font-weight:600;font-size:13.5px}
.mini-btn .ic{width:15px;height:15px;stroke-width:2}
.mini-btn:active{background:var(--chip)}

/* relatório */
.rel-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd);font-size:15px}
.rel-row:first-of-type{border-top:none}
.rel-row>span:first-child{overflow:hidden;text-overflow:ellipsis}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ncard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:22px;padding:14px 16px;min-width:0}
.ncard.full{grid-column:1/-1;background:linear-gradient(180deg,#fff,#f7f9fc);box-shadow:0 18px 40px -24px rgba(15,23,42,.3)}

/* janelas que sobem de baixo */
.moverlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.moverlay.open{display:flex}
.moverlay.top{z-index:320}
.mbox{position:relative;width:100%;max-width:520px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:26px;padding:26px 16px 16px;display:flex;flex-direction:column;gap:12px;animation:upAnim .26s ease}
.mbox::before{content:'';display:block;flex-shrink:0;width:36px;height:4px;border-radius:999px;background:#d5dae3;margin:-14px auto 0}
@keyframes upAnim{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mbox-t{font-family:var(--f-title);font-weight:600;font-size:19px;text-align:center;letter-spacing:-.01em}
.mconf-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px 20px;border:1px solid var(--bd);border-radius:22px;background:linear-gradient(#fff,#f7f9fc);box-shadow:0 14px 30px -18px rgba(15,23,42,.18)}
.mconf-card .m{font-size:38px;line-height:1.05}
#mConfirm .mbox-t{font-size:17px;font-weight:500;color:var(--tx2)}
#mConfirm .btn-row{margin-top:4px}
.mbox-s{font-size:14.5px;color:var(--tx2);text-align:center;white-space:pre-line;margin-top:-6px}

/* aviso e balão */
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-16px);z-index:999;height:44px;padding:0 22px;display:flex;align-items:center;
  background:var(--tx);color:#fff;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.erro{background:var(--red)}
#tip{position:fixed;z-index:1000;pointer-events:none;opacity:0;transition:opacity .15s;background:var(--tx);color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}
#tip.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" aria-hidden="true"></div>
<div class="drawer-overlay" id="drawerOverlay" onclick="fecharMenu()"></div>

<aside class="drawer" id="drawer" aria-label="Menu">
  <div class="drawer-head">
    <div class="drawer-logo">Administração</div>

<script type="module">
import { db } from "https://arquivos98126066-sudo.github.io/SOFTWARE/firebase-sync.js";
import { doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== INDEXEDDB — salva e carrega localmente =====
var _idb = null;
function idbOpen() {
  return new Promise(function(resolve) {
    if (_idb) { resolve(_idb); return; }
    var req = indexedDB.open('adm_backup', 1);
    req.onupgradeneeded = function(e) { e.target.result.createObjectStore('kv'); };
    req.onsuccess = function(e) { _idb = e.target.result; resolve(_idb); };
    req.onerror = function() { resolve(null); };
  });
}
function idbSet(key, val) {
  idbOpen().then(function(db) {
    if (!db) { localStorage.setItem(key, JSON.stringify(val)); return; }
    var tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(JSON.stringify(val), key);
  });
}
function idbGet(key) {
  return idbOpen().then(function(db) {
    if (!db) {
      try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
    }
    return new Promise(function(resolve) {
      var tx = db.transaction('kv', 'readonly');
      var req = tx.objectStore('kv').get(key);
      req.onsuccess = function() {
        try { resolve(req.result ? JSON.parse(req.result) : null); } catch(e) { resolve(null); }
      };
      req.onerror = function() { resolve(null); };
    });
  });
}

// ===== MERGE — complementa por ID, nunca substitui =====
function mergeItens(nuvem, local) {
  var ids = new Set((nuvem || []).map(function(l) { return String(l.id); }));
  var resultado = (nuvem || []).slice();
  (local || []).forEach(function(l) {
    if (!ids.has(String(l.id))) resultado.push(l);
  });
  resultado.sort(function(a, b) { return (a.id || 0) - (b.id || 0); });
  return resultado;
}

// ===== CACHE LOCAL =====
var _cache = {
  lancamentos: [],
  adm: {
    retiradas: { despesas: 0, negocio: 0, invest: 0, diversao: 0 },
    tapeteRetirada: 0,
    outrasRetirada: 0,
    outrasNome: 'Outras'
  }
};

// ===== FIRESTORE REFS =====
var docLanc = doc(db, 'adm', 'lancamentos');
var docConfig = doc(db, 'adm', 'config');

// ===== SALVAR =====
// Salva PRIMEIRO no IndexedDB, depois tenta a nuvem
async function salvar() {
  // Salva local imediatamente — independente da internet
  idbSet('lanc', { itens: _cache.lancamentos });
  idbSet('config', _cache.adm);
  if (window.syncShow) window.syncShow.syncing();
  try {
    await setDoc(docLanc, { itens: _cache.lancamentos, _t: Date.now() });
    await setDoc(docConfig, Object.assign({}, _cache.adm, { _t: Date.now() }));
    if (window.syncShow) window.syncShow.synced('ADM');
  } catch (e) {
    console.error('Erro ao salvar:', e);
    if (window.syncShow) window.syncShow.offline();
  }
}

function gd() { return _cache; }

// ===== GARANTIR ESTRUTURA =====
function garantirEstrutura() {
  if (!_cache.lancamentos) _cache.lancamentos = [];
  if (!_cache.adm) _cache.adm = {};
  if (!_cache.adm.retiradas) _cache.adm.retiradas = { despesas: 0, negocio: 0, invest: 0, diversao: 0 };
  if (!_cache.adm.tapeteRetirada) _cache.adm.tapeteRetirada = 0;
  if (!_cache.adm.outrasRetirada) _cache.adm.outrasRetirada = 0;
  if (!_cache.adm.outrasNome || _cache.adm.outrasNome === 'Outras Entradas') _cache.adm.outrasNome = 'Outras';
}

// ===== INIT — única função responsável por carregar e escutar =====
// Sem carregarDados separado. Tudo passa por aqui.
async function iniciarListeners() {

  // 1. Carrega do IndexedDB primeiro — aparece na tela imediatamente
  var localLanc = await idbGet('lanc');
  var localConfig = await idbGet('config');
  if (localLanc && localLanc.itens) {
    _cache.lancamentos = localLanc.itens;
    garantirEstrutura();
    renderHistorico(); renderRelatorio(); atualizarHeader();
  }
  if (localConfig) {
    _cache.adm = localConfig;
    garantirEstrutura();
    renderADM();
  }

  // 2. Escuta a nuvem — quando chegar, faz merge com o local
  onSnapshot(docLanc, async function(snap) {
    if (!snap.exists()) {
      // Nuvem vazia mas temos local — sobe o local
      if (_cache.lancamentos.length > 0) {
        try { await setDoc(docLanc, { itens: _cache.lancamentos, _t: Date.now() }); } catch(_) {}
      }
      return;
    }
    var nuvemItens = snap.data().itens || [];
    // Merge: junta nuvem + local, sem perder nada
    var merged = mergeItens(nuvemItens, _cache.lancamentos);
    _cache.lancamentos = merged;
    // Salva o merge no IndexedDB
    idbSet('lanc', { itens: merged });
    // Se o merge adicionou itens que não estavam na nuvem, sobe
    if (merged.length > nuvemItens.length) {
      try { await setDoc(docLanc, { itens: merged, _t: Date.now() }); } catch(_) {}
    }
    garantirEstrutura();
    renderHistorico(); renderRelatorio(); atualizarHeader();
  }, function(e) { console.error('Listener lancamentos:', e); });

  onSnapshot(docConfig, function(snap) {
    if (snap.exists()) {
      _cache.adm = snap.data();
      idbSet('config', _cache.adm);
      garantirEstrutura();
      renderADM();
    }
  }, function(e) { console.error('Listener config:', e); });
}

// ===== UTIL =====
function ic(n, c) { return '<svg class="ic' + (c ? ' ' + c : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
var _toastT = null;
function toast(msg, tipo) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('erro', tipo === 'erro');
  t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(function() { t.classList.remove('show'); }, 2600);
}
function fmtVal(n) { return 'R$ ' + Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
// dinheiro em degradê verde (R$ menor e levantado); valores negativos ou saídas ficam em tom escuro
function money(n, sg, neg, cls) {
  n = Number(n || 0);
  // saída/retirada (sinal '−') fica em vermelho, sem mostrar sinal; entrada ('+') fica verde, sem sinal
  var red = sg === '\u2212' || (!sg && n < 0);
  var s = '';
  var isNeg = !!neg && !red;
  var abs = Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return '<span class="m' + (red ? ' red' : isNeg ? ' neg' : '') + (cls ? ' ' + cls : '') + '">' + (s ? '<span class="sg">' + s + '</span>' : '') + '<span class="rs">R$</span>' + abs + '</span>';
}
// confirmação em janela solta (no lugar do confirm nativo)
var _confirmRes = null;
function confirmar(titulo, sub, okTxt, perigo, valor) {
  return new Promise(function(resolve) {
    _confirmRes = resolve;
    document.getElementById('mConfTitulo').textContent = titulo;
    var s = document.getElementById('mConfSub');
    var card = document.getElementById('mConfCard');
    if (valor != null) {
      card.style.display = 'flex';
      document.getElementById('mConfChip').textContent = sub || '';
      document.getElementById('mConfChip').style.display = sub ? 'inline-flex' : 'none';
      document.getElementById('mConfValor').innerHTML = money(valor);
      s.style.display = 'none';
    } else {
      card.style.display = 'none';
      s.textContent = sub || '';
      s.style.display = sub ? 'block' : 'none';
    }
    var ok = document.getElementById('mConfOk');
    ok.textContent = okTxt || 'Confirma';
    ok.className = 'btn ' + (perigo ? 'btn-del' : 'btn-main');
    abrirModal('mConfirm');
  });
}
window._fimConf = function(v) {
  fecharModal('mConfirm');
  var r = _confirmRes;
  _confirmRes = null;
  if (r) r(v);
};
function fmtNum(s) { return parseFloat(String(s || 0).replace(/\./g, '').replace(',', '.')) || 0; }
function hoje() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtBR(iso) { if (!iso) return ''; var p = iso.split('-'); var ms = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return parseInt(p[2]) + ' de ' + ms[parseInt(p[1]) - 1] + ' de ' + p[0]; }
function fmtDataCurta(iso) { if (!iso) return ''; var p = iso.split('-'); var ms = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return parseInt(p[2]) + '/' + ms[parseInt(p[1]) - 1]; }

// ===== CÁLCULOS =====
function calcSaldo() {
  var d = gd(); var total = 0;
  d.lancamentos.forEach(function(l) {
    if (l.tipo === 'entrada') total += l.valor;
    else if (l.tipo === 'saida') total -= l.valor;
  });
  return total;
}
function calcEntradas() {
  var d = gd(); var t = 0;
  d.lancamentos.forEach(function(l) { if (l.tipo === 'entrada' && !l.quitacao) t += l.valor; });
  return t;
}
function calcTapeteDisp() {
  var d = gd(); var ent = 0, gas = 0;
  d.lancamentos.forEach(function(l) {
    if (l.tipo === 'tapete_entrada') ent += l.valor;
    else if (l.tipo === 'tapete_gasto') gas += l.valor;
  });
  return ent - gas - (d.adm.tapeteRetirada || 0);
}
function calcTapeteGasto() {
  var d = gd(); var t = 0;
  d.lancamentos.forEach(function(l) { if (l.tipo === 'tapete_gasto') t += l.valor; });
  return t;
}
function calcDist() {
  var base = calcEntradas();
  return { despesas: base * 0.50, negocio: base * 0.30, invest: base * 0.10, diversao: base * 0.10, base: base };
}
function calcOutrasEntradas() {
  var d = gd(); var t = 0;
  d.lancamentos.forEach(function(l) { if (l.tipo === 'outras_entrada') t += l.valor; });
  return t;
}
function calcOutrasRetiradas() { return gd().adm.outrasRetirada || 0; }
function calcOutrasDisp() { return calcOutrasEntradas() - calcOutrasRetiradas(); }
function calcDividas() {
  var ret = gd().adm.retiradas;
  return { despesas: ret.despesas || 0, negocio: ret.negocio || 0, invest: ret.invest || 0, diversao: ret.diversao || 0, tapete: 0 };
}

  despesas: ['mercado','aliment','comida','feira','supermercado','padaria','açougue','farmácia','remédio','saúde','aluguel','energia','água','luz','gás','internet','telefone','ônibus','transporte','passagem','combustível','gasolina','roupa','calçado','escola','mensalidade','conta','boleto','taxa','imposto','hygiene','higiene','limpeza','pet'],
  negocio: ['negócio','negocio','trabalho','material','ferramenta','equipamento','produto','estoque','fornecedor','serviço','servico','marketing','propaganda','curso','treinamento','capacitação'],
  invest: ['investimento','poupança','reserva','aplicação','cdb','tesouro','ação','fundo'],
  diversao: ['lanche','restaurante','cinema','show','viagem','lazer','entretenimento','festa','bar','pizza','hamburguer','hamburger','sorvete','açaí','açai','jogo','streaming','netflix','spotify']
};
function inferirCatDist(cat) {
  var c = cat.toLowerCase();
  for (var k in _catMap) { var arr = _catMap[k]; for (var i = 0; i < arr.length; i++) { if (c.indexOf(arr[i]) >= 0) return k; } }
  return 'despesas';
}

// ===== RENDER ADM =====
var _nomesCat = { despesas: 'Despesas', negocio: 'Negócio', invest: 'Investimento', diversao: 'Diversão', tapete: 'Tapete' };
var _icCat = { despesas: 'home', negocio: 'briefcase', invest: 'trend', diversao: 'smile', tapete: 'rug' };
function renderADM() {
  var saldo = calcSaldo();
  var tapDisp = calcTapeteDisp();
  var tapGasto = calcTapeteGasto();
  var outrasDisp = calcOutrasDisp();
  var dist = calcDist();
  var ret = gd().adm.retiradas;
  var divs = calcDividas();
  var divTotal = divs.despesas + divs.negocio + divs.invest + divs.diversao;

  document.getElementById('admSaldo').innerHTML = money(saldo);
  document.getElementById('admDivTotal').innerHTML = money(divTotal, '', true);
  document.getElementById('admTapete').innerHTML = money(tapDisp);
  var _tapTip = 'Gasto ' + fmtVal(tapGasto);
  document.getElementById('tapeteHead').setAttribute('data-tip', _tapTip);

  document.getElementById('admOutras').innerHTML = money(outrasDisp);
  var tapDiv = document.getElementById('tapeteDivida');
  if (gd().adm.tapeteRetirada > 0) {
    tapDiv.innerHTML = '<span class="chip chip-red">Fora ' + fmtVal(gd().adm.tapeteRetirada) + '</span>';
  } else { tapDiv.innerHTML = ''; }
  var nomeAtual = gd().adm.outrasNome || 'Outras';
  document.getElementById('outrasNomeDisplay').textContent = nomeAtual;


  var cats = [
    { key: 'despesas', vId: 'vDespesa', dId: 'dDespesa', dist: dist.despesas, ret: ret.despesas || 0, div: divs.despesas },
    { key: 'negocio', vId: 'vNegocio', dId: 'dNegocio', dist: dist.negocio, ret: ret.negocio || 0, div: divs.negocio },
    { key: 'invest', vId: 'vInvest', dId: 'dInvest', dist: dist.invest, ret: ret.invest || 0, div: divs.invest },
    { key: 'diversao', vId: 'vDiversao', dId: 'dDiversao', dist: dist.diversao, ret: ret.diversao || 0, div: divs.diversao }
  ];
  cats.forEach(function(c) {
    var disp = c.dist - (c.ret || 0);
    document.getElementById(c.vId).innerHTML = money(disp);
    var dEl = document.getElementById(c.dId);
    if (c.div > 0) { dEl.style.display = 'inline-flex'; dEl.innerHTML = 'Dívida ' + fmtVal(c.div); }
    else { dEl.style.display = 'none'; }
  });

  var temDiv = divTotal > 0;
  document.getElementById('cardPagarDiv').style.display = temDiv ? 'flex' : 'none';
  if (temDiv) {
    var html = '';
    for (var k in divs) {
      if (divs[k] > 0) {
        html += '<div class="line" style="padding:10px 0;border-top:1px solid var(--bd);">';
        html += '<span class="ic-circle">' + ic(_icCat[k]) + '</span>';
        html += '<span class="title grow">' + _nomesCat[k] + '</span>';
        html += money(divs[k], '', true, 'sm');
        html += '<button type="button" class="btn btn-main btn-pg" onclick="window._abrirPagarDiv(\'' + k + '\',' + divs[k] + ')">Paga</button>';
        html += '</div>';
      }
    }
    document.getElementById('listaPagarDiv').innerHTML = html;
  }
  atualizarHeader();
}

document.getElementById('btnCopiarAbrir').onclick = function() {

function _copiarFallback(txt) {

  try { document.execCommand('copy'); document.getElementById('iaCampo').value = ''; toast('Copiado! Abra o Claude manualmente.'); }

  document.body.removeChild(ta);

}

document.getElementById('btnRegistrarIA').onclick = async function() {
  var txt = document.getElementById('iaCampo').value.trim();
  var data = document.getElementById('iaData').value || hoje();
  if (!txt) { toast('Campo vazio', 'aviso'); return; }
  var json = null;
  var match = txt.match(/\{[\s\S]*\}/);
  if (match) { try { json = JSON.parse(match[0]); } catch (e) { json = null; } }
  if (!json) { toast('JSON inválido. Copie a resposta do Claude aqui.', 'erro'); return; }
  var data_uso = json.data || data;
  var count = 0;
  if (json.saidas && json.saidas.length) {
    json.saidas.forEach(function(s) {
      var catDist = s.catDist || inferirCatDist(s.categoria || '');
      var val = parseFloat(s.valor) || 0;
      _cache.lancamentos.push({ id: Date.now() + Math.random(), tipo: 'saida', categoria: s.categoria || 'Gasto', valor: val, data: data_uso, motivacao: s.motivacao || '', descricao: s.descricao || '', catDist: catDist });
      count++;
    });
  }
  if (json.tapete_entradas && json.tapete_entradas.length) {
    json.tapete_entradas.forEach(function(t) {
      var val = parseFloat(t.valor) || 0;
      var str = String(t.valor || '');
      var decimais = str.indexOf('.') >= 0 ? str.split('.')[1].length : 0;
      if (val < 1 || decimais > 2) return;
      _cache.lancamentos.push({ id: Date.now() + Math.random(), tipo: 'tapete_entrada', categoria: 'Tapete', valor: val, data: data_uso, motivacao: '' });
      count++;
    });
  }
  if (json.tapete_gastos && json.tapete_gastos.length) {
    json.tapete_gastos.forEach(function(t) {
      _cache.lancamentos.push({ id: Date.now() + Math.random(), tipo: 'tapete_gasto', categoria: t.categoria || 'Gasto Tapete', valor: parseFloat(t.valor) || 0, data: data_uso, motivacao: t.motivacao || '', descricao: t.descricao || '' });

  setTimeout(function() { fb.style.display = 'none'; }, 4000);

  toast('' + count + ' lançamentos registrados!');
};

// ===== HISTÓRICO =====
var _filtroHist = 'todos';
window.filtroHist = function(f) {
  _filtroHist = f;
  ['fhTodos','fhHoje','fhSemana','fhMes'].forEach(function(id) { document.getElementById(id).classList.remove('on'); });
  var mapa = { todos: 'fhTodos', hoje: 'fhHoje', semana: 'fhSemana', mes: 'fhMes' };
  if (mapa[f]) document.getElementById(mapa[f]).classList.add('on');
  renderHistorico();
};

function _filtrarLancs(lancs) {
  var ini = document.getElementById('hInicio').value;
  var fim = document.getElementById('hFim').value;
  var hj = hoje();
  return lancs.filter(function(l) {
    var d = l.data;
    if (_filtroHist === 'hoje') return d === hj;
    if (_filtroHist === 'semana') { var dt = new Date(hj); dt.setDate(dt.getDate() - 7); return d >= dt.toISOString().slice(0, 10) && d <= hj; }
    if (_filtroHist === 'mes') return d.slice(0, 7) === hj.slice(0, 7);
    if (_filtroHist === 'custom' && ini && fim) return d >= ini && d <= fim;
    return true;
  });
}

var _porqueEditId = null;
function _isEnt(t) { return t === 'entrada' || t === 'tapete_entrada' || t === 'outras_entrada'; }
function renderHistorico() {
  var d = gd();
  var lancs = _filtrarLancs(d.lancamentos);
  var grupos = {};
  lancs.forEach(function(l) {
    var k = l.categoria;
    if (!grupos[k]) grupos[k] = { cat: k, tipo: l.tipo, itens: [], total: 0 };
    grupos[k].itens.push(l);
    if (_isEnt(l.tipo)) grupos[k].total += l.valor;
    else grupos[k].total -= l.valor;
  });
  var keys = Object.keys(grupos).sort(function(a, b) { return grupos[b].itens[0].data.localeCompare(grupos[a].itens[0].data); });
  var html = '';
  keys.forEach(function(k) {
    var g = grupos[k];
    var isPos = g.total >= 0;
    var isTapete = g.tipo === 'tapete_entrada' || g.tipo === 'tapete_gasto';
    var isOutras = g.tipo === 'outras_entrada' || g.tipo === 'outras_retirada';
    var icn = isTapete ? 'rug' : isOutras ? 'bookmark' : (isPos ? 'tag' : 'cart');
    html += '<div class="hcat-card">';
    html += '<button type="button" class="hcat-head" onclick="toggleCat(\'hcat_' + _esc(k) + '\')">';
    html += '<span class="ic-circle">' + ic(icn) + '</span>';
    html += '<span class="hcat-info"><span class="hcat-nome">' + _esc2(String(k).split(' \u2014 ')[0].replace(/^Retirada (?=\S)/, '')) + '</span></span>';
    html += money(Math.abs(g.total), isPos ? '+' : '−', !isPos, 'sm');
    html += ic('chevron-right', 'hcat-chev');
    html += '</button>';
    html += '<div class="hcat-body" id="hcat_' + _esc(k) + '">';
    g.itens.forEach(function(l) {
      var ent = _isEnt(l.tipo);
      html += '<div class="hlanc">';
      html += '<div class="hlanc-top">';
      html += '<div class="hlanc-left"><span class="chip">' + (l.tipo === 'entrada' ? 'Entrada' : l.tipo === 'tapete_entrada' ? 'Tapete' : l.tipo === 'outras_entrada' ? 'Outras ent.' : 'Saída') + '</span><span class="hlanc-data">' + _esc2(fmtDataCurta(l.data)) + '</span></div>';
      html += money(l.valor, ent ? '+' : '−', !ent, 'sm');
      html += '</div>';
      if (l.descricao && l.descricao.trim()) { html += '<div class="mot">' + ic('text') + '<span>' + _esc2(l.descricao) + '</span></div>'; }
      var _autoOutras = l.tipo === 'outras_retirada' && /^Retirada de /.test(l.motivacao || '');
      if (_autoOutras) { }
      else if (l.motivacao && l.motivacao.trim()) { html += '<div class="mot">' + ic('note') + '<span>' + _esc2(l.motivacao) + '</span></div>'; }
      else { html += '<button type="button" class="mini-btn" onclick="abrirPorque(\'' + l.id + '\')">' + ic('plus') + 'Por quê</button>'; }
      html += '</div>';
    });
    html += '</div></div>';
  });
  if (!keys.length) html = '<div class="empty">Nenhum lançamento</div>';
  document.getElementById('listaHistorico').innerHTML = html;
  var entTotal = 0, saiTotal = 0;
  lancs.forEach(function(l) {
    if (l.tipo === 'entrada' || l.tipo === 'entrada_cat' || l.tipo === 'tapete_entrada') entTotal += l.valor;
    else if (l.tipo === 'saida' || l.tipo === 'tapete_gasto') saiTotal += l.valor;
  });
  var saldoPer = entTotal - saiTotal;
  document.getElementById('resumoHist').innerHTML =
    '<span class="chip" style="align-self:flex-start;">Período</span>' +
    '<div><div class="rel-row"><span>Entradas</span>' + money(entTotal, '+', false, 'sm') + '</div>' +
    '<div class="rel-row"><span>Saídas</span>' + money(saiTotal, '−', true, 'sm') + '</div>' +
    '<div class="rel-row"><span style="font-weight:700;">Saldo</span>' + money(saldoPer, '', false, 'md') + '</div></div>';
}

window.toggleCat = function(id) { var el = document.getElementById(id); if (el) el.classList.toggle('open'); };
function _esc(s) { return String(s).replace(/[^a-zA-Z0-9]/g, '_'); }
function _esc2(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ===== POR QUÊ =====
window.abrirPorque = function(id) { _porqueEditId = id; document.getElementById('porqueTexto').value = ''; abrirModal('mPorque'); };
document.getElementById('btnSalvarMotivo').onclick = async function() {
  var txt = document.getElementById('porqueTexto').value.trim();
  if (!txt) { toast('Digite o motivo', 'aviso'); return; }
  var l = _cache.lancamentos.find(function(x) { return String(x.id) === String(_porqueEditId); });
  if (l) { l.motivacao = txt; await salvar(); renderHistorico(); toast('Salvo!'); }
  fecharModal('mPorque');
};

// ===== RELATÓRIO =====
var _filtroRel = 'mes';
window.filtroRel = function(f) {
  _filtroRel = f;
  ['frMes','frSemana','frTodos'].forEach(function(id) { document.getElementById(id).classList.remove('on'); });
  var mapa = { mes: 'frMes', semana: 'frSemana', todos: 'frTodos' };
  if (mapa[f]) document.getElementById(mapa[f]).classList.add('on');
  renderRelatorio();
};

function _filtrarRel(lancs) {
  var ini = document.getElementById('rInicio').value;
  var fim = document.getElementById('rFim').value;
  var hj = hoje();
  return lancs.filter(function(l) {
    var d = l.data;
    if (_filtroRel === 'mes') return d.slice(0, 7) === hj.slice(0, 7);
    if (_filtroRel === 'semana') { var dt = new Date(hj); dt.setDate(dt.getDate() - 7); return d >= dt.toISOString().slice(0, 10) && d <= hj; }
    if (_filtroRel === 'custom' && ini && fim) return d >= ini && d <= fim;
    return true;
  });
}

function renderRelatorio() {
  var d = gd();
  var lancs = _filtrarRel(d.lancamentos);
  var entTotal = 0, saiTotal = 0;
  var catEnt = {}, catSai = {};
  lancs.forEach(function(l) {
    if (l.tipo === 'entrada' || l.tipo === 'entrada_cat') { entTotal += l.valor; if (!catEnt[l.categoria]) catEnt[l.categoria] = 0; catEnt[l.categoria] += l.valor; }
    else if (l.tipo === 'tapete_entrada') { entTotal += l.valor; if (!catEnt['Tapete']) catEnt['Tapete'] = 0; catEnt['Tapete'] += l.valor; }
    else if (l.tipo === 'saida') { saiTotal += l.valor; if (!catSai[l.categoria]) catSai[l.categoria] = 0; catSai[l.categoria] += l.valor; }
    else if (l.tipo === 'tapete_gasto') { saiTotal += l.valor; if (!catSai[l.categoria]) catSai[l.categoria] = 0; catSai[l.categoria] += l.valor; }
  });
  var saldoPer = entTotal - saiTotal;
  var dist = calcDist();
  var ret = d.adm.retiradas;
  var html = '';
  html += '<div class="ngrid">';
  html += '<div class="ncard"><span class="chip">Entradas</span>' + money(entTotal, '', false, 'md') + '</div>';
  html += '<div class="ncard"><span class="chip">Saídas</span>' + money(saiTotal, '\u2212', true, 'md') + '</div>';
  html += '<div class="ncard full"><span class="chip">Saldo</span>' + money(saldoPer, '', false, 'big') + '</div>';
  html += '</div>';
  var entKeys = Object.keys(catEnt).sort(function(a, b) { return catEnt[b] - catEnt[a]; });
  if (entKeys.length) {
    html += '<div class="card"><span class="chip">Entradas</span><div>';
    entKeys.forEach(function(k) { html += '<div class="rel-row"><span>' + _esc2(k) + '</span>' + money(catEnt[k], '+', false, 'sm') + '</div>'; });
    html += '</div></div>';
  }
  var saiKeys = Object.keys(catSai).sort(function(a, b) { return catSai[b] - catSai[a]; });
  if (saiKeys.length) {
    html += '<div class="card"><span class="chip">Saídas</span><div>';
    saiKeys.forEach(function(k) { html += '<div class="rel-row"><span>' + _esc2(k) + '</span>' + money(catSai[k], '−', true, 'sm') + '</div>'; });
    html += '</div></div>';
  }
  html += '<div class="card"><span class="chip">Distribuição</span><div>';
  var nomes = { despesas: 'Despesas 50%', negocio: 'Negócio 30%', invest: 'Investimento 10%', diversao: 'Diversão 10%' };
  for (var k in nomes) {
    var disp = dist[k] - (ret[k] || 0);
    html += '<div class="rel-row"><span>' + nomes[k] + '</span>' + money(disp, '', false, 'sm') + '</div>';
  }
  html += '</div></div>';
  document.getElementById('relConteudo').innerHTML = html;
}

// ===== BACKUP / RESET =====
document.getElementById('btnBackup').onclick = function() {
  var json = JSON.stringify(gd(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(function() { toast('Backup copiado!'); }).catch(function() { _copiarFallback(json); });
  } else { _copiarFallback(json); }
};
document.getElementById('btnImportar').onclick = function() {
  var area = document.getElementById('importArea');
  area.style.display = area.style.display === 'none' ? 'flex' : 'none';
};
document.getElementById('btnImportarDados').onclick = async function() {
  var txt = document.getElementById('importTexto').value.trim();
  try {
    var d = JSON.parse(txt);
    if (!d.lancamentos) throw new Error('inválido');
    if (!(await confirmar('Substituir todos os dados pelo backup?', '', 'Substitui'))) return;
    _cache = d;
    await salvar();
    renderADM(); renderHistorico(); renderRelatorio(); atualizarHeader();
    document.getElementById('importArea').style.display = 'none';
    toast('Dados importados!');
  } catch (e) { toast('JSON inválido', 'erro'); }
};
document.getElementById('btnReset').onclick = async function() {
  if (!(await confirmar('Apagar todos os dados?', 'Isso não pode ser desfeito.', 'Apaga', true))) return;
  _cache = { lancamentos: [], adm: { retiradas: { despesas: 0, negocio: 0, invest: 0, diversao: 0 }, tapeteRetirada: 0, outrasRetirada: 0, outrasNome: 'Outras' } };
  await salvar();
  renderADM(); renderHistorico(); renderRelatorio(); atualizarHeader();
  toast('Dados apagados');
};

// ===== HEADER =====
function atualizarHeader() {
  var s = calcSaldo();
}

// ===== MODAIS =====
function abrirModal(id) { document.getElementById(id).classList.add('open'); }
function fecharModal(id) { document.getElementById(id).classList.remove('open'); }
window.fecharModal = fecharModal;

// ===== NAV =====
var abaNomes = ['Registra', 'ADM', 'Histórico', 'Relatório'];
window.irPara = function(idx) {
  for (var i = 0; i < 4; i++) {
    document.getElementById('p' + i).classList.toggle('on', i === idx);
    document.getElementById('di' + i).classList.toggle('on', i === idx);
  }
  document.getElementById('hdrTitle').textContent = abaNomes[idx];
  if (idx === 1) renderADM();
  if (idx === 2) renderHistorico();
  if (idx === 3) renderRelatorio();

};
window.abrirMenu = function() { document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('open'); };
window.fecharMenu = function() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('open'); };

async function init() {
  document.getElementById('iaData').value = hoje();
  document.getElementById('lData').value = hoje();

init();

// ECOSISTEMA: botao fisico voltar -> index.html (sem logout)
(function(){
  history.replaceState({ _eco: true, dest: "index.html" }, "");
  window.addEventListener("popstate", function(e){
    if (e.state && e.state._eco) {
      window.location.replace("index.html");
    } else {
      history.replaceState({ _eco: true, dest: "index.html" }, "");
    }
  });
})();
</script>
<script>
/* balão de informação: aparece só ao segurar o elemento */
(function() {
  var tip = document.getElementById('tip');
  var timer = null, hideTimer = null, suppress = false;
  function show(el) {
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('show');
    var r = el.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), window.innerWidth - w - 12);
    var y = r.top - h - 10;
    if (y < 12) y = r.bottom + 10;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
    suppress = true;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, 1600);
  }
  function hide() { tip.classList.remove('show'); setTimeout(function() { suppress = false; }, 350); }
  function start(e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    clearTimeout(timer);
    timer = setTimeout(function() { show(el); }, 450);
  }
  function cancel() { clearTimeout(timer); }
  document.addEventListener('touchstart', start, { passive: true });
  document.addEventListener('touchmove', cancel, { passive: true });
  document.addEventListener('touchend', cancel, { passive: true });
  document.addEventListener('touchcancel', cancel, { passive: true });
  document.addEventListener('mousedown', start);
  document.addEventListener('mouseup', cancel);
  document.addEventListener('click', function(e) {
    if (suppress && e.target.closest && e.target.closest('[data-tip]')) { e.stopPropagation(); e.preventDefault(); suppress = false; }
  }, true);
})();
</script>
