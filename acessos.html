<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Acessos</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#0f172a;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:460px;margin:0 auto;padding:22px 20px 80px}
  .pe{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:10px 0;position:sticky;top:0;background:#fff;z-index:4}
  .quem{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
  .quem b{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{width:40px;height:40px;border-radius:50%;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
  .av.off{background:#94a3b8}
  .ic{width:38px;height:38px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;border:0;flex:none;cursor:pointer;padding:0}
  .ic.novo{background:#fff;border:1.5px dashed #cbd5e1}
  .ac{background:#fff;border:1px solid #e9ecf2;border-radius:18px;margin-bottom:10px;overflow:hidden}
  .ah{display:flex;align-items:center;gap:12px;padding:14px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
  .ah.um{cursor:default}
  .ah b{flex:1;font-size:15px;font-weight:600}
  .ib2{width:34px;height:34px;border-radius:11px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none}
  .bd{font-size:12px;font-weight:700;color:#475569;background:#f1f5f9;border-radius:99px;min-width:42px;text-align:center;padding:5px 0}
  .ah .sv{transition:transform .2s}.ac.abre .sv{transform:rotate(180deg)}
  .cps{display:none;flex-direction:column;gap:6px;padding:0 12px 12px}.ac.abre .cps{display:flex}
  .cp{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px 0 10px;border-radius:15px;border:1px solid #e9ecf2;background:#fff;font:inherit;font-size:14px;font-weight:600;color:#0f172a;cursor:pointer;text-align:left;position:relative;overflow:hidden}
  .cp .pi{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .cp .pn{flex:1}
  .cp.on{background:#e8efff;border-color:#e8efff}
  .cp.on:before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#2563eb}
  .cp.on .pi{background:#0f172a}
  .trio{display:flex;gap:12px;justify-content:center;margin-top:22px}
  .tq{width:60px;height:60px;border-radius:20px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;border:0;padding:0;cursor:pointer}
  .tq.on{background:#0f172a;box-shadow:0 8px 18px rgba(15,23,42,.22)}.tq.bloq{background:#fee2e2}
  .f .ok{width:38px;height:38px;border-radius:12px;background:#0f172a;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin-left:auto;cursor:pointer;flex:none}
  .branco{position:fixed;inset:0;background:#fff;z-index:8;display:none;overflow:auto;padding:28px 20px}.branco.abre{display:block}
  .pc{display:flex;align-items:center;gap:14px;height:68px;padding:0 14px;width:100%;background:#fff;border:0;border-radius:22px;box-shadow:0 6px 20px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.06);margin-bottom:14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
  .pc b{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc .av{width:40px;height:40px}
  .fundo{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .fundo.abre{display:flex}
  .folha{background:#fff;width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:22px 20px 26px}
  .folha h2{font-size:17px;margin:0 0 14px;font-weight:700}
  .gr{width:40px;height:4px;border-radius:9px;background:#e2e8f0;margin:-8px auto 16px}
  .f{display:flex;align-items:center;gap:10px;border:1px solid #e2e8f0;border-radius:16px;padding:0 14px;height:52px;margin-bottom:10px;background:#f8fafc}
  .f:focus-within{border-color:#0f172a;background:#fff}
  .f svg{flex:none}
  .f input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:#0f172a;padding:0;height:100%}
  .bt{display:flex;align-items:center;justify-content:center;gap:8px;height:52px}
  .fant{display:flex;flex-direction:column;align-items:center;padding-top:90px}
  .fant .fa{display:flex}.fant .fa i{width:64px;height:64px;border-radius:50%;background:#f1f5f9;border:3px solid #fff;margin-left:-10px}
  .fant .fa i:first-child{margin-left:0}
  .fant .ln{height:6px;border-radius:9px;background:#f1f5f9;margin-top:22px;width:72px}.fant .ln+.ln{margin-top:8px;width:46px}
  .bt{width:100%;background:#0f172a;color:#fff;border:0;border-radius:16px;font:inherit;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer}
  .bt.leve{background:#f1f5f9;color:#475569}
  .bt.perigo{background:#fff;color:#b91c1c;border:1px solid #fee2e2}
  #msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:20}
  #msg.ve{opacity:1}#msg.erro{background:#b91c1c}
  .vazio{color:#94a3b8;font-size:14px;padding:30px 0;text-align:center}
</style>
</head>
<body>
<main>
  <div class="pe" id="topo"></div>
  <div id="partes"></div>
</main>

<div class="fundo" id="fSenha"><div class="folha">
  <div class="gr"></div>
  <div class="f"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="text" id="nova" placeholder="Nova senha (mínimo 8)" autocomplete="off" autocapitalize="none"><button class="ok" id="defSenha" aria-label="Definir senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button></div>
  <div class="trio">
    <button class="tq" id="bloqueia" aria-label="Bloquear ou liberar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></button>
    <button class="tq on" id="focaSenha" aria-label="Senha"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg></button>
    <button class="tq" data-fecha aria-label="Fechar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div></div>

<div class="fundo" id="fNovo"><div class="folha">
  <div class="gr"></div>
  <div class="f"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 8 8 6 8-6"/></svg><input type="text" id="email" placeholder="E-mail" autocomplete="off" autocapitalize="none"></div>
  <div class="f"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input type="text" id="senha" placeholder="Senha (mínimo 8)" autocomplete="off" autocapitalize="none"></div>
  <button class="bt" id="criar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>Criando</button>
  <button class="bt leve" data-fecha><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Fechado</button>
</div></div>

<div class="branco" id="branco"></div>

<div id="msg"></div>

<script type="module">
/* Só o dono usa esta tela (o servidor recusa os outros). Cada pessoa tem e-mail e senha (Cloudflare) e, por app, o app todo
   ou só algumas partes. App novo aparece aqui sozinho: coleção "app_<nome>" ou "app_<nome>_<parte>" no servidor. */
if (!window.NvCanal) await import('./nv-canal.js');
const C = window.NvCanal;
const $ = id => document.getElementById(id);
const SVG = {
  chave: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="#0f172a"/></svg>',
  seta: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  mais: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
let R = null, sel = null;
const BASE = /github\.io$/.test(location.hostname) ? 'https://nv-dados.meusapps.workers.dev' : '';
function msg(t, c) { const m = $('msg'); m.textContent = t; m.className = 've' + (c ? ' ' + c : ''); clearTimeout(msg.t); msg.t = setTimeout(() => { m.className = ''; }, 2600); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function ini(e) { return (e || '?').charAt(0).toUpperCase(); }
function usuario() { return R && R.lista.find(u => u.email === sel); }
function tem(u, app, parte) { return u.areas.indexOf(app) >= 0 || u.areas.indexOf(app + ':' + parte) >= 0; }

const ICONES = {
  rico: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/>',
  plano: '<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  estudo: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  crm: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  tapete: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  adm: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>'
};
const PARTES = {
  contatos: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  agenda: '<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>',
  reunioes: '<rect x="2" y="6" width="14" height="12" rx="3"/><path d="m22 8-6 4 6 4z"/>',
  ativos: '<path d="M5 20V10M10 20V4M15 20V12M20 20V7"/>',
  arquivo: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  clientes: '<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6 8-6s7.2 2 8 6"/>',
  pedidos: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/>',
  ruas: '<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  cadastro: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6M9 15h6"/>',
  config: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  lancamentos: '<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 1V2l-1 1-3-2-3 2-3-2-3 2zM8 8h8M8 12h8"/>',
  tudo: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/>'
};
function iconeParte(app, parte) {
  const d = parte === 'tudo' && ICONES[app] ? ICONES[app] : (PARTES[parte] || PARTES.tudo);
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
}
const SETA_D = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const ICONE_PADRAO = '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12h8M12 8v8"/>';
const abertos = {};
function icone(app) { return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONES[app] || ICONE_PADRAO) + '</svg>'; }
function desenha() {
  if (!R || R.negado || R.t !== 'usuarios') { $('topo').innerHTML = ''; $('partes').innerHTML = '<p class="vazio">Só o dono pode ver esta tela.</p>'; return; }
  if (!sel || !usuario()) sel = R.lista.length ? R.lista[0].email : null;
  const u = usuario();
  $('topo').innerHTML =
    (u ? '<button class="quem" id="abreLista"><div class="av ' + (u.ativo ? '' : 'off') + '">' + ini(u.email) + '</div><b>' + esc(u.email) + '</b>' + SVG.seta + '</button><button class="ic" id="abreSenha" aria-label="Senha">' + SVG.chave + '</button>' : '<span style="flex:1"></span>') +
    '<button class="ic novo" id="abreNovo" aria-label="Nova pessoa">' + SVG.mais + '</button>';
  $('partes').innerHTML = !u ? '<div class="fant"><div class="fa"><i></i><i></i><i></i></div><div class="ln"></div><div class="ln"></div></div>' : R.apps.map(a => {
    const lig = a.partes.filter(p => tem(u, a.id, p.id)).length;
    return '<div class="ac ' + (abertos[a.id] ? 'abre' : '') + '" data-a="' + a.id + '"><button class="ah" data-abre="' + a.id + '"><div class="ib2">' + icone(a.id) + '</div><b>' + esc(a.nome) + '</b><span class="bd">' + lig + '/' + a.partes.length + '</span></button><div class="cps">' + a.partes.map(p => { const on = tem(u, a.id, p.id); return '<button class="cp ' + (on ? 'on' : '') + '" data-a="' + a.id + '" data-p="' + p.id + '"><span class="pi" style="color:' + (on ? '#fff' : '#0f172a') + '">' + iconeParte(a.id, p.id) + '</span><span class="pn">' + esc(p.nome) + '</span>' + SETA_D + '</button>'; }).join('') + '</div></div>';
  }).join('');
  if ($('abreLista')) {
    let tm = null, longo = false, x0 = 0, y0 = 0;
    const q = $('abreLista');
    q.onpointerdown = e => { longo = false; x0 = e.clientX; y0 = e.clientY; clearTimeout(tm); tm = setTimeout(() => { longo = true; if (navigator.vibrate) { try { navigator.vibrate(15); } catch (x) {} } copiaConvite(); }, 550); };
    q.onpointermove = e => { if (Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 10) clearTimeout(tm); };
    ['onpointerup', 'onpointercancel', 'onpointerleave'].forEach(k => { q[k] = () => clearTimeout(tm); });
    q.oncontextmenu = e => e.preventDefault();
    q.onclick = () => { if (longo) { longo = false; return; } abrePessoas(); };
  }
  if ($('abreSenha')) $('abreSenha').onclick = () => { $('bloqueia').classList.toggle('bloq', !u.ativo); $('nova').value = ''; $('fSenha').classList.add('abre'); };
  $('abreNovo').onclick = () => { $('email').value = ''; $('senha').value = ''; $('fNovo').classList.add('abre'); };
  $('partes').querySelectorAll('.ah').forEach(b => { b.onclick = () => { const k = b.dataset.abre; abertos[k] = !abertos[k]; b.parentNode.classList.toggle('abre', !!abertos[k]); }; });
  $('partes').querySelectorAll('.cp').forEach(b => { b.onclick = () => alterna(b.dataset.a, b.dataset.p, !b.classList.contains('on')); });
}
/* escolher a pessoa: tela toda branca, cada pessoa num cartão solto; ao escolher, volta ao normal */
function abrePessoas() {
  $('branco').innerHTML = R.lista.map(p => '<button class="pc" data-e="' + esc(p.email) + '"><div class="av ' + (p.ativo ? '' : 'off') + '">' + ini(p.email) + '</div><b>' + esc(p.email) + '</b></button>').join('');
  $('branco').classList.add('abre');
  $('branco').querySelectorAll('.pc').forEach(b => { b.onclick = (e) => { e.stopPropagation(); sel = b.dataset.e; $('branco').classList.remove('abre'); desenha(); }; });
}
/* segurar o e-mail copia na hora: endereço + e-mail. O acesso de verdade vive no servidor, então vale sempre o que estiver ligado agora */
async function copiaConvite() {
  const u = usuario(); if (!u) return;
  const texto = 'https://apps.v4cless.com\nE-mail: ' + u.email;
  try { await navigator.clipboard.writeText(texto); msg('Convite copiado'); }
  catch (e) { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); msg('Convite copiado'); } catch (x) { msg('Não consegui copiar', 'erro'); } t.remove(); }
}
$('branco').onclick = () => $('branco').classList.remove('abre');
async function alterna(app, parte, liga) {
  const u = usuario(), a = R.apps.find(x => x.id === app);
  const ligadas = a.partes.filter(p => (p.id === parte ? liga : tem(u, app, p.id))).map(p => p.id);
  const resto = u.areas.filter(x => x !== app && x.indexOf(app + ':') !== 0);
  const novo = ligadas.length === a.partes.length ? resto.concat([app]) : resto.concat(ligadas.map(p => app + ':' + p));
  u.areas = novo; desenha();
  const r = await C.salvaUsuario(u.email, novo, u.ativo);
  if (r && r.lista) { R = r; desenha(); } else msg('Não consegui salvar', 'erro');
}
async function definirSenha(email, senha) {
  try {
    const t = await C.passe();
    if (!t) return 'entre pelo menu com a senha do dono antes';
    const r = await fetch(BASE + '/auth/definir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: t, email, senha }) });
    const j = await r.json().catch(() => ({}));
    return r.ok ? '' : (j.erro || 'erro ' + r.status);
  } catch (e) { return e.message; }
}
document.querySelectorAll('[data-fecha]').forEach(b => { b.onclick = () => document.querySelectorAll('.fundo').forEach(f => f.classList.remove('abre')); });
document.querySelectorAll('.fundo').forEach(f => { f.addEventListener('click', e => { if (e.target === f) f.classList.remove('abre'); }); });
$('focaSenha').onclick = () => $('nova').focus();
$('nova').addEventListener('keydown', e => { if (e.key === 'Enter') $('defSenha').click(); });
$('defSenha').onclick = async () => {
  const s = $('nova').value, u = usuario();
  if (s.length < 8) return msg('Mínimo 8 letras', 'erro');
  const e = await definirSenha(u.email, s);
  if (e) return msg(e, 'erro');
  $('fSenha').classList.remove('abre'); msg('Senha definida');
};
$('bloqueia').onclick = async () => {
  const u = usuario(); const r = await C.salvaUsuario(u.email, u.areas, !u.ativo);
  if (r && r.lista) { R = r; $('fSenha').classList.remove('abre'); desenha(); msg(u.ativo ? 'Bloqueado' : 'Liberado'); }
};
$('criar').onclick = async () => {
  const email = $('email').value.trim().toLowerCase(), senha = $('senha').value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg('E-mail inválido', 'erro');
  if (senha.length < 8) return msg('Senha: mínimo 8', 'erro');
  const e = await definirSenha(email, senha);
  if (e) return msg(e, 'erro');
  const r = await C.salvaUsuario(email, [], true);
  if (r && r.lista) { R = r; sel = email; $('fNovo').classList.remove('abre'); desenha(); msg('Pessoa criada'); }
};
R = await C.usuarios();
desenha();
</script>
</body>
