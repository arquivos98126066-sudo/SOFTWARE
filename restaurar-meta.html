var R=document.getElementById('r'),L=[];function say(t){L.push(t);R.textContent=L.join('\n')}
function cnt(n){var c=1,f=n&&n.children||[];for(var i=0;i<f.length;i++)c+=cnt(f[i]);return c}
function pend(){try{return Object.keys(JSON.parse(localStorage.getItem('nv.pend.v1')||'{}')).length}catch(e){return 0}}
