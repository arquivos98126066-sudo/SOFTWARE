<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>Esteticista - São Paulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#0f172a;--tx2:#6b7280;--bd:#e6e9ef;--main:#111;--chip:#f1f4f8;--chipTx:#334155;--track:#eceff4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit}
svg.i{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 16px;background:linear-gradient(to bottom,var(--bg) 78%,rgba(243,245,248,0))}
.hd{max-width:680px;margin:0 auto;padding:16px 18px 18px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(180deg,#fff,#f7f9fc);box-shadow:0 14px 34px -20px rgba(15,23,42,.22)}
.hd-row{display:flex;align-items:center;gap:12px}
.hd-l{flex:1;min-width:0}
.nv{position:absolute;left:-8px;top:-8px;z-index:1;height:20px;padding:0 7px;border:1px solid var(--bd);border-radius:999px;background:#fff;color:var(--chipTx);font:700 10.5px/18px 'Barlow',sans-serif;letter-spacing:.04em}
.hw{position:relative;flex:none;width:58px;height:58px;margin-right:4px}
.mais{position:absolute;right:-8px;bottom:-8px;width:26px;height:26px;display:grid;place-items:center;padding:0;border:2px solid #fff;border-radius:50%;background:#111;color:#fff;cursor:pointer}
.mais::before{content:"";position:absolute;inset:-10px}
.mais svg{width:13px;height:13px;stroke-width:2.6}
.hero{flex:none;width:58px;height:58px;display:grid;place-items:center;padding:0;border:1px solid var(--bd);border-radius:50%;background:var(--chip);cursor:pointer}
.hero svg{width:46px;height:46px;stroke:#1e293b;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pc{opacity:0;transition:opacity .35s}
.pc.on{opacity:1}
.pc .f{fill:var(--a,#dfe5ee)}
.pc.g{stroke:var(--g,#16a34a)}
.sp{stroke:var(--g,#16a34a);opacity:0;transition:opacity .35s}
.sp.on{opacity:1}
.pc.g .f{fill:var(--g,#16a34a);fill-opacity:.16}
.hd-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 21px/1.1 'Barlow',sans-serif;color:var(--tx)}
.hd-c{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--chipTx);font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em}
.prog{display:flex;align-items:baseline;gap:5px;font:700 40px/1 'Barlow',sans-serif;background:linear-gradient(135deg,#15803d,#22c55e,#4ade80);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.prog small{font:600 16px 'Barlow',sans-serif;-webkit-text-fill-color:var(--tx2);color:var(--tx2)}
.bar{height:8px;margin-top:16px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#15803d,#22c55e,#4ade80);transition:width .3s}

.prog{font-size:30px}
.prog small{font-size:14px}
main{max-width:680px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
#lista{list-style:none;margin:0;padding:0}
.bx{margin:0 0 10px;background:var(--card);border:1px solid var(--bd);border-radius:24px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 18px;border:0;background:transparent;color:var(--tx);text-align:left;cursor:pointer;font:600 15px 'DM Sans',sans-serif}
.bt{flex:1;text-transform:uppercase;letter-spacing:.06em;font-size:13.5px}
.bn{font:600 13.5px 'Barlow',sans-serif;color:var(--tx2)}
.bx.ok .bn{color:#15803d}
.chev{width:20px;height:20px;stroke:var(--tx2);transition:transform .25s}
.bx.aberto .chev{transform:rotate(180deg)}
.vb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.bx.aberto .vb{grid-template-rows:1fr}
.vi{overflow:hidden;min-height:0}
.rows{list-style:none;margin:0;padding:0 0 6px}
.rows li+li{border-top:1px solid #f0f2f6}
.rows button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 18px;border:0;background:transparent;color:var(--tx);text-align:left;cursor:pointer}
.rows button:active{background:#f7f9fc}
.tx{flex:1;min-width:0;font:400 14.5px/1.35 'DM Sans',sans-serif}
.ck{flex:none;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid #d5dae3;border-radius:50%;background:#fff;transition:.15s}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.15s}
li.on .ck{background:var(--main);border-color:var(--main)}
li.on .ck svg{opacity:1;transform:none}
li.on .tx{color:var(--tx2)}
@keyframes pula{0%{transform:none}25%{transform:scale(1.2) rotate(-9deg)}50%{transform:scale(1.2) rotate(9deg)}75%{transform:scale(1.08) rotate(-4deg)}100%{transform:none}}
.hero.pula{animation:pula .7s ease}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);padding:0 20px;height:40px;display:flex;align-items:center;border-radius:999px;background:#111;color:#fff;font:600 13.5px 'DM Sans',sans-serif;opacity:0;pointer-events:none;transition:.2s}
#toast.v{opacity:1;transform:translateX(-50%)}
#t1{text-transform:uppercase;letter-spacing:.06em}
</style></head><body>
<header class="top"><div class="hd">
  <div class="hd-row"><div class="hw"><span class="nv" id="nv">Nv 0</span><button type="button" class="hero" id="hero" aria-label="Nível"><svg viewBox="0 0 64 64" aria-hidden="true">
  <g class="pc g" data-k="9"><circle cx="32" cy="32" r="29" stroke-dasharray="3 4"/></g>
  <g class="pc g" data-k="8"><path d="M26 28c-8-7-15-5-18 2 6 0 8 5 11 9M38 28c8-7 15-5 18 2-6 0-8 5-11 9"/></g>
  <g class="pc g" data-k="6"><path class="f" d="M26 27l-7 24 13-5 13 5-7-24z"/></g>
  <circle cx="32" cy="16" r="6.5"/><path d="M26 26h12l-1 15H27zM26 27l-8 10M38 27l8 10M28 41l-3 16M36 41l3 16"/>
  <g class="pc" data-k="1"><path class="f" d="M25.5 16.5a6.5 6.5 0 0 1 13 0zM25.5 16.5v4M38.5 16.5v4M29 19h6"/></g>
  <g class="pc" data-k="7"><path class="f" d="M23 49h7v7h-7zM34 49h7v7h-7z"/></g>
  <g class="pc" data-k="2"><path class="f" d="M26 26h12l-1 15H27z"/><path d="M32 26v15"/></g>
  <g class="pc" data-k="3"><circle class="f" cx="26" cy="27" r="3"/><circle class="f" cx="38" cy="27" r="3"/><path d="M27 38h10"/></g>
  <g class="pc" data-k="4"><path class="f" d="M8 32h12v9c0 5-6 8-6 8s-6-3-6-8z"/><circle cx="14" cy="39" r="1.6"/></g>
  <g class="pc" data-k="5"><path d="M52 14v24M47 38h10M52 38v6"/></g>
  <g class="pc g" data-k="6"><path d="M26 10l3 3 3-5 3 5 3-3v4H26z"/></g>
</svg></button></div><div class="hd-l"><div class="hd-t"><span id="t1"></span></div></div><div class="prog" id="t3"></div></div>
  <div class="bar"><i id="bar"></i></div>
</div></header>
<main><ul id="lista"></ul></main><div id="toast">Copiado</div>
<script>
const D={"chave": "pros:cid:TESTE:SP:ESTETICISTA", "titulo": "Esteticista em São Paulo", "linhas": [{"texto": "Esteticista em Cândido Mota, São Paulo", "pop": 30144}]};
let marc={};const BL=[];
try{marc=JSON.parse(localStorage.getItem(D.chave)||"{}")}catch(e){}
function salva(){try{localStorage.setItem(D.chave,JSON.stringify(marc))}catch(e){}}
function copia(t){
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).catch(()=>velha(t));return}}catch(e){}
  velha(t);
}
function velha(t){try{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}catch(e){}}
let tt;function aviso(){const e=document.getElementById("toast");e.classList.add("v");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("v"),1400)}
let pv=null,cnt=0;
const UN={1:1,2:3,3:6,4:9,5:12,6:20,7:16,8:28,9:36};let MAXN=20,ult=null;
const FX=[[0,"#ecc79c","#b45309"],[12,"#dfe5ee","#64748b"],[24,"#fde68a","#d97706"],[36,"#bae6fd","#0891b2"]];
const SP=[[9,9],[55,9],[5,30],[59,30],[9,53],[55,53],[20,4],[44,4]];
(function(){const g=document.getElementById("hero").querySelector("svg"),NS="http://www.w3.org/2000/svg";
  SP.forEach(p=>{const e=document.createElementNS(NS,"path");e.setAttribute("d","M"+(p[0]-2.5)+" "+p[1]+"h5M"+p[0]+" "+(p[1]-2.5)+"v5");e.setAttribute("class","sp");g.appendChild(e)})})();
function nivel(v){const sv=document.getElementById("hero").querySelector("svg"),st=Math.round(v*50/(MAXN||1));let f=FX[0];FX.forEach(x=>{if(st>=x[0])f=x});
  sv.style.setProperty("--a",f[1]);sv.style.setProperty("--g",f[2]);
  document.querySelectorAll(".pc").forEach(g=>g.classList.toggle("on",UN[+g.dataset.k]<=st));
  document.querySelectorAll(".sp").forEach((g,k)=>g.classList.toggle("on",st>=8+k*5));
  document.getElementById("nv").textContent="Nv "+v;
  if(ult!=null&&v>ult){const h=document.getElementById("hero");h.classList.remove("pula");void h.offsetWidth;h.classList.add("pula");setTimeout(()=>h.classList.remove("pula"),800)}
  ult=v}
const avanca=p=>()=>{const b=pv==null?Math.min(MAXN,cnt):pv;pv=b+p>MAXN?0:b+p;nivel(pv)};
document.getElementById("hero").onclick=avanca(5);
function prog(){const n=D.linhas.filter(l=>marc[l.texto]).length,t=D.linhas.length;
  BL.forEach(b=>{const k=b.g.filter(l=>marc[l.texto]).length;b.n.textContent=k+"/"+b.g.length;b.el.classList.toggle("ok",k===b.g.length)});
  cnt=BL.filter(b=>b.g.every(l=>marc[l.texto])).length;pv=null;nivel(Math.min(MAXN,cnt));
  document.getElementById("t3").innerHTML=n+'<small>/ '+t+'</small>';document.getElementById("bar").style.width=(t?100*n/t:0)+"%"}
document.getElementById("t1").textContent=((D.titulo||"").match(/\bem\s+(.+)$/)||[])[1]||D.titulo||"";
const ul=document.getElementById("lista");
for(let i=0;i<D.linhas.length;i+=10){
  const g=D.linhas.slice(i,i+10),bx=document.createElement("li");bx.className="bx";
  const h=document.createElement("button");h.type="button";h.className="bh";
  h.innerHTML='<span class="bt"></span><span class="bn"></span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  h.querySelector(".bt").textContent="Nível "+(i/10+1);
  h.onclick=()=>bx.classList.toggle("aberto");
  const vb=document.createElement("div"),vi=document.createElement("div"),rows=document.createElement("ul");
  vb.className="vb";vi.className="vi";rows.className="rows";
  g.forEach(l=>{
    const li=document.createElement("li"),b=document.createElement("button");b.type="button";
    b.innerHTML='<span class="ck"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="tx"></span>';
    b.querySelector(".tx").textContent=((l.texto||"").match(/\bem\s+(.+?),[^,]*$/)||[])[1]||l.texto;
    if(marc[l.texto])li.classList.add("on");
    b.onclick=()=>{
      if(marc[l.texto]){delete marc[l.texto];li.classList.remove("on")}
      else{marc[l.texto]=1;li.classList.add("on");copia(l.texto);aviso()}
      salva();prog();
    };
    li.appendChild(b);rows.appendChild(li);
  });
  vi.appendChild(rows);vb.appendChild(vi);bx.appendChild(h);bx.appendChild(vb);ul.appendChild(bx);
  BL.push({g,el:bx,n:h.querySelector(".bn")});
}
MAXN=BL.length||1;
prog();
</script></body></html>
