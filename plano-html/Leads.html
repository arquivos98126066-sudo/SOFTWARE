<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#0f172a;--tx2:#6b7280;--bd:#e6e9ef;--main:#111;--chip:#f1f4f8;--chipTx:#334155;--track:#eceff4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'DM Sans',system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit}
svg.i{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}


.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 16px;background:linear-gradient(to bottom,var(--bg) 78%,rgba(243,245,248,0))}
.hd{max-width:680px;margin:0 auto;padding:16px 18px 18px;border:1px solid var(--bd);border-radius:24px;background:linear-gradient(180deg,#fff,#f7f9fc);box-shadow:0 14px 34px -20px rgba(15,23,42,.22)}
.hd-row{display:flex;align-items:center;gap:12px}
.hd-l{flex:1;min-width:0}
.nv{position:absolute;left:-8px;top:-8px;z-index:1;height:20px;padding:0 7px;border:1px solid var(--bd);border-radius:999px;background:#fff;color:var(--chipTx);font:700 10.5px/18px 'Barlow',sans-serif;letter-spacing:.04em}
.hw{position:relative;flex:none;width:58px;height:58px;margin-right:4px}
.mais{position:absolute;right:-8px;bottom:-8px;width:26px;height:26px;display:grid;place-items:center;padding:0;border:2px solid #fff;border-radius:50%;background:#111;color:#fff;cursor:pointer}
.mais::before{content:"";position:absolute;inset:-10px}
.mais svg{width:13px;height:13px;stroke-width:2.6}
.hero{flex:none;width:58px;height:58px;display:grid;place-items:center;padding:0;border:1px solid var(--bd);border-radius:50%;background:var(--chip);cursor:pointer}
.hero svg{width:46px;height:46px;stroke:#1e293b;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pc{opacity:0;transition:opacity .35s}
.pc.on{opacity:1}
.pc .f{fill:var(--a,#dfe5ee)}
.pc.g{stroke:var(--g,#16a34a)}
.sp{stroke:var(--g,#16a34a);opacity:0;transition:opacity .35s}
.sp.on{opacity:1}
.pc.g .f{fill:var(--g,#16a34a);fill-opacity:.16}
.hd-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:600 21px/1.1 'Barlow',sans-serif;color:var(--tx)}
.hd-c{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--chipTx);font:700 11px 'DM Sans',sans-serif;letter-spacing:.08em}
.prog{display:flex;align-items:baseline;gap:5px;font:700 40px/1 'Barlow',sans-serif;background:linear-gradient(135deg,#15803d,#22c55e,#4ade80);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.prog small{font:600 16px 'Barlow',sans-serif;-webkit-text-fill-color:var(--tx2);color:var(--tx2)}
.bar{height:8px;margin-top:16px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#15803d,#22c55e,#4ade80);transition:width .3s}

main{max-width:680px;margin:0 auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom))}
.grupo{margin:22px 4px 10px;font:700 12.5px 'DM Sans',sans-serif;letter-spacing:.08em;color:var(--tx2)}
.vazio{margin:60px 0;text-align:center;color:var(--tx2);font-size:15px}

.lead{background:var(--card);border:1px solid var(--bd);border-radius:24px;margin-bottom:12px;overflow:hidden}
.head{display:flex;align-items:center;gap:6px;padding-right:12px}
.abre{flex:1;min-width:0;min-height:76px;display:flex;align-items:center;gap:10px;padding:14px 4px 14px 18px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.abre .tx{flex:1;min-width:0}
.nome{font:600 17px/1.25 'Barlow',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px;color:var(--tx2);min-width:0}
.meta span.c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:20px;height:20px;stroke:var(--tx2);transition:transform .25s}
.lead.aberto .chev{transform:rotate(180deg)}
.lig{flex:none;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid #e5e7eb;border-radius:50%;background:#fff;color:#cbd2dc;cursor:pointer}
.lig svg{width:20px;height:20px;stroke-width:2.2}
.lead.feito .lig{background:var(--main);border-color:var(--main);color:#fff}
.lead.feito .nome{color:var(--tx2)}

.tag{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--chip);color:var(--chipTx);font:700 11px 'DM Sans',sans-serif;letter-spacing:.04em}
.tag.QUENTE{--d:#ea580c}.tag.MORNO{--d:#f59e0b}.tag.FRIO{--d:#60a5fa}

.vb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.lead.aberto .vb{grid-template-rows:1fr}
.vi{overflow:hidden;min-height:0}
.cartao{padding:0 14px 18px}

/* árvore: 32 colunas, 0.6em por coluna; a fonte se ajusta à largura da tela, no máximo 13px */
.arv{margin:0;padding:14px 10px;border:1px solid var(--bd);border-radius:20px;background:#fff;color:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:min(13.5px,calc((100vw - 84px) / 19.4));line-height:1.55;white-space:pre;overflow-x:hidden}


.ttl{display:inline-block;max-width:100%;margin:0 0 12px;padding:5px 14px;border:1px solid #e3e7ee;border-radius:18px;white-space:normal;font:700 11.5px/1.4 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#1e293b}
.pf{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.corpo{margin:0;font:inherit;white-space:pre}
.arv a{color:inherit;text-decoration:underline;text-underline-offset:4px}
.cartao>*+*{margin-top:14px}
.sel{-webkit-user-select:all;user-select:all}
.msg{-webkit-user-select:all;user-select:all;border-left:2px solid #cbd2dc;padding:2px 0 2px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bloco{padding:14px 12px;border:1px solid var(--bd);border-radius:20px;background:#fff;color:#334155;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.5px;line-height:1.6}

#t1{letter-spacing:.06em}
</style></head><body>
<header class="top"><div class="hd">
  <div class="hd-row"><div class="hw"><span class="nv" id="nv">Nv 0</span><button type="button" class="hero" id="hero" aria-label="Nível"><svg viewBox="0 0 64 64" aria-hidden="true">
  <g class="pc g" data-k="9"><circle cx="32" cy="32" r="29" stroke-dasharray="3 4"/></g>
  <g class="pc g" data-k="8"><path d="M26 28c-8-7-15-5-18 2 6 0 8 5 11 9M38 28c8-7 15-5 18 2-6 0-8 5-11 9"/></g>
  <g class="pc g" data-k="6"><path class="f" d="M26 27l-7 24 13-5 13 5-7-24z"/></g>
  <circle cx="32" cy="16" r="6.5"/><path d="M26 26h12l-1 15H27zM26 27l-8 10M38 27l8 10M28 41l-3 16M36 41l3 16"/>
  <g class="pc" data-k="1"><path class="f" d="M25.5 16.5a6.5 6.5 0 0 1 13 0zM25.5 16.5v4M38.5 16.5v4M29 19h6"/></g>
  <g class="pc" data-k="7"><path class="f" d="M23 49h7v7h-7zM34 49h7v7h-7z"/></g>
  <g class="pc" data-k="2"><path class="f" d="M26 26h12l-1 15H27z"/><path d="M32 26v15"/></g>
  <g class="pc" data-k="3"><circle class="f" cx="26" cy="27" r="3"/><circle class="f" cx="38" cy="27" r="3"/><path d="M27 38h10"/></g>
  <g class="pc" data-k="4"><path class="f" d="M8 32h12v9c0 5-6 8-6 8s-6-3-6-8z"/><circle cx="14" cy="39" r="1.6"/></g>
  <g class="pc" data-k="5"><path d="M52 14v24M47 38h10M52 38v6"/></g>
  <g class="pc g" data-k="6"><path d="M26 10l3 3 3-5 3 5 3-3v4H26z"/></g>
</svg></button></div><div class="hd-l"><div class="hd-t"><span id="t1"></span><span class="hd-c" id="t0"></span></div></div><div class="prog" id="t3"></div></div>
  <div class="bar"><i id="bar"></i></div>
</div></header>
<main id="m"></main>
<script>
const D={"leads": [{"nome": "Hamburgueria Martins", "cidade": "Propriá, SE", "telefone": "(79) 99998-1338", "telefone_tel": "+5579999981338", "fontes": ["Google", "Instagram", "Site de pedidos", "WhatsApp Business"], "n_prints": 14, "nota": "QUENTE", "foco": "MELHORIA", "motivo": "Negócio forte (4,8 com 163 avaliações), mas com 2 falhas claras de informação que confundem o cliente.", "fortes": ["Google: nota 4,8 com 163 avaliações, faixa R$ 20-40, aberto e com cardápio ligado ao site.", "Posição: em 1º na busca \"hamburgueria propriá sergipe\" (nas duas buscas, 10:19 e 11:16).", "Concorrentes: King Burguer Churras 4,4 (36 avaliações) e Mega Burguer 4,3 (20). A Martins tem mais de 4 vezes as avaliações do 2º e mais de 8 vezes as do 3º.", "Avaliações recentes: das 9 dos últimos 6 meses que vi, todas 5 estrelas.", "Instagram: @hamburgueria.martins, 10,1 mil seguidores, 106 posts, bio com \"Melhor Hamburgueria de Propriá 2022, 2023 & 2024\", destaques de WhatsApp e Delivery.", "Site de pedidos: cardápio com combos, cupom de 15% na primeira compra e cashback (MartinsCoins).", "WhatsApp Business: aparece como \"Responde rapidamente\"."], "problemas": ["Endereço diferente em 3 lugares: Google = Av. Pref. Nelson Melo, Galeria 3. Site de pedidos e post fixado do Instagram = Praça Tobias Barreto, 520. WhatsApp Business = R. Dom José Tomás, 617. O cliente pode ir ao lugar errado ou desistir.", "Horário diferente: o Google mostrava \"Aberto, fecha 01:30\" às 10:19 e às 11:16. O site de pedidos, às 10:22, dizia \"Loja fechada, abre hoje às 18:00\". O WhatsApp Business mostra segunda das 18:00 às 23:59 e o Facebook (que aparece no Google) diz 18h às 00:00. Quem chega de manhã pode encontrar fechado."], "conferir": ["12/10/2026 é feriado (Nossa Senhora Aparecida) e o Google avisa que pode afetar o horário. Confirmar se o \"Aberto\" de manhã não é só efeito do feriado.", "Pode haver 2 unidades (Galeria 3 e Praça Tobias Barreto). Confirmar antes de chamar de erro.", "O número no WhatsApp Business aparece como +55 79 9998-1338 (8 dígitos depois do DDD). No Google e no Instagram é (79) 99998-1338. Confirmar se é o mesmo número.", "Só vi o horário de segunda-feira no WhatsApp. Os outros dias não apareceram nos prints."], "descartado": ["Johan, 1 estrela, há um ano: \"40 minutos para 2 hambúrgueres com a loja vazia\" e sem pedido de desculpas. Fora dos 6 meses."], "oferta": ["Análise completa, sem custo, em 15 minutos.", "Mostrar os 2 pontos (endereço e horário) e como deixar tudo igual no Google, site, WhatsApp e Instagram.", "Pontos que podem ajudar a vender mais."], "ligacao": ["Oi, tudo bem? É o Klebson. Qual é o seu nome?", "Prazer, [nome]! Tem 30 segundos?", "Analisei a Martins: nota 4,8 com 163 avaliações, uma das mais bem avaliadas de Propriá.", "Mas achei 2 detalhes que podem fazer o cliente desistir de comprar na Martins.", "O primeiro é o endereço: o Google mostra um, o site outro e o WhatsApp outro. Então o cliente pode ficar sem saber pra onde ir.", "O segundo é o horário: o Google mostra a loja aberta de manhã, mas o site diz que só abre às 18h. Então, se o cliente chegar nesse horário, pode encontrar tudo fechado.", "É sobre isso que eu queria falar, mas não sei se é com você ou com outra pessoa.", "Então, foi por causa desses dois pontos que eu fiz uma análise mais completa da Martins, sem custo, com pontos que podem ajudar a vender mais. Posso te mostrar em 15 minutos? Qual horário fica melhor pra você?"], "mensagem": "E aí, tudo bem? Aqui é o Klebson.\nDei uma olhada na Hamburgueria Martins no Google: nota 4,8 com 163 avaliações, uma das melhores de Propriá.\nVi 2 coisas que podem estar fazendo vocês perderem pedido: o endereço muda entre Google, site e WhatsApp, e o Google mostra aberto de manhã, mas o site diz que só abre às 18h.\nFiz uma análise completa, sem custo, com uns pontos que podem ajudar a vender mais. Posso te mostrar em 15 minutos? Qual horário fica melhor pra você?"}], "ciclo": 1, "data": "12/10/2026 12:38"};
const CH="pros:leads:ciclo"+D.ciclo;
let fe={};try{fe=JSON.parse(localStorage.getItem(CH)||"{}")}catch(e){}
function salva(){try{localStorage.setItem(CH,JSON.stringify(fe))}catch(e){}}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const IC={
chev:'<path d="m6 9 6 6 6-6"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
};
function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function paragrafos(m){const L=String(m||"").split("\n").map(x=>x.trim()).filter(Boolean);if(L.length>=3)L.splice(0,2,L[0]+" "+L[1]);return L.join("\n\n")}
function pinta(p,txt,tel,href){const L=String(txt).split("\n");L.forEach((ln,i)=>{
  const m=/^[│├└─ ]*/.exec(ln)[0],r=ln.slice(m.length);
  if(m)p.appendChild(el("span","pf",m));
  const t=el("span");const k=tel?r.indexOf(tel):-1;
  if(k>=0){t.appendChild(document.createTextNode(r.slice(0,k)));const a=el("a",null,tel);a.href=href;t.appendChild(a);t.appendChild(document.createTextNode(r.slice(k+tel.length)))}else t.textContent=r;
  p.appendChild(t);if(i<L.length-1)p.appendChild(document.createTextNode("\n"))})}
function bloco(tit,texto,msg){const c=el("div",msg?"bloco":"arv");c.appendChild(el("div","ttl",tit));
  if(msg)c.appendChild(el("div","msg",texto));else{const p=el("pre","corpo sel");pinta(p,texto);c.appendChild(p)}return c}
//ARV-INI
const LARG=32;
function quebra(txt,n){const out=[];let cur="";
  String(txt==null?"":txt).split(/\s+/).filter(Boolean).forEach(p=>{
    let a=Array.from(p);
    while(a.length>n){if(cur){out.push(cur);cur=""}out.push(a.slice(0,n).join(""));a=a.slice(n)}
    p=a.join("");
    if(!cur)cur=p;else if(Array.from(cur+" "+p).length<=n)cur+=" "+p;else{out.push(cur);cur=p}
  });
  if(cur)out.push(cur);return out.length?out:[""]}
function ramo(nos,pref,out){nos.forEach((no,i)=>{
    const ult=i===nos.length-1,filho=pref+(ult?"    ":"│   "),ini=out.length;
    quebra(no.t,LARG-pref.length-4).forEach((ln,k)=>out.push(k===0?pref+(ult?"└── ":"├── ")+ln:filho+ln));
    if(no.c&&no.c.length)ramo(no.c,filho,out);
    if(!ult&&out.length-ini>1)out.push(pref+"│")})}
function folhas(a){return (a||[]).filter(x=>x!=null&&String(x).trim()!=="").map(x=>({t:String(x)}))}
function dividir(x){const m=/^([^:]{1,40}:)\s+([\s\S]+)$/.exec(String(x).trim());return m?{t:m[1],c:[{t:m[2]}]}:{t:String(x)}}
function arvore(raiz,nos){const out=[];ramo(nos,"",out);return {t:raiz,b:out.join("\n")}}
function arvTopo(l){const n=[];
  if(l.nome)n.push({t:"Nome completo: "+l.nome});
  if(l.cidade)n.push({t:"Cidade: "+l.cidade});
  if(l.telefone)n.push({t:"Fone: "+l.telefone});
  const fo=folhas(l.fontes);if(fo.length)n.push({t:"Fontes analisadas",c:fo});
  if(l.n_prints)n.push({t:"Prints: "+l.n_prints});
  if(l.nota)n.push({t:"Nota: "+l.nota});
  if(l.foco)n.push({t:"Foco: "+l.foco,c:l.motivo?[{t:l.motivo}]:undefined});else if(l.motivo)n.push({t:l.motivo});
  return arvore(l.nome_curto||l.nome||"Lead",n)}
function arvFortes(l){const n=folhas(l.fortes).map(x=>dividir(x.t));return n.length?arvore("Pontos fortes",n):""}
function arvProblemas(l){const n=folhas(l.problemas).map(x=>dividir(x.t)),cf=folhas(l.conferir).map(x=>dividir(x.t)),ds=folhas(l.descartado).map(x=>dividir(x.t));
  if(cf.length)n.push({t:"Conferir antes de falar",c:cf});
  if(ds.length)n.push({t:"Descartado (fora dos 6 meses)",c:ds});
  return n.length?arvore("Problemas encontrados",n):""}
function arvOferta(l){const n=folhas(l.oferta);return n.length?arvore("O que oferecer",n):""}
function arvLigacao(l){const n=folhas(l.ligacao).map(x=>({t:'"'+x.t+'"'}));if(!n.length)return"";const out=[];ramo(n,"",out);return out.join("\n")}
//ARV-FIM
let pv=null,cnt=0;
const UN={1:1,2:3,3:6,4:9,5:12,6:20,7:16,8:28,9:36},MAXN=100;
const FX=[[0,"#ecc79c","#b45309"],[12,"#dfe5ee","#64748b"],[24,"#fde68a","#d97706"],[36,"#bae6fd","#0891b2"]];
const SP=[[9,9],[55,9],[5,30],[59,30],[9,53],[55,53],[20,4],[44,4]];
(function(){const g=document.getElementById("hero").querySelector("svg"),NS="http://www.w3.org/2000/svg";
  SP.forEach(p=>{const e=document.createElementNS(NS,"path");e.setAttribute("d","M"+(p[0]-2.5)+" "+p[1]+"h5M"+p[0]+" "+(p[1]-2.5)+"v5");e.setAttribute("class","sp");g.appendChild(e)})})();
function nivel(v){const sv=document.getElementById("hero").querySelector("svg"),st=Math.round(v*50/(MAXN||1));let f=FX[0];FX.forEach(x=>{if(st>=x[0])f=x});
  sv.style.setProperty("--a",f[1]);sv.style.setProperty("--g",f[2]);
  document.querySelectorAll(".pc").forEach(g=>g.classList.toggle("on",UN[+g.dataset.k]<=st));
  document.querySelectorAll(".sp").forEach((g,k)=>g.classList.toggle("on",st>=8+k*5));
  document.getElementById("nv").textContent="Nv "+v}
const avanca=p=>()=>{const b=pv==null?Math.min(MAXN,cnt):pv;pv=b+p>MAXN?0:b+p;nivel(pv)};
document.getElementById("hero").onclick=avanca(5);
function prog(){const t=D.leads.length,n=D.leads.filter(l=>fe[l.nome]).length;cnt=n;pv=null;nivel(Math.min(MAXN,n));
  document.getElementById("t3").innerHTML=n+'<small>/ '+t+'</small>';document.getElementById("bar").style.width=(t?100*n/t:0)+"%"}
document.getElementById("t1").textContent="LEADS";var t0=document.getElementById("t0");if(t0)t0.style.display="none";
const ordem={QUENTE:0,MORNO:1,FRIO:2},m=document.getElementById("m");
if(!D.leads.length)m.appendChild(el("div","vazio","Sem leads neste ciclo"));
let atual=null;
D.leads.map((l,i)=>[l,i]).sort((a,b)=>((ordem[a[0].nota]??3)-(ordem[b[0].nota]??3))||(a[1]-b[1])).forEach(([l])=>{
  atual=l.nota;
  const c=el("div","lead"+(fe[l.nome]?" feito":""));
  const head=el("div","head"),ab=el("button","abre");ab.type="button";
  const tx=el("div","tx");tx.appendChild(el("div","nome",l.nome_curto||l.nome||""));
  const me=el("div","meta");me.appendChild(el("span","tag "+l.nota,l.nota||""));me.appendChild(el("span","c",(l.cidade||"")));
  tx.appendChild(me);ab.appendChild(tx);ab.insertAdjacentHTML("beforeend",ic("chev","chev"));
  ab.onclick=()=>c.classList.toggle("aberto");
  const lg=el("button","lig");lg.type="button";lg.setAttribute("aria-label","Liguei");lg.innerHTML=ic("check");
  lg.onclick=()=>{if(fe[l.nome]){delete fe[l.nome];c.classList.remove("feito")}else{fe[l.nome]=1;c.classList.add("feito")}salva();prog()};
  head.appendChild(ab);head.appendChild(lg);c.appendChild(head);
  const vb=el("div","vb"),vi=el("div","vi"),ct=el("div","cartao");
  const caixa=(o,tel)=>{if(!o||!o.b)return;const w=el("div","arv");w.appendChild(el("div","ttl",o.t));const p=el("pre","corpo");
    pinta(p,o.b,tel,"tel:"+(l.telefone_tel||(tel||"").replace(/[^\d+]/g,"")));w.appendChild(p);ct.appendChild(w)};
  caixa(arvTopo(l),l.telefone);
  caixa(arvFortes(l));
  caixa(arvProblemas(l));
  caixa(arvOferta(l));
  if(arvLigacao(l))ct.appendChild(bloco("Ligação",arvLigacao(l),false));
  if(l.mensagem){const pm=paragrafos(l.mensagem);ct.appendChild(bloco("WhatsApp",pm,true));ct.appendChild(bloco("Instagram",pm,true))}
  vi.appendChild(ct);vb.appendChild(vi);c.appendChild(vb);m.appendChild(c);
});
prog();
</script></body></html>
